name: Sync OpenAPI spec

on:
  repository_dispatch:
    types: [openapi-spec-updated]
  workflow_dispatch:

concurrency:
  group: sync-spec
  cancel-in-progress: false

env:
  DOCS_REF: main
  LOCAL_SPEC_PATH: spec/openapi.yaml
  PR_BRANCH: chore/spec-sync
  API_CHANGELOG: API-CHANGELOG.md

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    env:
      DOCS_REPO: ${{ secrets.DOCS_REPO }}
      DOCS_SPEC_PATH: ${{ secrets.DOCS_SPEC_PATH }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Gate on spec blob SHA
        id: gate
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DOCS_REPO_TOKEN is not set"
            exit 1
          fi
          set -euo pipefail
          source .github/scripts/spec-source.sh
          local_blob_sha="$(git hash-object "$LOCAL_SPEC_PATH")"
          new_blob_sha="$(blob_sha "$DOCS_REPO" "$DOCS_SPEC_PATH" "$DOCS_REF")"
          echo "new_blob_sha=$new_blob_sha" >> "$GITHUB_OUTPUT"

          if [ "$new_blob_sha" = "$local_blob_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo '### Spec unchanged — nothing to do' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "spec blob changed: $local_blob_sha -> $new_blob_sha"
          fi

      # ---- everything below only runs when the spec actually changed ----

      - name: Resolve new docs commit SHA
        if: steps.gate.outputs.changed == 'true'
        id: docs_commit
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/spec-source.sh
          sha="$(resolve_commit_sha "$DOCS_REPO" "$DOCS_REF")"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docs commit sha has unexpected format" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Copy baseline spec and download new revision
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          DOCS_COMMIT_SHA: ${{ steps.docs_commit.outputs.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/spec-source.sh
          mkdir -p "$RUNNER_TEMP/base"
          cp "$LOCAL_SPEC_PATH" "$RUNNER_TEMP/base/openapi.yaml"
          download_spec "$DOCS_REPO" "$DOCS_SPEC_PATH" "$DOCS_COMMIT_SHA" \
            "$LOCAL_SPEC_PATH"

      - name: Build API change report
        if: steps.gate.outputs.changed == 'true'
        id: oasdiff
        run: |
          set -euo pipefail
          oasdiff() {
            docker run --rm \
              -v "$RUNNER_TEMP/base:/base:ro" \
              -v "$PWD/$(dirname "$LOCAL_SPEC_PATH"):/rev:ro" \
              tufin/oasdiff:v1.32.1 "$1" "/base/$(basename "$LOCAL_SPEC_PATH")" "/rev/$(basename "$LOCAL_SPEC_PATH")" \
              "${@:2}"
          }

          # `oasdiff diff` prints `{}` when the specs are semantically identical
          if diff_out="$(oasdiff diff)" && [ "$diff_out" = "{}" ]; then
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
            echo '### Spec changed only in formatting — no PR opened' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "api_changed=true" >> "$GITHUB_OUTPUT"

          oasdiff changelog -f markdown > "$RUNNER_TEMP/api-changelog-entry.md" || \
            echo "_oasdiff produced no report; review the spec diff manually._" > "$RUNNER_TEMP/api-changelog-entry.md"

      - name: Setup Node
        if: steps.oasdiff.outputs.api_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.oasdiff.outputs.api_changed == 'true'
        run: npm ci

      - name: Generate SDK from the new spec
        if: steps.oasdiff.outputs.api_changed == 'true'
        env:
          SHIPSTATION_SPEC_FILE: ${{ github.workspace }}/${{ env.LOCAL_SPEC_PATH }}
        run: npm run codegen

      - name: Validate (typecheck + lint + format + build)
        if: steps.oasdiff.outputs.api_changed == 'true'
        run: npm run verify

      - name: Test serialization of union request bodies
        if: steps.oasdiff.outputs.api_changed == 'true'
        run: npm test

      - name: Prepend entry to API-CHANGELOG.md
        if: steps.oasdiff.outputs.api_changed == 'true'
        run: |
          .github/scripts/prepend-changelog-entry.sh \
            "$RUNNER_TEMP/api-changelog-entry.md" "$API_CHANGELOG"

      - name: Build PR body
        if: steps.oasdiff.outputs.api_changed == 'true'
        env:
          DOCS_COMMIT_SHA: ${{ steps.docs_commit.outputs.sha }}
        run: |
          .github/scripts/build-pr-body.sh \
            "$DOCS_REPO" "$DOCS_SPEC_PATH" "$LOCAL_SPEC_PATH" \
            "$DOCS_COMMIT_SHA" "$RUNNER_TEMP/pr-body.md"

      - name: Create or update spec-sync PR
        if: steps.oasdiff.outputs.api_changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.SPEC_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ env.PR_BRANCH }}
          add-paths: |
            ${{ env.API_CHANGELOG }}
            ${{ env.LOCAL_SPEC_PATH }}
          commit-message: |
            feat: sync ShipStation API v2 spec
            Source: ${{ env.DOCS_REPO }}@${{ steps.docs_commit.outputs.sha }}
            Path:   ${{ env.DOCS_SPEC_PATH }}
          title: "feat: sync ShipStation API v2 spec"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            spec-sync
            automated
          delete-branch: true
          draft: false
