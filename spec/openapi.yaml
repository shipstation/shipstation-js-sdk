    multi_label_response_body:
      title: multi_label_response_body
      type: object

      description: |
        Response containing multiple labels created from a mailing request.
        Extends the standard label with a total cost summary and associated labels.

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/label"
        - type: object
          properties:
            total_cost:
              allOf:
                - $ref: "#/components/schemas/monetary_value"
              readOnly: true
              description: The combined cost of all labels in this mailing request.

            associated_labels:
              type: array
              readOnly: true
              description: The individual labels created for each shipment in the request.
              items:
                $ref: "#/components/schemas/create_label_response_body"

    create_label_rate_shopper_request_body:
      title: create_label_rate_shopper_request_body
      type: object

      description: Request body for creating a label using Rate Shopper

      required:
        - shipment

      additionalProperties: false

      properties:
        shipment:
          allOf:
            - $ref: "#/components/schemas/partial_shipment_for_rate_shopper"
          description: |
            Shipment details. Must NOT include carrier_id, service_code, or
            shipping_rule_id as Rate Shopper selects these automatically.

        label_format:
          type: string
          default: pdf
          allOf:
            - $ref: "#/components/schemas/label_format"

        label_layout:
          type: string
          default: 4x6
          allOf:
            - $ref: "#/components/schemas/label_layout"

        display_scheme:
          type: string
          default: label
          allOf:
            - $ref: "#/components/schemas/display_scheme"

        label_download_type:
          type: string
          enum:
            - url
            - inline
          default: url
          example: url
          description: |
            Specifies how the label should be downloaded.
            - url: Returns URLs to download the label
            - inline: Returns the label data inline in the response
    create_label_from_shipping_rule_request_body:
      title: create_label_from_shipping_rule_request_body
      type: object

      description: |
        Request body for creating a label using a Shipping Rule. The Shipping Rule automatically selects the carrier and service based on its configuration.

        **Important Constraints:**
        - You MUST NOT include `carrier_id`, `service_code`, or `shipping_rule_id` in the shipment (the Shipping Rule selects these automatically)

      required:
        - shipment

      additionalProperties: false

      properties:
        shipment:
          allOf:
            - $ref: "#/components/schemas/partial_shipment_for_shipping_rule"
          description: |
            Shipment details. Must NOT include carrier_id, service_code, or
            shipping_rule_id as the Shipping Rule selects these automatically.

        label_format:
          type: string
          default: pdf
          allOf:
            - $ref: "#/components/schemas/label_format"

        label_layout:
          type: string
          default: 4x6
          allOf:
            - $ref: "#/components/schemas/label_layout"

        display_scheme:
          type: string
          default: label
          allOf:
            - $ref: "#/components/schemas/display_scheme"

        label_download_type:
          type: string
          enum:
            - url
            - inline
          default: url
          example: url
          description: |
            Specifies how the label should be downloaded.
            - url: Returns URLs to download the label
            - inline: Returns the label data inline in the response
    partial_shipment_for_shipping_rule:
      title: partial_shipment_for_shipping_rule
      type: object

      description: |
        Shipment information for Shipping Rule. Must NOT include carrier_id, service_code,
        or shipping_rule_id as the Shipping Rule selects these automatically.

      additionalProperties: false

      properties:
        requested_shipment_service:
          type: string
          x-nullable: true
          description: The requested shipment service
          example: "usps_priority_mail"

        external_order_id:
          type: string
          x-nullable: true
          example: "1232434"
          description: ID that the Order Source assigned

        hold_until_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date to hold the shipment until
          example: "2025-01-15T00:00:00.000Z"

        ship_by_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date by which the shipment should be shipped
          example: "2025-01-15T00:00:00.000Z"

        deliver_by_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date by which the shipment should be delivered
          example: "2025-01-20T00:00:00.000Z"

        retail_rate:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The retail rate for the shipment

        store_id:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The store ID associated with the shipment
          example: "se-12345"

        items:
          type: array
          default: []
          items:
            allOf:
              - $ref: "#/components/schemas/shipment_item"
          description: |
            Describe the packages included in this shipment as related to potential metadata that was imported from
            external order sources

        notes_from_buyer:
          type: string
          x-nullable: true
          description: Notes from the buyer
          example: "Please handle with care"

        notes_to_buyer:
          type: string
          x-nullable: true
          description: Notes to the buyer
          example: "Thank you for your order!"

        notes_for_gift:
          type: string
          x-nullable: true
          description: Gift notes
          example: "Happy Birthday!"

        internal_notes:
          type: string
          x-nullable: true
          description: Internal notes from the seller
          example: "Check packaging before shipping"

        is_gift:
          type: boolean
          default: false
          description: Indicates if the shipment is a gift
          example: true

        assigned_user:
          type: string
          x-nullable: true
          description: User assigned to the shipment
          example: "user@example.com"

        amount_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Total amount paid for the order

        shipping_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for shipping

        tax_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for taxes

        zone:
          type: integer
          format: int32
          x-nullable: true
          minimum: 0
          description: Shipping zone
          example: 1

        display_scheme:
          type: string
          x-nullable: true
          description: Display scheme for the shipment
          example: "label"

        tax_identifiers:
          type: array
          x-nullable: true
          items:
            allOf:
              - $ref: "#/components/schemas/tax_identifier"

        external_shipment_id:
          type: string
          maxLength: 50
          x-nullable: true
          example: "1234556"
          description: |
            A user-defined key that identifies the source order. Multiple shipments can share the same `external_shipment_id` (common in split-shipping scenarios where one order results in multiple shipments). Functionally identical to `orderKey` in V1 API.

            > **Warning:** The `external_shipment_id` is limited to 50 characters. Any additional characters will be truncated.

        shipment_number:
          type: string
          maxLength: 50
          x-nullable: true
          readOnly: false
          example: "10001"
          description: |
            A non-unique user-defined number used to identify a shipment.  If undefined, this will match the external_shipment_id of the shipment.

            > **Warning:** The `shipment_number` is limited to 50 characters. Any additional characters will be truncated.

        ship_date:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/date"
          description: |
            The date that the shipment was (or will be) shipped.  ShipStation will take the day of week into consideration. For example, if the carrier does not operate on Sundays, then a package that would have shipped on Sunday will ship on Monday instead.

        ship_to:
          allOf:
            - $ref: "#/components/schemas/shipping_address_to"
          description: The recipient's mailing address

        ship_from:
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The shipment's origin address. If you frequently ship from the same location, consider [creating a warehouse].  Then you can simply specify the `warehouse_id` rather than the complete address each time.

        warehouse_id:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The [warehouse] that the shipment is being shipped from.  Either `warehouse_id` or `ship_from` must be specified.

        return_to:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The return address for this shipment.  Defaults to the `ship_from` address.  Can be sent with a warehouse_id, in which case the return address can be overridden.  This allows you to have a different address printed on the label while maintaining the origin address.

        is_return:
          type: boolean
          x-nullable: true
          default: false
          description: |
            An optional indicator if the shipment is intended to be a return. Defaults to false if not provided.
          example: true

        confirmation:
          default: none
          allOf:
            - $ref: "#/components/schemas/delivery_confirmation"
          description: The type of delivery confirmation for this shipment. Defaults to 'none' if not specified.

        customs:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/international_shipment_options"
          description: |
            Customs information.  This is usually only needed for international shipments.

        advanced_options:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/advanced_shipment_options"
          description: Advanced shipment options.  These are entirely optional.

        insurance_provider:
          default: none
          allOf:
            - $ref: "#/components/schemas/insurance_provider"
          description: |
            The insurance provider to use for any insured packages in the shipment.

        tags:
          type: array
          readOnly: false
          default: []
          minItems: 0
          items:
            allOf:
              - $ref: "#/components/schemas/tag"
          description: |
            Arbitrary tags associated with this shipment.  Tags can be used to categorize shipments, and shipments can be queried by their tags. Note: Tags require object structure with name property, not simple strings.

        order_source_code:
          allOf:
            - $ref: "#/components/schemas/order_source_name"

        packages:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/package"
          description: |
            The packages in the shipment.

            > **Note:** Some carriers only allow one package per shipment.  If you attempt to create a multi-package shipment for a carrier that doesn't allow it, an error will be returned.

        comparison_rate_type:
          x-nullable: true
          type: string
          description: Calculate a rate for this shipment with the requested carrier using a ratecard that differs from the default.  Only supported for UPS and USPS.
          example: "retail"
