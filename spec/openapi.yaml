        $ref: "#/components/schemas/se_id"
      description: The Manifest Id

    manifest_request_id_path_param:
      name: manifest_request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/se_id"
      description: The Manifest Request Id

    subdir_path_param:
      name: subdir
      in: path
      required: true
      schema:
        type: string

    modified_at_end_query_param:
      name: modified_at_end
      in: query
      required: false
