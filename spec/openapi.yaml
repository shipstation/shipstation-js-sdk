  /v2/labels/rate_shopper_id/{rate_shopper_id}:
    x-visibility: public
    summary: Use Rate Shopper to purchase a label
    description: |
      Automatically select the optimal carrier and service based on your
      specified strategy or custom rate shopper configuration, then purchase
      a label.

      **Standard strategies** (`cheapest`, `fastest`, `best_value`): The Rate
      Shopper analyzes available rates across your connected carriers and selects
      the best option according to the chosen strategy.

      **Custom rate shoppers** (service collection GUID): Uses your configured
      service collection to determine which carrier/service combinations are
      eligible, applies transit time filtering (with separate domestic/international
      thresholds), and selects the cheapest qualifying rate. This feature requires
      an Advanced plan. Free plan can only use the default standard strategies.

    parameters:
      - $ref: "#/components/parameters/rate_shopper_id_path_param"

    post:
      summary: Purchase label with rate shopper
      description: |
        Create a label using Rate Shopper to automatically select the best
        carrier and service based on the specified strategy or custom rate
        shopper configuration.

        You can use a standard strategy (`cheapest`, `fastest`, `best_value`)
        or pass a custom rate shopper ID (service collection GUID) to use your
        own configured service collection for rate selection.

        For more information about Rate Shopper strategies and use cases, see [Rate Shopping](/rate-shopping#automatic-label-creation-with-rate-shopper).

      tags:
        - labels
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: create_label_from_rate_shopper

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_label_rate_shopper_request_body"

      responses:
        200:
          description: Label created successfully using Rate Shopper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/create_label_rate_shopper_response_body"

        400:
          description: |
            Bad Request. Possible causes:
            - Request body is missing
            - `rate_shopper_id` is not a valid standard strategy or GUID
            - Custom rate shopper not found (invalid GUID or not owned by seller)
            - Custom rate shopper is not active
            - No rates available for the shipment
            - Unable to resolve carrier and service using the specified custom rate shopper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        404:
          $ref: "#/components/responses/NotFound"

        500:
          $ref: "#/components/responses/ServerError"
  /v2/labels/shipping_rules/{shipping_rule_id}:
    x-visibility: public
    summary: Purchase label using a shipping rule
    description: |
      Purchase and print a label using a Shipping Rule to automatically select
      carrier and service based on the configured rule.

    parameters:
      - name: shipping_rule_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/se_id"
        description: Shipping Rule ID

    post:
      summary: Purchase label with shipping rule
      description: |
        Purchase and print a shipping label using a Shipping Rule. The Shipping Rule automatically selects the optimal carrier and service based on the rule's configuration.

        **Dynamic Ordering**: Service Group Rules can now use dynamic ordering (_Cheapest_ or _Fastest_) to automatically rank eligible services in real time based on live rate or transit data. This feature is currently available for US sellers with USA domestic carrier services only. For more details, see the [Configuring "Order Services By" guide](/apis/@shipstation-v2/docs/shipping/shipping-rules-configuring-order-services-by.md).

        The request body must NOT include `carrier_id`, `service_code`, or `shipping_rule_id` in the shipment object. If any of these fields are provided, the API will return a `400 Bad Request` error.

        > **Important:** While calls to this endpoint from ShipStation native accounts will not fail with a 401 Unauthorized or 402 Payment Required error, Shipping Rules are not available to ShipStation accounts, preventing successful use of this endpoint. This endpoint may only be used by ShipStation API (formerly ShipEngine) accounts.

      tags:
        - labels
      x-plan:
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: create_label_from_shipping_rule
      requestBody:
        required: true
