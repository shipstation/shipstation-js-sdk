          description: The freight shipment ID is malformed, or the provider rejected the cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        404:
          description: The freight shipment does not exist on this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/shipments/{freight_shipment_id}/documents:
