          type: [string, "null"]
          description: Universal Product Code
          example: "123-4"
        thumbnail_url:
          type: [string, "null"]
          description: URL to product thumbnail image
          example: "www.image.com"
        price:
          type: object
          properties:
            currency:
              type: string
              description: Currency code
              example: "usd"
            amount:
              type: number
              description: Price amount
              example: 88.00
        dimensions:
          type: object
          properties:
            unit:
              type: string
              description: Unit of measurement
              example: "inch"
            length:
              type: number
              description: Length dimension
              example: 9.00
            width:
              type: number
              description: Width dimension
              example: 5.00
            height:
              type: number
              description: Height dimension
              example: 7.00
        weight:
          type: object
          properties:
            value:
              type: number
              description: Weight value
              example: 99.20
            unit:
              type: string
              description: Weight unit
              example: "ounce"
        internal_notes:
          type: [string, "null"]
          description: Internal notes about the product
          example: "Describe your item"
        fulfillment_sku:
          type: [string, "null"]
          description: Fulfillment SKU
          example: "widget-2"
        create_date:
          type: string
          format: date-time
          description: Date when product was created
          example: "2025-07-07T20:10:02.13Z"
        modify_date:
          type: string
          format: date-time
          description: Date when product was last modified
          example: "2025-07-07T20:10:02.13Z"
        active:
          type: boolean
          description: Whether the product is active
          example: true
        product_category:
          type: [object, "null"]
          properties:
            product_category_id:
              type: integer
              example: 26663
            name:
              type: string
              example: "Example-category"
        preset_group:
          type: [string, "null"]
          description: Preset group
          example: "Default"
        warehouse_location:
          type: [string, "null"]
          description: Warehouse location
          example: "BIN 43-6"
        default_carrier_code:
          type: [string, "null"]
          description: Default carrier code
          example: "stamps_com"
        default_service_code:
          type: [string, "null"]
          description: Default service code
          example: "usps_first_class_mail"
        default_package_code:
          type: [string, "null"]
          description: Default package code
          example: "large_flat_rate_box"
        default_intl_carrier_code:
          type: [string, "null"]
          description: Default international carrier code
          example: "stamps_com"
        default_intl_service_code:
          type: [string, "null"]
          description: Default international service code
          example: "usps_priority_mail_international"
        default_intl_package_code:
          type: [string, "null"]
          description: Default international package code
          example: "package"
        default_confirmation:
          type: [string, "null"]
          description: Default confirmation type
          example: "none"
        default_intl_confirmation:
          type: [string, "null"]
          description: Default international confirmation type
          example: "delivery"
        customs_description:
          type: [string, "null"]
          description: Customs description
          example: "An object going internationally"
        customs_value:
          type: [number, "null"]
          description: Customs value
          example: 20.00
        customs_tariff_no:
          type: [string, "null"]
          description: Customs tariff number
          example: "0245.56.13"
        customs_country_code:
          type: [string, "null"]
          description: Customs country code
          example: "US"
        no_customs:
          type: [boolean, "null"]
          description: Whether customs is required
          example: null
        tags:
          type: [array, "null"]
          items:
            type: object
            properties:
              tag_id:
                type: integer
                example: 21121
              name:
                type: string
                example: "Sample Tag"
              color:
                type: string
                example: "#800080"
        aliases:
          type: [array, "null"]
          items:
            type: object
            properties:
              store_id:
                type: integer
                example: 2095811
              sku_alias:
                type: string
                example: "alt-sku"
        product_type:
          type: [string, "null"]
          description: Product type
          example: "standalone"
        is_returnable:
          type: boolean
          description: Whether the product is returnable
          example: false
        should_override_name:
          type: [boolean, "null"]
          description: Whether to override the product name
          example: true
        is_bundle:
          type: [boolean, "null"]
          description: Whether the product is a bundle
          example: true
        bundle_components:
          type: [array, "null"]
          items:
            type: object
            properties:
              bundle_product_id:
                type: integer
                example: 10736791
              component_product_id:
                type: integer
                example: 10408926
              sku:
                type: string
                example: "New-SKU"
              quantity:
                type: integer
                example: 3
              active:
                type: boolean
                example: true
