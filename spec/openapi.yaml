          example: This is my batch
          description: Add custom messages for a particular batch

        assigned_user:
          type: string
          format: uuid
          example: "a2df9fa5-b7ee-467f-be4e-9c660542c187"
          description: Assign a user to the batch at creation time. The user must be an active member of your account.

        shipment_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
          description: Array of shipment IDs used in the batch

        rate_ids:
          type: array
          items:
            type: string
            minLength: 1
            allOf:
              - $ref: "#/components/schemas/se_id"
          description: Array of rate IDs used in the batch

    validate_address_request_body:
      type: array
      description: An address validation request body
      items:
        type: object
        description: Any residential or business mailing address, anywhere in the world
        required:
          - address_line1
          - city_locality
          - state_province
          - country_code
        properties:
          name:
            type: string
            minLength: 1
            example: John Doe
            description: The name of a contact person at this address
          phone:
            type: string
            minLength: 1
            example: +1 204-253-9411 ext. 123
            description: The phone number of a contact person at this address
          company_name:
            type: [string, "null"]
            minLength: 1
            example: The Home Depot
            description: If this is a business address, then the company name should be specified here
          address_line1:
            type: string
            minLength: 1
            example: 1999 Bishop Grandin Blvd.
            description: The first line of the street address
          address_line2:
            anyOf:
              - type: string
                minLength: 1
              - type: "null"
            example: Unit 408
            description: The second line of the street address
          address_line3:
            anyOf:
              - type: string
                minLength: 1
              - type: "null"
            example: "Building #7"
            description: The third line of the street address
          city_locality:
            type: string
            minLength: 1
            example: Winnipeg
            description: The name of the city or locality
          state_province:
            type: string
            minLength: 1
            example: Manitoba
            description: The state or province
          postal_code:
            type: string
            minLength: 1
            example: "78756"
            description: postal code
          country_code:
            type: string
            minLength: 2
            maxLength: 2
            example: CA
            description: The two-letter ISO 3166-1 country code
          address_residential_indicator:
            type: string
            example: "no"
            description: Indicates whether this is a residential address

    validate_address_response_body:
      type: array
      description: An address validation response body
      items:
        type: object
        description: An address validation result
        required:
          - status
          - original_address
          - matched_address
          - messages
        additionalProperties: false
        properties:
          status:
            type: string
            enum:
              - unverified
              - verified
              - warning
              - error
            description: The address validation status
            example: verified
          original_address:
            type: object
            description: The original address that was sent for validation
            properties:
              name:
                type: string
                example: Mickey and Minnie Mouse
              phone:
                type: string
                example: 714-781-4565
              company_name:
                anyOf:
                  - type: string
                  - type: "null"
                example: The Walt Disney Company
              address_line1:
                type: string
                example: 500 South Buena Vista Street
              address_line2:
                anyOf:
                  - type: string
                  - type: "null"
                example: null
              address_line3:
                anyOf:
                  - type: string
                  - type: "null"
                example: null
              city_locality:
                type: string
                example: Burbank
              state_province:
                type: string
                example: CA
              postal_code:
                type: string
                example: "91521"
              country_code:
                type: string
                example: US
              address_residential_indicator:
                type: string
                example: unknown
          matched_address:
            anyOf:
              - type: object
              - type: "null"
            readOnly: true
            description: The matched address found by the ShipStation API API
            properties:
              name:
                type: string
                example: MICKEY AND MINNIE MOUSE
              phone:
                type: string
                example: 714-781-4565
              company_name:
                anyOf:
                  - type: string
                  - type: "null"
                example: THE WALT DISNEY COMPANY
              address_line1:
                type: string
                example: 500 S BUENA VISTA ST
              address_line2:
                anyOf:
                  - type: string
                  - type: "null"
                example: null
              address_line3:
                anyOf:
                  - type: string
                  - type: "null"
                example: null
              city_locality:
                type: string
                example: BURBANK
              state_province:
                type: string
                example: CA
              postal_code:
                type: string
                example: "91521-0007"
              country_code:
                type: string
                example: US
              address_residential_indicator:
                type: string
                example: "no"
          messages:
            type: array
            readOnly: true
            default: []
            description: The list of messages that were generated during the address validation request
            items:
              type: object
              description: A response message
              additionalProperties: false
              required:
                - code
                - message
                - type
                - detail_code
              properties:
                code:
                  type: string
                  readOnly: true
                  example: a1004
                  description: The message code
                message:
                  type: string
                  readOnly: true
                  example: Address verified successfully
                  description: The message text
                type:
                  type: string
                  enum:
                    - info
                    - warning
                    - error
                  readOnly: true
                  example: info
                  description: The message type
                detail_code:
                  type: string
                  readOnly: true
                  example: address_verified
                  description: The detailed message code

    manufacturer_product_identifier_type:
      title: manufacturer_product_identifier_type
      type: string
      enum:
        - undefined
        - gtin
        - ean
        - isbn
        - upc
        - mpn
        - sku
      description: The type of manufacturer product identifier. GTIN (Global Trade Item Number), EAN (European Article Number), ISBN (International Standard Book Number), UPC (Universal Product Code), MPN (Manufacturer Part Number), SKU (Stock Keeping Unit). Use `undefined` when the specific identifier type is not defined in this list.

    cpsc_certificate:
      title: cpsc_certificate
      type: object
      description: A US Consumer Product Safety Commission (CPSC) eFiling certificate associated with a product in the shipment.
      additionalProperties: false
      properties:
        certifier_id:
          type: string
          maxLength: 50
          description: Unique identifier assigned to the certifier by the CPSC.
          example: "CERT-12345"
        certificate_version_id:
          type: string
          maxLength: 50
          description: The version identifier of the CPSC certificate.
          example: "v1.0"

    checkout_rates_service_selection:
      title: checkout_rates_service_selection
      type: object
      description: |
        A carrier and service pairing used by `live_rate` and `local_delivery` delivery options. Both fields are required for each entry.
      additionalProperties: false
      required:
        - carrier_id
        - service_code
      properties:
        carrier_id:
          type: string
          pattern: "^se-[0-9]+$"
          example: se-1234567
          description: |
            The ID of a carrier connected to your account, in the format `se-` followed by digits (for example, `se-1234567`). A value that does not match this format is rejected with a validation error, and a well-formed ID that is not connected to your account is rejected as an invalid identifier.
        service_code:
          type: string
          minLength: 1
          example: usps_priority_mail
          description: |
            The service code of the carrier service to rate (for example, `usps_priority_mail`). Required for each service; a service code that is not available for the carrier is rejected as an invalid identifier.

    checkout_rates_dimensions_by_weight:
      title: checkout_rates_dimensions_by_weight
      type: object
      description: |
        A default package size to apply to carts whose total weight is at or below `max_weight`. Used when the configuration calculates live rates without explicit package dimensions.
      additionalProperties: false
      properties:
        max_weight:
          allOf:
            - $ref: "#/components/schemas/weight"
          description: The upper weight bound this default package applies to.
        default_dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The default package dimensions to use for carts within this weight bound.

    checkout_rates_shared_settings:
      title: checkout_rates_shared_settings
      type: object
      description: |
        Settings shared by every delivery option in a configuration, controlling how live rates are calculated.
      additionalProperties: false
      properties:
        calculation_method:
          type: string
          enum:
            - by_volume
            - skip_dimensions
          example: by_volume
          description: |
            How package dimensions are determined when calculating live rates. `by_volume` derives a package size from the cart; `skip_dimensions` rates without dimensions.
        dimensions_by_weight:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_dimensions_by_weight"
          description: Default package dimensions applied to carts by weight bound.

    checkout_rates_option_request_body:
      title: checkout_rates_option_request_body
      type: object
      description: |
        The configuration of a single delivery option. The fields that apply depend on `type`:

        - `live_rate` and `local_delivery` use `services` (and may apply `fee_mode`/`fee_percentage`); `live_rate` may also define a `fallback_mode`.
        - `flat_rate` uses `amount`/`currency`.
        - `free` requires no additional fields.
      additionalProperties: false
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          example: Standard Shipping
          description: The display name of the delivery option. Must be unique within the configuration.
        type:
          type: string
          enum:
            - live_rate
            - flat_rate
            - free
            - local_delivery
          example: live_rate
          description: The kind of delivery option.
        services:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_service_selection"
          description: The carrier/service pairings to rate. Applies to `live_rate` and `local_delivery` options.
        fee_mode:
          type: string
          enum:
            - add
            - subtract
          example: add
          description: |
            Whether the fee defined by `fee_percentage` is added to or subtracted from the carrier rate. Omit for a pass-through rate.
        fee_percentage:
          type: number
          example: 10
          description: The percentage of the carrier rate to add or subtract, according to `fee_mode`.
        sort_index:
          type: integer
          example: 0
          description: The position of this option relative to the others in the configuration, ascending.
        fallback_mode:
          type: string
          enum:
            - dont_show
            - flat_rate
            - cart_percentage
          example: flat_rate
          description: |
            What to show when live rates cannot be retrieved. `dont_show` hides the option; `flat_rate` shows `fallback_rate_amount`/`fallback_rate_currency`; `cart_percentage` shows `fallback_percentage` of the cart total.
        fallback_rate_amount:
          type: number
          example: 5.00
          description: The fixed fallback price, when `fallback_mode` is `flat_rate`.
        fallback_rate_currency:
          type: string
          example: USD
          description: The currency of `fallback_rate_amount`.
        fallback_percentage:
          type: number
          example: 5.0
          description: The percentage of the cart total to charge, when `fallback_mode` is `cart_percentage`.
        amount:
          type: number
          example: 4.99
          description: The fixed price for a `flat_rate` option.
        currency:
          type: string
          example: USD
          description: The currency of `amount`.

    checkout_rates_option_response_body:
      title: checkout_rates_option_response_body
      type: object
      description: A delivery option belonging to a checkout rates configuration.
      additionalProperties: false
      properties:
        option_id:
          type: integer
          readOnly: true
          example: 100001
          description: The unique identifier of the delivery option.
        config_id:
          type: string
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: The identifier of the configuration this option belongs to.
        name:
          type: string
          example: Standard Shipping
          description: The display name of the delivery option.
        type:
          type: string
          enum:
            - live_rate
            - flat_rate
            - free
            - local_delivery
          example: live_rate
          description: The kind of delivery option.
        services:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_service_selection"
          description: The carrier/service pairings rated by this option, when applicable.
        fee_mode:
          type: string
          enum:
            - add
            - subtract
          example: add
          description: Whether `fee_percentage` is added to or subtracted from the carrier rate.
        fee_percentage:
          type: number
          example: 10
          description: The percentage of the carrier rate added or subtracted, according to `fee_mode`.
        sort_index:
          type: integer
          example: 0
          description: The position of this option relative to the others in the configuration, ascending.
        fallback_mode:
          type: string
          enum:
            - dont_show
            - flat_rate
            - cart_percentage
          example: flat_rate
          description: What is shown when live rates cannot be retrieved.
        fallback_rate_amount:
          type: number
          example: 5.00
          description: The fixed fallback price, when `fallback_mode` is `flat_rate`.
        fallback_rate_currency:
          type: string
          example: USD
          description: The currency of `fallback_rate_amount`.
        fallback_percentage:
          type: number
          example: 5.0
          description: The percentage of the cart total charged, when `fallback_mode` is `cart_percentage`.
        amount:
          type: number
          example: 0.00
          description: The fixed price for a `flat_rate` option.
        currency:
          type: string
          example: USD
          description: The currency of `amount`.
        is_active:
          type: boolean
          readOnly: true
          example: true
          description: Whether the option is active and shown at checkout.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T18:30:00Z"
          description: When the option was created.

    create_checkout_rates_config_request_body:
      title: create_checkout_rates_config_request_body
      type: object
      description: The configuration to create, including its initial delivery options and shared settings.
      additionalProperties: false
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_option_request_body"
          description: The delivery options to create with the configuration.
        shared_settings:
          allOf:
            - $ref: "#/components/schemas/checkout_rates_shared_settings"
          description: Settings shared by every option in the configuration.

    checkout_rates_config_response_body:
      title: checkout_rates_config_response_body
      type: object
      description: A checkout rates configuration with its delivery options and shared settings.
      additionalProperties: false
      properties:
        config_id:
          type: string
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: The unique identifier of the configuration.
        options:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_option_response_body"
          description: The delivery options in the configuration.
        shared_settings:
          allOf:
            - $ref: "#/components/schemas/checkout_rates_shared_settings"
          description: Settings shared by every option in the configuration.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T18:30:00Z"
          description: When the configuration was created.

    checkout_rates_config_summary:
      title: checkout_rates_config_summary
      type: object
      description: An identifying summary of a checkout rates configuration, as returned when listing configurations.
      additionalProperties: false
      properties:
        config_id:
          type: string
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: The unique identifier of the configuration.
        is_active:
          type: boolean
          readOnly: true
          example: true
          description: Whether the configuration is active.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-05-15T18:30:00Z"
          description: When the configuration was created.

    list_checkout_rates_configs_response_body:
      title: list_checkout_rates_configs_response_body
      type: array
      description: The checkout rates configurations on the account.
      items:
        $ref: "#/components/schemas/checkout_rates_config_summary"

    checkout_rates_ship_to:
      title: checkout_rates_ship_to
      type: object
      description: The destination address to calculate rates for.
      additionalProperties: false
      properties:
        address_type:
          type: string
          example: residential
          description: The kind of address, when known (for example, `residential` or `commercial`).
        address_line1:
          type: string
          example: 525 S Winchester Blvd
          description: The first line of the street address.
        address_line2:
          type: string
          example: Suite 200
          description: The second line of the street address, when applicable.
        address_line3:
          type: string
          example: Apt 12
          description: The third line of the street address, when applicable.
        city_locality:
          type: string
          example: San Jose
          description: The city or locality.
        state_province:
          type: string
          example: CA
          description: The state or province.
        postal_code:
          type: string
          example: "95128"
          description: The postal code.
        country_code:
          type: string
          example: US
          description: The ISO 3166-1 alpha-2 country code.

    checkout_rates_ship_from:
      title: checkout_rates_ship_from
      type: object
      description: |
        The origin address to calculate rates from. When this address is omitted, rates are calculated from the origin on the account's registration.

        The origin applies to `live_rate` and `local_delivery` options. Pickup point options are unaffected.
      additionalProperties: false
      required:
        - postal_code
        - country_code
      properties:
        address_type:
          type: string
          example: commercial
          description: The kind of address, when known (for example, `residential` or `commercial`). Treated as unknown when omitted.
        address_line1:
          type: string
          example: 500 Warehouse Rd
          description: The first line of the street address.
        address_line2:
          type: string
          example: Dock 4
          description: The second line of the street address, when applicable.
        address_line3:
          type: string
          example: Bay 9
          description: The third line of the street address, when applicable.
        city_locality:
          type: string
          example: Austin
          description: The city or locality.
        state_province:
          type: string
          example: TX
          description: The state or province.
        postal_code:
          type: string
          example: "78702"
          description: The postal code. Required when `ship_from` is supplied.
        country_code:
          type: string
          example: US
          description: The ISO 3166-1 alpha-2 country code. Required when `ship_from` is supplied.

    checkout_rates_item:
      title: checkout_rates_item
      type: object
      description: A line item in the cart being rated.
      additionalProperties: false
      properties:
        name:
          type: string
          example: T-Shirt
          description: The name of the item.
        quantity:
          type: integer
          example: 2
          description: The number of units of the item in the cart.
        sku:
          type: string
          example: SKU-1234
          description: The stock keeping unit (SKU) of the item.
        price:
          type: number
          example: 19.99
          description: The unit price of the item.
        weight:
          allOf:
            - $ref: "#/components/schemas/weight"
          description: The weight of a single unit of the item.
        dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The dimensions of a single unit of the item.

    calculate_checkout_rates_request_body:
      title: calculate_checkout_rates_request_body
      type: object
      description: The destination and cart contents to calculate checkout rates for, and optionally the origin to calculate them from.
      additionalProperties: false
      required:
        - ship_to
        - items
      properties:
        ship_from:
          allOf:
            - $ref: "#/components/schemas/checkout_rates_ship_from"
          description: The origin to calculate rates from. Optional; when omitted, the origin comes from the account's registration.
        ship_to:
          allOf:
            - $ref: "#/components/schemas/checkout_rates_ship_to"
          description: The destination address.
        items:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_item"
          description: The items in the cart.
        currency:
          type: string
          example: USD
          description: The currency to return rates in.

    checkout_rates_rate_option:
      title: checkout_rates_rate_option
      type: object
      description: A single rate returned for a delivery option. Each rate is an individually retrievable quote identified by its own `quote_id`.
      additionalProperties: false
      properties:
        quote_id:
          type: string
          readOnly: true
          example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
          description: The unique identifier of this rate's quote. Use it to retrieve the quote later with [Get a checkout rate quote](#operation/get_checkout_rates_quote).
        option_id:
          type: integer
          readOnly: true
          example: 100001
          description: The identifier of the delivery option this rate was produced for.
        option_name:
          type: string
          readOnly: true
          example: Standard Shipping
          description: The display name of the delivery option.
        type:
          type: string
          readOnly: true
          enum:
            - live_rate
            - flat_rate
            - free
            - local_delivery
          example: live_rate
          description: The delivery option type this rate corresponds to (for example, `live_rate` or `free`).
        carrier_id:
          type: [string, "null"]
          readOnly: true
          example: se-1234567
          description: The carrier this rate is for. `null` for options without a carrier (for example, `free`).
        service_code:
          type: [string, "null"]
          readOnly: true
          example: usps_priority_mail
          description: The carrier service this rate is for. `null` for options without a carrier service.
        final_amount:
          type: number
          readOnly: true
          example: 10.69
          description: The price shown to the buyer after fees or fallbacks are applied.
        currency:
          type: string
          readOnly: true
          example: USD
          description: The currency of `final_amount`.
        estimated_delivery_days:
          type: [integer, "null"]
          readOnly: true
          example: 2
          description: The estimated number of days in transit, when available.
        estimated_delivery_date:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: "2026-06-26T00:00:00Z"
          description: The estimated delivery date, when available.

    calculate_checkout_rates_response_body:
      title: calculate_checkout_rates_response_body
      type: object
      description: The rates calculated for a cart. Each rate carries its own `quote_id`.
      additionalProperties: false
      properties:
        config_id:
          type: string
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: The configuration the rates were calculated against.
        rates:
          type: array
          items:
            $ref: "#/components/schemas/checkout_rates_rate_option"
          description: The rates to display at checkout, one entry per delivery option that produced a rate. Each entry has its own `quote_id`.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-06-24T10:00:00Z"
          description: When the quote was calculated.

    checkout_rates_quote_response_body:
      title: checkout_rates_quote_response_body
      type: object
      description: A previously calculated rate quote.
      additionalProperties: false
      properties:
        config_id:
          type: string
          readOnly: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          description: The configuration the rate was calculated against.
        quote:
          allOf:
            - $ref: "#/components/schemas/checkout_rates_rate_option"
          description: The rate returned for this quote, including its `quote_id`.
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-06-24T10:00:00Z"
          description: When the quote was calculated.

    freight_address:
      title: freight_address
      type: object
      description: |
        An origin or destination address for a freight shipment. LTL carriers require a contact name, company name, and phone number at both ends of the shipment so the driver can arrange pickup and delivery.
      additionalProperties: false
      required:
        - name
        - company_name
        - address_line1
        - city_locality
        - state_province
        - postal_code
        - country_code
        - phone
      properties:
        name:
          type: string
          example: Marcus Bell
          description: The name of the contact person at this location.
        company_name:
          type: string
          example: Northgate Distribution
          description: The name of the business at this location.
        address_line1:
          type: string
          example: 4200 Industrial Pkwy
          description: The first line of the street address.
        address_line2:
          type: [string, "null"]
          example: Dock 12
          description: The second line of the street address, such as a dock or suite number.
        city_locality:
          type: string
          example: Grand Rapids
          description: The city or locality.
        state_province:
          type: string
          example: MI
          description: The state or province.
        postal_code:
          type: string
          example: "49512"
          description: The postal code.
        country_code:
          type: string
          example: US
          description: The two-letter ISO 3166-1 alpha-2 country code.
        phone:
          type: string
          example: "+1 616 555 0142"
          description: The phone number of the contact person. Carriers call this number to arrange pickup or delivery.
        email:
          type: [string, "null"]
          example: dock@northgate-dist.example
          description: The email address of the contact person.
        location_type:
          type: [string, "null"]
          enum:
            - airport
            - carrier_terminal
            - commercial
            - construction
            - container_freight_station
            - distribution_center
            - government_facility
            - limited_access
            - pier_port_wharf
            - residential
            - secured_access
            - trade_show
            - null
          example: commercial
          description: |
            How the carrier should classify this location. Location type affects accessorial charges — for example, residential and limited-access locations usually carry a surcharge. An unrecognized value is rejected with a `400 Bad Request`.

    freight_tradeshow:
      title: freight_tradeshow
      type: object
      description: Identifies a tradeshow when picking up from or delivering to one.
      additionalProperties: false
      properties:
        name:
          type: string
          example: Midwest Home & Garden Expo
          description: The name of the tradeshow.
        booth_number:
          type: string
          example: "B-1147"
          description: The booth number at the tradeshow.

    freight_accessorials:
      title: freight_accessorials
      type: object
      description: |
        Additional services requested from the carrier. Accessorials affect the price of every quote, so request them when you quote — there is no `accessorials` field on the booking request. The offer you book already carries the accessorials it was priced with, so adding one afterwards requires requesting fresh quotes.
      additionalProperties: false
      properties:
        liftgate_pickup:
          type: boolean
          default: false
          example: true
          description: The origin has no loading dock and the driver needs a liftgate to load the freight.
        inside_pickup:
          type: boolean
          default: false
          example: false
          description: The driver needs to collect the freight from inside the building rather than at the dock or curb.
        carrier_terminal_pickup:
          type: boolean
          default: false
          example: false
          description: The freight is dropped off at the carrier's terminal instead of being collected.
        grocery_consolidation_pickup:
          type: boolean
          default: false
          example: false
          description: The origin is a grocery consolidation facility.
        liftgate_delivery:
          type: boolean
          default: false
          example: true
          description: The destination has no loading dock and the driver needs a liftgate to unload the freight.
        inside_delivery:
          type: boolean
          default: false
          example: false
          description: The driver needs to bring the freight inside the building rather than leave it at the dock or curb.
        appointment_delivery:
          type: boolean
          default: false
          example: false
          description: The carrier must schedule a delivery appointment with the consignee.
        notify_before_delivery:
          type: boolean
          default: false
          example: true
          description: The carrier must call the consignee before delivering.
        hold_at_terminal:
          type: boolean
          default: false
          example: false
          description: The carrier holds the freight at the destination terminal for the consignee to collect.
        grocery_consolidation_delivery:
          type: boolean
          default: false
          example: false
          description: The destination is a grocery consolidation facility.
        sort_and_segregate:
          type: boolean
          default: false
          example: false
          description: The carrier sorts or segregates the freight on delivery.
        protection_from_cold:
          type: boolean
          default: false
          example: false
          description: The freight must be protected from freezing.
        protection_from_heat:
          type: boolean
          default: false
          example: false
          description: The freight must be protected from heat.
        tradeshow_pickup:
          allOf:
            - $ref: "#/components/schemas/freight_tradeshow"
          description: The freight is collected from a tradeshow. Providing this object requests the tradeshow pickup accessorial.
        tradeshow_delivery:
          allOf:
            - $ref: "#/components/schemas/freight_tradeshow"
          description: The freight is delivered to a tradeshow. Providing this object requests the tradeshow delivery accessorial.

    freight_insurance:
      title: freight_insurance
      type: object
      description: |
        Requests cargo insurance for the shipment. When present, quotes include the insurance premium and, once bound, a certificate number. Insured values are always in USD.
      additionalProperties: false
      required:
        - insured_value
      properties:
        insured_value:
          type: number
          format: double
          example: 18500
          description: |
            The declared value of the freight to insure, in USD. Always send this: it is not currently validated, so omitting it requests insurance with a declared value of `0` rather than returning an error.
        item_condition:
          type: [string, "null"]
          enum:
            - new
            - used
            - null
          default: new
          example: new
          description: |
            The condition of the insured goods. Maximum liability differs between new and used freight. Unrecognized values are ignored rather than rejected.
        commodity_category:
          type: [string, "null"]
          enum:
            - general_merchandise
            - equipment
            - food_and_beverages
            - chemicals
            - electronics
            - construction_materials
            - furniture
            - stonework
            - fragile
            - perishables
            - jewelry
            - motorized_transportation
            - art_and_antiques
            - explosives
            - life_forms
            - controlled_items
            - pharmaceuticals_non_refrigerated
            - pharmaceuticals_refrigerated
            - null
          default: general_merchandise
          example: furniture
          description: |
            The category of the insured goods. Some categories are excluded or restricted by the insurer. Unrecognized values fall back to `general_merchandise` rather than returning an error.
        marks_numbers:
          type: [string, "null"]
          example: NG-2026-0417
          description: The marks and numbers identifying the insured freight on the shipping documents.

    freight_hazardous_materials:
      title: freight_hazardous_materials
      type: object
      description: |
        Hazardous materials (hazmat) details for a commodity. Providing this object flags the commodity as hazmat, which the carrier prints on the Bill of Lading. All fields other than `subsidiary_hazard_classes`, `emergency_response_reference`, `flashpoint_temperature`, and `additional_details` are required.
      additionalProperties: false
      required:
        - identification_number_type
        - identification_number
        - proper_shipping_name
        - hazard_class
        - packing_group
        - emergency_contact_name
        - emergency_contact_phone
      properties:
        identification_number_type:
          type: string
          enum:
            - un
            - na
          example: un
          description: |
            The authority that issued the identification number: `un` for a United Nations number or `na` for a North America number.
        identification_number:
          type: string
          maxLength: 50
          example: UN1263
          description: The UN or NA number identifying the hazardous material.
        proper_shipping_name:
          type: string
          maxLength: 200
          example: Paint
          description: The proper shipping name of the hazardous material, as published in the hazardous materials table.
        hazard_class:
          type: string
          enum:
            - "1.1A"
            - "1.1B"
            - "1.1C"
            - "1.1D"
            - "1.1E"
            - "1.1F"
            - "1.1G"
            - "1.1J"
            - "1.1L"
            - "1.2B"
            - "1.2C"
            - "1.2D"
            - "1.2E"
            - "1.2F"
            - "1.2G"
            - "1.2H"
            - "1.2J"
            - "1.2K"
            - "1.2L"
            - "1.3C"
            - "1.3G"
            - "1.3H"
            - "1.3J"
            - "1.3K"
            - "1.3L"
            - "1.4B"
            - "1.4C"
            - "1.4D"
            - "1.4E"
            - "1.4F"
            - "1.4G"
            - "1.4S"
            - "1.5D"
            - "1.6N"
            - "2.1"
            - "2.2"
            - "2.3"
            - "3"
            - "4.1"
            - "4.2"
            - "4.3"
            - "5.1"
            - "5.2"
            - "6.1"
            - "6.2"
            - "7"
            - "8"
            - "9"
          example: "3"
          description: The primary hazard class or division of the material.
        subsidiary_hazard_classes:
          type: array
          items:
            type: string
            example: "8"
          example:
            - "8"
          description: |
            Any subsidiary hazard classes, using the same values as `hazard_class`. Values must be unique and must not repeat the primary `hazard_class`.
        packing_group:
          type: string
          enum:
            - i
            - ii
            - iii
            - none
          example: iii
          description: The packing group assigned to the material, or `none` when the material has no packing group.
        emergency_contact_name:
          type: string
          maxLength: 200
          example: Chemtrec
          description: The name of the 24-hour emergency response contact.
        emergency_contact_phone:
          type: string
          maxLength: 50
          example: "+1 800 424 9300"
          description: The phone number of the 24-hour emergency response contact.
        emergency_response_reference:
          type: [string, "null"]
          maxLength: 10
          example: "CCN12345"
          description: The emergency response registration or contract number, such as a CHEMTREC contract number.
        flashpoint_temperature:
          type: [number, "null"]
          format: double
          example: 73
          description: The flashpoint of the material in degrees Fahrenheit, when it has one.
        additional_details:
          type: [string, "null"]
          maxLength: 250
          example: Keep upright. Do not stack.
          description: Any additional hazmat information the carrier should print on the Bill of Lading.

    freight_commodity:
      title: freight_commodity
      type: object
      description: |
        A line of goods inside a handling unit. Every handling unit needs at least one commodity, and each commodity carries its own freight class.
      additionalProperties: false
      required:
        - quantity
        - weight
        - weight_unit
        - freight_class
      properties:
        description:
          type: [string, "null"]
          example: Assembled oak dining chairs
          description: A description of the goods. Carriers print this on the Bill of Lading.
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 24
          description: The number of pieces of this commodity inside a single handling unit.
        weight:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 310
          description: The total weight of this commodity line inside a single handling unit.
        weight_unit:
          allOf:
            - $ref: "#/components/schemas/weight_unit"
          description: The unit of measure for `weight`.
        value:
          type: [number, "null"]
          format: double
          deprecated: true
          example: 4800
          description: |
            Accepted but ignored. This field is not sent to the carrier and is not stored. To declare a value for cargo insurance, use `insurance.insured_value` on the quote request instead.
        packaging_type:
          type: [string, "null"]
          enum:
            - bag
            - bale
            - box
            - bundle
            - carton
            - case
            - crate
            - cylinder
            - drum
            - pail
            - pallet
            - pieces
            - reel
            - roll
            - skid
            - tank
            - tote
            - trailer
            - tube
            - null
          example: carton
          description: |
            How this commodity is packaged inside the handling unit. Unrecognized values are ignored rather than rejected.
        freight_class:
          type: string
          enum:
            - "50"
            - "55"
            - "60"
            - "65"
            - "70"
            - "77.5"
            - "85"
            - "92.5"
            - "100"
            - "110"
            - "125"
            - "150"
            - "175"
            - "200"
            - "250"
            - "300"
            - "400"
            - "500"
          example: "125"
          description: |
            The National Motor Freight Traffic Association (NMFTA) [freight class](https://nmfta.org/nmfc/) of the goods. Freight class is derived from density, stowability, handling, and liability, and is one of the largest factors in the price of an LTL shipment.
        nmfc_code:
          type: [string, "null"]
          example: "80700-2"
          description: The NMFC item and sub number for the goods.
        hazardous_materials:
          allOf:
            - $ref: "#/components/schemas/freight_hazardous_materials"
          description: Hazmat details. Provide this object only for hazardous commodities.

    freight_handling_unit:
      title: freight_handling_unit
      type: object
      description: |
        A physical unit the carrier handles, such as a pallet or crate, together with the goods it contains.
      additionalProperties: false
      required:
        - quantity
        - length
        - width
        - height
        - dimension_unit
        - commodities
      properties:
        type:
          type: [string, "null"]
          enum:
            - bag
            - bale
            - box
            - bundle
            - carton
            - case
            - crate
            - cylinder
            - drum
            - pail
            - pallet
            - pieces
            - reel
            - roll
            - skid
            - tank
            - tote
            - trailer
            - tube
            - null
          default: pallet
          example: pallet
          description: |
            The kind of handling unit. Defaults to `pallet`. Unrecognized values are ignored rather than rejected.
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2
          description: |
            The number of identical handling units being shipped. The dimensions, weight, and commodities describe one of them; the carrier multiplies them out.
        length:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 48
          description: The length of a single handling unit, in the unit specified by `dimension_unit`.
        width:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 40
          description: The width of a single handling unit, in the unit specified by `dimension_unit`.
        height:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 52
          description: The height of a single handling unit, in the unit specified by `dimension_unit`.
        dimension_unit:
          allOf:
            - $ref: "#/components/schemas/dimension_unit"
          description: The unit of measure for `length`, `width`, and `height`.
        stackable:
          type: boolean
          default: false
          example: false
          description: |
            Whether the carrier may stack other freight on top of this handling unit. Non-stackable freight consumes more trailer space and can cost more.
        commodities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/freight_commodity"
          description: The goods inside a single handling unit. At least one commodity is required.

    freight_pickup_details:
      title: freight_pickup_details
      type: object
      description: |
        When the carrier can collect the freight. The ready and close times define the pickup window at the origin, and the carrier needs a window wide enough for a driver to arrive.
      additionalProperties: false
      required:
        - pickup_date
        - ready_time
        - close_time
      properties:
        pickup_date:
          type: string
          format: date
          example: "2026-04-17"
          description: The calendar date at the pickup location when the freight is ready to be collected. Pass a plain date (`YYYY-MM-DD`); any time or UTC offset is accepted but discarded, so `2026-04-17T23:00:00-07:00` and `2026-04-17` both schedule the 17th.
        ready_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: "09:00"
          description: The earliest time the freight can be collected, in 24-hour `HH:mm` format and local to the origin.
        close_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: "16:30"
          description: The time the origin closes, in 24-hour `HH:mm` format and local to the origin.
        is_self_scheduled:
          type: boolean
          default: false
          example: false
          description: |
            Whether you arrange the pickup with the carrier yourself. When `true`, ShipStation does not request a pickup on your behalf.
        location_type:
          type: [string, "null"]
          enum:
            - airport
            - carrier_terminal
            - commercial
            - construction
            - container_freight_station
            - distribution_center
            - government_facility
            - limited_access
            - pier_port_wharf
            - residential
            - secured_access
            - trade_show
            - null
          example: commercial
          description: |
            How the carrier should classify the pickup location. An unrecognized value is rejected with a `400 Bad Request`.

    freight_reference:
      title: freight_reference
      type: object
      description: |
        A reference number the carrier prints on the Bill of Lading, such as a purchase order or sales order number.
      additionalProperties: false
      properties:
        type:
          type: [string, "null"]
          example: purchase_order
          description: |
            A free-form label for the reference, such as `purchase_order`, `sales_order`, or `reference_1`. The values a carrier can print vary by carrier.
        value:
          type: [string, "null"]
          example: PO-84213
          description: |
            The reference value. Not length-validated by the API, but keep it short — carriers commonly truncate reference values to around 35 characters on the Bill of Lading.

    freight_provider_account:
      title: freight_provider_account
      type: object
      description: |
        A freight provider account connected to your account.
      additionalProperties: false
      properties:
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The identifier of the freight provider account. Pass it as `freight_provider_account_id` when quoting, booking, or tracking.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: |
            The code of the freight provider, such as `UNISHIPPERS` or `WWEX`. This is the same value returned as `freight_provider_code` on quotes, shipments, and tracking.
        nickname:
          type: [string, "null"]
          readOnly: true
          example: Unishippers - Midwest
          description: The name given to the connection when it was set up, or `null` when it has none.

    list_freight_provider_accounts_response_body:
      title: list_freight_provider_accounts_response_body
      type: object
      description: The freight provider accounts connected to your account.
      additionalProperties: false
      properties:
        freight_provider_accounts:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_provider_account"
          description: |
            The active freight provider accounts on the account. An empty array when no freight provider is connected.

    connect_freight_provider_account_request_body:
      title: connect_freight_provider_account_request_body
      type: object
      description: |
        A request to connect a freight account the seller already holds with a provider.
      additionalProperties: false
      required:
        - freight_provider_code
        - client_id
        - client_secret
      properties:
        freight_provider_code:
          type: string
          example: speedship
          description: |
            The code of the provider to connect. The connectable codes are the `freight_provider_code` values returned by [List freight provider accounts](#operation/list_freight_provider_accounts). Currently supported: `speedship` (WWEX) and `unishippers`.
        client_id:
          type: string
          example: my-client-id
          description: The OAuth client ID issued by the freight provider.
        client_secret:
          type: string
          example: my-client-secret
          description: The OAuth client secret issued by the freight provider.
        nickname:
          type: [string, "null"]
          example: My WWEX account
          description: An optional label for the connection. Echoed back by [List freight provider accounts](#operation/list_freight_provider_accounts).

    update_freight_provider_account_credentials_request_body:
      title: update_freight_provider_account_credentials_request_body
      type: object
      description: |
        A replacement credential pair for a freight provider account. Both fields are required: the pair is replaced atomically, so a partial update is not supported.
      additionalProperties: false
      required:
        - client_id
        - client_secret
      properties:
        client_id:
          type: string
          example: my-new-client-id
          description: The new OAuth client ID issued by the freight provider.
        client_secret:
          type: string
          example: my-new-client-secret
          description: The new OAuth client secret issued by the freight provider.

    get_freight_quotes_request_body:
      title: get_freight_quotes_request_body
      type: object
      description: |
        A freight quote request. Either describe the shipment inline with `ship_from`, `ship_to`, and `handling_units`, or link it to an existing shipment with `shipment_id`.
      additionalProperties: false
      required:
        - freight_provider_account_id
      properties:
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The freight provider account to quote against. It must be an active connection on your account — retrieve it with [List freight provider accounts](#operation/list_freight_provider_accounts).
        shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            An existing shipment to quote for. When provided, the origin is taken from the shipment's ship-from warehouse and the destination from the order's ship-to address, and `ship_from` and `ship_to` must be omitted. The `handling_units`, `accessorials`, and `insurance` you send are saved as the shipment's freight configuration; omit them to reuse the configuration already saved.
        ship_from:
          allOf:
            - $ref: "#/components/schemas/freight_address"
          description: |
            The origin address. Required when `shipment_id` is omitted, and must not be provided when `shipment_id` is present.
        ship_to:
          allOf:
            - $ref: "#/components/schemas/freight_address"
          description: |
            The destination address. Required when `shipment_id` is omitted, and must not be provided when `shipment_id` is present.
        shipment_date:
          type: [string, "null"]
          format: date-time
          example: "2026-04-17T00:00:00Z"
          description: The date the freight is ready to ship. Defaults to the current date when omitted.
        handling_units:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/freight_handling_unit"
          description: |
            The handling units being shipped. Required when `shipment_id` is omitted.
        accessorials:
          allOf:
            - $ref: "#/components/schemas/freight_accessorials"
          description: Additional services to include in the quote.
        insurance:
          allOf:
            - $ref: "#/components/schemas/freight_insurance"
          description: Cargo insurance to quote alongside the freight charges.

    freight_quote:
      title: freight_quote
      type: object
      description: |
        A bookable freight offer from a single LTL carrier.
      additionalProperties: false
      properties:
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight provider account that returned the offer.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: The code of the freight provider that returned the offer.
        offer_id:
          type: [string, "null"]
          readOnly: true
          example: 0f2b41d8-6a17-4c9e-8f52-b71d3e9c4a68
          description: |
            Identifies this offer when booking. Resolves server-side to the provider connection, carrier, and expiration — pass this id alone to [Book a freight shipment](#operation/book_freight_shipment).
        carrier_name:
          type: [string, "null"]
          readOnly: true
          example: FedEx Freight Economy
          description: The name of the LTL carrier that would move the freight.
        carrier_scac:
          type: [string, "null"]
          readOnly: true
          example: FXFE
          description: The Standard Carrier Alpha Code (SCAC) of the LTL carrier.
        service_name:
          type: [string, "null"]
          readOnly: true
          example: Standard LTL
          description: The name of the service level the carrier is offering.
        service_type:
          type: [string, "null"]
          readOnly: true
          example: Direct
          description: |
            Whether the origin terminal serves the lane directly (`Direct`) or hands the freight to another carrier (`Interline`).
        total_charges:
          type: number
          format: double
          readOnly: true
          example: 842.37
          description: The total price of the offer in USD, including any accessorials and insurance premium.
        transit_days:
          type: integer
          format: int32
          readOnly: true
          example: 3
          description: The carrier's estimated number of transit days.
        estimated_delivery_date:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: "2026-04-22T00:00:00Z"
          description: The carrier's estimated delivery date, when provided.
        is_guaranteed:
          type: boolean
          readOnly: true
          example: false
          description: Whether the carrier guarantees the transit time for this offer.
        origin_terminal_code:
          type: [string, "null"]
          readOnly: true
          example: GRR
          description: The code of the carrier terminal serving the origin.
        destination_terminal_code:
          type: [string, "null"]
          readOnly: true
          example: DFW
          description: The code of the carrier terminal serving the destination.
        insured_amount:
          type: [number, "null"]
          format: double
          readOnly: true
          example: 18500
          description: The insured value in USD, when insurance was requested.
        insurance_premium:
          type: [number, "null"]
          format: double
          readOnly: true
          example: 46.25
          description: The insurance premium in USD included in `total_charges`, when insurance was requested.
        insurance_certificate_number:
          type: [string, "null"]
          readOnly: true
          example: CRT-4471902
          description: |
            The insurance certificate number, when the insurer issued one for the offer. `null` when no insurance was requested.
        quote_expiration_date:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: "2026-04-16T23:59:59Z"
          description: When the offer expires. Expiry is enforced server-side when booking.
        max_liability_new:
          type: [number, "null"]
          format: double
          readOnly: true
          example: 25
          description: |
            The carrier's maximum liability per pound for new goods, in USD. Carrier liability is far below the value of most freight, which is why cargo insurance is usually worth quoting.
        max_liability_used:
          type: [number, "null"]
          format: double
          readOnly: true
          example: 10
          description: The carrier's maximum liability per pound for used goods, in USD.

    freight_quotes_response_body:
      title: freight_quotes_response_body
      type: object
      description: The freight offers returned for a quote request.
      additionalProperties: false
      properties:
        quotes:
          type: [array, "null"]
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_quote"
          description: |
            The offers returned by the provider, one per carrier and service combination. When no carrier can serve the lane as described, this is an empty array or `null`.

    book_freight_shipment_request_body:
      title: book_freight_shipment_request_body
      type: object
      description: |
        A request to book a freight offer returned by a quote. Pass the `offer_id` from the offer being booked — the provider connection, carrier, and expiration are resolved server-side.
      additionalProperties: false
      required:
        - offer_id
        - pickup_details
      properties:
        shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The shipment the offer was quoted for. When provided, the shipment must already have a freight quote, and `ship_from`, `ship_to`, and `handling_units` must be omitted — the origin, destination, and handling units all come from the shipment and its saved freight configuration.
        offer_id:
          type: string
          minLength: 1
          example: 0f2b41d8-6a17-4c9e-8f52-b71d3e9c4a68
          description: |
            The `offer_id` of the quoted offer being booked. Resolves server-side to the provider connection, the carrier, and the expiration.
        ship_from:
          allOf:
            - $ref: "#/components/schemas/freight_address"
          description: |
            The origin address. Required when `shipment_id` is omitted, and must not be provided when `shipment_id` is present.
        ship_to:
          allOf:
            - $ref: "#/components/schemas/freight_address"
          description: |
            The destination address. Required when `shipment_id` is omitted, and must not be provided when `shipment_id` is present.
        handling_units:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/freight_handling_unit"
          description: |
            The handling units being shipped. Required when `shipment_id` is omitted, and must not be provided when `shipment_id` is present.
        pickup_details:
          allOf:
            - $ref: "#/components/schemas/freight_pickup_details"
          description: When the carrier can collect the freight. Always required.
        references:
          type: array
          items:
            $ref: "#/components/schemas/freight_reference"
          description: Reference numbers for the carrier to print on the Bill of Lading.
        pickup_instructions:
          type: [string, "null"]
          example: Check in with the guard at gate 3 before backing into dock 12.
          description: Instructions for the driver at the origin.
        delivery_instructions:
          type: [string, "null"]
          example: Delivery appointments accepted between 08:00 and 11:00 only.
          description: Instructions for the driver at the destination.
        handling_instructions:
          type: [string, "null"]
          example: Do not double stack. Load with forks from the long side.
          description: Instructions for handling the freight in transit.

    freight_shipment_status:
      title: freight_shipment_status
      type: string
      readOnly: true
      enum:
        - pending
        - quoted
        - booked
        - in_transit
        - delivered
        - cancelled
        - exception
      example: booked
      description: |
        The lifecycle status of a freight shipment. `exception` is also returned when the status cannot be determined.

    freight_booked_document:
      title: freight_booked_document
      type: object
      description: |
        A document the carrier generated when the shipment was booked. Each entry includes a `type` and a `url` you can use to download it directly.
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          example: BILL_OF_LADING
          description: |
            The type of document, as reported by the freight provider — for example `BILL_OF_LADING`, `PALLET_LABEL`, or `BOL_PALLET_LABEL_COMBINED`. Unlike the lowercase values returned by [List freight shipment documents](#operation/list_freight_shipment_documents), this is the provider's raw value.
        url:
          type: [string, "null"]
          readOnly: true
          example: https://api.shipstation.com/v2/downloads/p1/a1b2c3d4e5f6/bill_of_lading.pdf
          description: |
            The path to download the document as a PDF.

    freight_shipment_document:
      title: freight_shipment_document
      type: object
      description: A document stored for a freight shipment.
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
            - bill_of_lading
            - bol_pallet_label_combined
            - certificate_of_insurance
            - certificate_of_insurance_instructions
            - certificate_of_origin_us
            - certificate_of_origin_usmca
            - certificate_of_origin_usmca_instructions
            - international_commercial_invoice
            - packing_list
            - pallet_label
            - pallet_label_4x6
            - proof_of_delivery
            - quote
            - weight_and_inspection
          example: bill_of_lading
          description: The type of document.
        url:
          type: [string, "null"]
          readOnly: true
          example: /v2/downloads/10/a1b2c3d4e5f6/bill_of_lading.pdf
          description: |
            The path to download the document as a PDF, relative to the API host. Resolve it against `https://api.shipstation.com` to get the full URL.

    book_freight_shipment_response_body:
      title: book_freight_shipment_response_body
      type: object
      description: The freight shipment created by a booking.
      additionalProperties: false
      properties:
        freight_shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The identifier of the freight shipment. Use it to retrieve, track, or cancel the shipment.
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight provider account the shipment was booked through.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: The code of the freight provider the shipment was booked through.
        status:
          allOf:
            - $ref: "#/components/schemas/freight_shipment_status"
          description: The status of the shipment. A successful booking returns `booked`.
        bol_number:
          type: [string, "null"]
          readOnly: true
          example: BOL-20260417-4821
          description: The Bill of Lading number assigned to the shipment.
        pro_number:
          type: [string, "null"]
          readOnly: true
          example: "072-51293847"
          description: |
            The carrier's PRO number for the shipment. Carriers often assign this after pickup, so it is usually `null` immediately after booking.
        confirmation_number:
          type: [string, "null"]
          readOnly: true
          example: FXFE-PU-884215
          description: |
            The carrier's pickup confirmation number. `null` when the carrier did not return one.
        documents:
          type: [array, "null"]
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_booked_document"
          description: |
            The documents the carrier generated for the booking. `null` when the provider reported none.

    freight_shipment_response_body:
      title: freight_shipment_response_body
      type: object
      description: A freight shipment on your account.
      additionalProperties: false
      properties:
        freight_shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The identifier of the freight shipment.
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight provider account the shipment was booked through.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: The code of the freight provider the shipment was booked through.
        status:
          allOf:
            - $ref: "#/components/schemas/freight_shipment_status"
          description: The current status of the shipment.
        bol_number:
          type: [string, "null"]
          readOnly: true
          example: BOL-20260417-4821
          description: The Bill of Lading number assigned to the shipment.
        pro_number:
          type: [string, "null"]
          readOnly: true
          example: "072-51293847"
          description: The carrier's PRO number for the shipment, or `null` until the carrier assigns one.
        confirmation_number:
          type: [string, "null"]
          readOnly: true
          example: FXFE-PU-884215
          description: |
            The carrier's pickup confirmation number. `null` when the carrier did not return one.
        documents:
          type: [array, "null"]
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_shipment_document"
          description: |
            The documents stored for the shipment, each with a download URL. `null` when no documents have been stored yet.

    list_freight_shipments_response_body:
      title: list_freight_shipments_response_body
      type: object
      description: A page of freight shipments.
      additionalProperties: false
      properties:
        shipments:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_shipment_response_body"
          description: The freight shipments on this page.
        total:
          type: integer
          format: int32
          readOnly: true
          example: 137
          description: The total number of freight shipments on the account.
        page:
          type: integer
          format: int32
          readOnly: true
          example: 1
          description: The page of results returned.
        page_size:
          type: integer
          format: int32
          readOnly: true
          example: 25
          description: The number of freight shipments per page.
        pages:
          type: integer
          format: int32
          readOnly: true
          example: 6
          description: The total number of pages available.

    cancel_freight_shipment_response_body:
      title: cancel_freight_shipment_response_body
      type: object
      description: The result of cancelling a freight shipment.
      additionalProperties: false
      properties:
        freight_shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight shipment that was cancelled.
        pickup_cancelled:
          type: boolean
          readOnly: true
          example: true
          description: |
            `true` when the carrier also voided the associated pickup request. `false` when the shipment had no pickup or the carrier did not confirm the pickup was cancelled.

    freight_document:
      title: freight_document
      type: object
      description: A downloadable document for a freight shipment.
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
            - bill_of_lading
            - bol_pallet_label_combined
            - certificate_of_insurance
            - certificate_of_insurance_instructions
            - certificate_of_origin_us
            - certificate_of_origin_usmca
            - certificate_of_origin_usmca_instructions
            - international_commercial_invoice
            - packing_list
            - pallet_label
            - pallet_label_4x6
            - proof_of_delivery
            - quote
            - weight_and_inspection
          example: bill_of_lading
          description: The type of document.
        created_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: "2026-04-16T14:32:07Z"
          description: When the document was created.
        url:
          type: [string, "null"]
          readOnly: true
          example: /v2/downloads/10/a1b2c3d4e5f6/bill_of_lading.pdf
          description: |
            The path to download the document as a PDF, relative to the API host. Resolve it against `https://api.shipstation.com` to get the full URL.

    list_freight_shipment_documents_response_body:
      title: list_freight_shipment_documents_response_body
      type: object
      description: The documents available for a freight shipment.
      additionalProperties: false
      properties:
        documents:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_document"
          description: |
            The documents available for the shipment. The list grows as the shipment progresses — a proof of delivery, for example, only exists after delivery.

    freight_tracking_event_document:
      title: freight_tracking_event_document
      type: object
      description: A document the carrier attached to a tracking event.
      additionalProperties: false
      properties:
        type:
          type: [string, "null"]
          readOnly: true
          example: PROOF_OF_DELIVERY
          description: The type of document, as reported by the carrier.
        filename:
          type: [string, "null"]
          readOnly: true
          example: pod_072-51293847.pdf
          description: The name of the document file.
        format:
          type: [string, "null"]
          readOnly: true
          example: PDF
          description: The file format of the document.

    freight_tracking_event:
      title: freight_tracking_event
      type: object
      description: A single tracking event reported by the carrier.
      additionalProperties: false
      properties:
        occurred_at:
          type: [string, "null"]
          readOnly: true
          example: "2026-04-20T14:05:00Z"
          description: |
            When the event occurred, in `YYYY-MM-DDTHH:mm:ssZ` format. Carriers that report only a date return midnight as the time.
        status:
          type: [string, "null"]
          readOnly: true
          example: in_transit
          description: The tracking status the event corresponds to.
        carrier_code:
          type: [string, "null"]
          readOnly: true
          example: AF
          description: The carrier's own status or event code.
        description:
          type: [string, "null"]
          readOnly: true
          example: Departed terminal in Grand Rapids, MI
          description: The carrier's description of the event.
        documents:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_tracking_event_document"
          description: |
            Any documents the carrier attached to the event, such as a proof of delivery. Always present; an empty array when the carrier attached none.

    freight_shipment_tracking_response_body:
      title: freight_shipment_tracking_response_body
      type: object
      description: Live carrier tracking for a booked freight shipment.
      additionalProperties: false
      properties:
        freight_shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight shipment being tracked.
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight provider account used to retrieve the tracking.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: The code of the freight provider used to retrieve the tracking.
        carrier_scac:
          type: [string, "null"]
          readOnly: true
          example: FXFE
          description: The SCAC of the LTL carrier moving the freight.
        bol_number:
          type: [string, "null"]
          readOnly: true
          example: BOL-20260417-4821
          description: The Bill of Lading number of the shipment.
        pro_number:
          type: [string, "null"]
          readOnly: true
          example: "072-51293847"
          description: The carrier's PRO number for the shipment, or `null` until the carrier assigns one.
        status:
          allOf:
            - $ref: "#/components/schemas/freight_shipment_status"
          description: The shipment status derived from the carrier's tracking status.
        tracking_status:
          type: [string, "null"]
          readOnly: true
          enum:
            - unknown
            - created
            - pending_pickup
            - dispatched
            - in_route_to_pickup
            - at_pickup
            - in_transit
            - out_for_delivery
            - at_delivery
            - delivered
            - exception
            - voided
            - null
          example: in_transit
          description: |
            The detailed tracking status reported by the carrier. `tracking_status` is finer-grained than `status`: several tracking statuses, such as `dispatched` and `out_for_delivery`, all map to the `in_transit` shipment status.
        estimated_delivery_date:
          type: [string, "null"]
          readOnly: true
          example: "2026-04-22"
          description: The carrier's estimated delivery date, in `YYYY-MM-DD` format.
        tracking_url:
          type: [string, "null"]
          readOnly: true
          example: https://www.fedex.com/fedextrack/?trknbr=07251293847
          description: A carrier page where the shipment can be tracked, when the carrier provides one.
        last_event_at:
          type: [string, "null"]
          readOnly: true
          example: "2026-04-20T14:05:00Z"
          description: When the most recent tracking event occurred.
        events:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_tracking_event"
          description: The tracking events reported by the carrier.

    freight_tracking_response_body:
      title: freight_tracking_response_body
      type: object
      description: Live carrier tracking for a PRO or BOL number.
      additionalProperties: false
      properties:
        freight_provider_account_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The freight provider account used to retrieve the tracking.
        freight_provider_code:
          type: string
          readOnly: true
          example: UNISHIPPERS
          description: The code of the freight provider used to retrieve the tracking.
        carrier_scac:
          type: [string, "null"]
          readOnly: true
          example: FXFE
          description: |
            The SCAC of the LTL carrier moving the freight, as reported by the carrier. This echoes the provider's response, not the `carrier_scac` you supplied in the request, so it can be `null`.
        bol_number:
          type: [string, "null"]
          readOnly: true
          example: BOL-20260417-4821
          description: The Bill of Lading number reported by the carrier.
        pro_number:
          type: [string, "null"]
          readOnly: true
          example: "072-51293847"
          description: The PRO number reported by the carrier.
        tracking_status:
          type: [string, "null"]
          readOnly: true
          enum:
            - unknown
            - created
            - pending_pickup
            - dispatched
            - in_route_to_pickup
            - at_pickup
            - in_transit
            - out_for_delivery
            - at_delivery
            - delivered
            - exception
            - voided
            - null
          example: delivered
          description: The detailed tracking status reported by the carrier.
        tracking_url:
          type: [string, "null"]
          readOnly: true
          example: https://www.fedex.com/fedextrack/?trknbr=07251293847
          description: A carrier page where the shipment can be tracked, when the carrier provides one.
        last_event_at:
          type: [string, "null"]
          readOnly: true
          example: "2026-04-22T09:41:00Z"
          description: When the most recent tracking event occurred.
        events:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/freight_tracking_event"
          description: The tracking events reported by the carrier.

  responses:
    ServerError:
      description: An error occurred on ShipStation API's side.
      content:
        text/plain:
          schema:
            title: empty_response_body
            type: string
            maxLength: 0

        application/json:
          schema:
            title: empty_response_body
            type: string
            maxLength: 0

    NotFound:
      description: The specified resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response_body"

    BadRequest:
      description: The request contained errors.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response_body"

    NoContent:
      description: The request was successful.

      content:
        text/plain:
          schema:
            title: empty_response_body
            type: string
            maxLength: 0

        application/json:
          schema:
            title: empty_response_body
            type: string
            maxLength: 0

    conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response_body"

    Unauthenticated:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response_body"

