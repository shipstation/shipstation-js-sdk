  /v2/rate_shoppers:
    x-visibility: public
    summary: Rate Shoppers
    description: |
      Manage rate shoppers. Rate shoppers define a set of carrier services
      and rules used to automatically select the best rate when purchasing labels.
      This includes both default rate shoppers (cheapest, fastest, best_value)
      and custom rate shoppers configured by the seller.

    get:
      summary: List rate shoppers
      description: |
        Retrieve rate shoppers for the authenticated seller. By default this
        returns both the default rate shoppers (cheapest, fastest, best_value)
        and any custom rate shoppers. Use the `type` parameter to filter.
      tags:
        - rate_shoppers
      x-plan:
        - ss-api-advanced_and_enterprise_plans
        - ss-api-free_plan
        - ss-standard_and_premium_plans
      operationId: list_rate_shoppers
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - custom
          description: |
            Filter rate shoppers by type. When set to `custom`, only
            seller-created rate shoppers are returned (excludes defaults).
            When omitted, both default and custom rate shoppers are returned.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - created_at
            default: name
          description: |
            Field to sort results by. Sorting only applies to custom rate
            shoppers; default rate shoppers are always listed first.
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction.
      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rate_shopper_list_response_body"

        400:
          $ref: "#/components/responses/BadRequest"

        500:
          $ref: "#/components/responses/ServerError"

  /v2/rate_shoppers/{rate_shopper_id}:
    x-visibility: public
    summary: Rate Shopper
