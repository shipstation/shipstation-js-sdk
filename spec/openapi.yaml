          allOf:
            - $ref: "#/components/schemas/display_scheme"
          description: The display format that the label should be shown in.
    create_label_from_rate_request_body:
      title: create_label_from_rate_request_body
      type: object

      description: A purchase label without shipment request body

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/purchase_label_without_shipment"
      properties:
        custom_field1:
          type: string
          description: >-
            Optional - Value will be saved in the shipment's advanced_options >
            custom_field1
          example: "Custom field 1"
        custom_field2:
          type: string
          description: >-
            Optional - Value will be saved in the shipment's advanced_options >
            custom_field2
          example: "Custom field 2"
        custom_field3:
          type: string
          description: >-
            Optional - Value will be saved in the shipment's advanced_options >
            custom_field3
          example: "Custom field 3"
        external_shipment_id:
          type: string
          maxLength: 100
          x-nullable: true
          description: >-
            Optional - A unique user-defined key to identify a shipment limited to 100 characters.
          example: "my-shipment-001"
    create_label_request_body:
      title: create_label_request_body
      type: object

      description: A purchase label request body

      required:
        - shipment

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/label"

      properties:
        ship_to_service_point_id:
          x-nullable: true
          type: string
          description: A unique identifier for a carrier service point where the shipment will be delivered by the carrier. This will take precedence over a shipment's ship to address.
          example: "614940"

        ship_from_service_point_id:
          x-nullable: true
          type: string
          description: A unique identifier for a carrier drop off point where a merchant plans to deliver packages. This will take precedence over a shipment's ship from address.
          example: "614940"
    create_netstamps_labels_request_body:
      title: create_netstamps_labels_request_body
      type: object

      description: Request body for creating NetStamps labels.

      required:
        - shipments
        - label_layout

      additionalProperties: false

      properties:
        shipments:
          type: array
          minItems: 1
          description: |
            The shipments to create NetStamps labels for. All shipments must use the same `carrier_id`.

            Each shipment must include `advanced_options.netstamps_options` with `row` and `column` to control stamp placement. Row/column combinations must be unique across shipments.
          items:
            $ref: "#/components/schemas/shipment"

        label_layout:
          type: string
          description: |
            The NetStamps layout to use.
          example: netstamps_traditional
          enum:
            - netstamps_traditional
            - netstamps_standard
            - netstamps_alternate
            - netstamps_promotional
            - netstamps_themed
            - netstamps_photo_landscape
            - netstamps_photo_portrait
            - netstamps_photo_landscape_hs
            - netstamps_return_address
            - netstamps_roll_type_sd
            - netstamps_promo_paper20

        label_format:
          type: string
          default: pdf
          example: pdf
          enum:
            - pdf
            - png
          description: The file format for the label.

        display_scheme:
          default: label
          allOf:
            - $ref: "#/components/schemas/display_scheme"
          description: The display format that the label should be shown in.

        test_label:
          type: boolean
          default: false
          example: true
          description: Indicate if this label is being used only for testing purposes. If true, then no charge will be added to your account.

        label_download_type:
          default: url
          allOf:
            - $ref: "#/components/schemas/label_download_type"

        is_return_label:
          type: boolean
          default: false
          example: true
          description: Indicates whether these are return labels.

        rma_number:
          type: string
          x-nullable: true
          example: "asd12323"
          description: An optional Return Merchandise Authorization number for return labels.

        charge_event:
          allOf:
            - $ref: "#/components/schemas/label_charge_event"
          description: The label charge event.

        outbound_label_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The `label_id` of the original (outgoing) label that the return label is for.

        validate_address:
          default: no_validation
          allOf:
            - $ref: "#/components/schemas/validate_address"

        label_image_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/image_id"
          description: The label image resource that was used to create a custom label image.

        ship_to_service_point_id:
          x-nullable: true
          type: string
          description: A unique identifier for a carrier service point where the shipment will be delivered.
          example: "614940"

        ship_from_service_point_id:
          x-nullable: true
          type: string
          description: A unique identifier for a carrier drop off point where a merchant plans to deliver packages.
          example: "614940"

