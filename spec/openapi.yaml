        document_ids:
          type: array
          items:
            type: string
          description: The identifiers of the documents that were sent.
    link:
      title: link
      type: object

      description: A link to a related resource

      additionalProperties: false

      required:
        - href

      allOf:
        - $ref: "#/components/schemas/optional_link"
    monetary_value:
      title: monetary_value
