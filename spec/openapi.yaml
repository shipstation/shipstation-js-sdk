  /v2/shipments/{shipment_id}/internal_notes:
    x-visibility: public
    summary: Shipment Internal Notes
    description: |
      Manage internal notes on a shipment. Internal notes are private seller-facing
      notes that are not visible to the buyer.

    parameters:
      - $ref: "#/components/parameters/shipment_id_path_param"

    post:
      summary: Update internal notes for a shipment
      description: |
        Update the internal notes on a shipment. You can either overwrite the existing
        notes entirely or append new text to the current notes.

        | Mode | `note` value | Result |
        |------|-------------|--------|
        | `overwrite` | `"new note"` | Replaces existing notes |
        | `overwrite` | `""` or `" "` | Clears the note |
        | `append` | `"new note"` | Appends text to existing notes |

      tags:
        - shipments
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: update_shipment_internal_notes

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
                - mode
              properties:
                note:
                  type: string
                  description: The note text to set or append.
                  example: "Customer called — prefers delivery after 5 PM"
                mode:
                  type: string
                  enum:
                    - append
                    - overwrite
                  description: |
                    Controls how the note is applied.
                    - `append` adds the text to the end of any existing notes.
                    - `overwrite` replaces the existing notes entirely (use an empty string to clear).
                  example: "append"

      responses:
        200:
          description: The internal notes were updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  internal_notes:
                    type: string
                    description: The resulting internal notes after the update.
                    example: "Original note\nCustomer called — prefers delivery after 5 PM"

        400:
          $ref: "#/components/responses/BadRequest"

        404:
          $ref: "#/components/responses/NotFound"

        500:
          $ref: "#/components/responses/ServerError"

