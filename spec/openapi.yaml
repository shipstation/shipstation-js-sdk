                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: validation
                    error_code: invalid_identifier
                    message: freight_provider_account_id se-999 is invalid.
                    field_name: freight_provider_account_id

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/quotes:
    x-visibility: public
    summary: Freight quotes
    description: |
      Request less-than-truckload (LTL) freight rates from the carriers available through a freight provider connected to your account.

    post:
      summary: Get freight quotes
      description: |
        Retrieve freight rate offers for a shipment. Each offer in the response is a bookable quote from a specific LTL carrier.

        There are two ways to request quotes:

        - **Inline.** Describe the shipment in the request: `ship_from`, `ship_to`, and `handling_units`.
        - **Linked to an existing shipment.** Provide `shipment_id`. The origin is taken from the shipment's ship-from warehouse and the destination from the order's ship-to address, so `ship_from` and `ship_to` must be omitted. `handling_units`, `accessorials`, and `insurance` are optional in this mode: when provided they are saved as the shipment's freight configuration, and when omitted the previously saved configuration is reused.

        To book one of the returned offers, pass its `offer_id` to [Book a freight shipment](#operation/book_freight_shipment).

        All dimensions are interpreted as inches and all weights as pounds.
      operationId: get_freight_quotes
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/get_freight_quotes_request_body"

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/freight_quotes_response_body"

        400:
          description: |
            The request contained errors, the freight provider connection is not active for the account, or the provider could not return quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: business_rules
                    error_code: unspecified
                    message: ship_from and ship_to must not be provided when shipment_id is present

        404:
          description: The `shipment_id` does not identify a shipment on this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/shipments:
    x-visibility: public
    summary: Freight shipments
    description: |
      Book freight offers returned by [Get freight quotes](#operation/get_freight_quotes) and list the freight shipments on your account.

    post:
      summary: Book a freight shipment
      description: |
        Book one of the offers returned by [Get freight quotes](#operation/get_freight_quotes). Booking dispatches the shipment with the LTL carrier and generates the shipment's documents, such as the Bill of Lading.

        As with quoting, there are two ways to book:

        - **Linked to an existing shipment.** Provide `shipment_id`. The shipment must already have a freight quote — call [Get freight quotes](#operation/get_freight_quotes) for it first. The origin, destination, and handling units all come from the shipment and its saved freight configuration, so `ship_from`, `ship_to`, and `handling_units` must be omitted.
        - **Inline.** Omit `shipment_id` and provide `ship_from`, `ship_to`, and `handling_units`. A shipment record is created for the booking and marked as shipped.

        Pass the `offer_id` from the offer you are booking. The provider connection, carrier, and expiration are resolved server-side from the stored offer.
      operationId: book_freight_shipment
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/book_freight_shipment_request_body"

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/book_freight_shipment_response_body"

        400:
          description: |
            The request contained errors, the quote has expired, the freight provider connection is not active for the account, the linked shipment has no freight configuration or a cancelled one, or the provider rejected the booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: system
                    error_code: unspecified
                    message: The quote has expired. Please request a new quote.

        404:
          description: The `shipment_id` does not identify a shipment on this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        500:
          $ref: "#/components/responses/ServerError"

    get:
      summary: List freight shipments
      description: |
        Return the freight shipments on your account, most recently created first. Results are paginated.
      operationId: list_freight_shipments
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          example: 1
          description: The page of results to return. Values below `1` are treated as `1`.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 25
          example: 50
          description: The number of freight shipments to return per page. Values above `500` are capped at `500`.

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_freight_shipments_response_body"

        400:
          $ref: "#/components/responses/BadRequest"

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/shipments/{freight_shipment_id}:
    x-visibility: public
    summary: Freight shipment
    description: Retrieve or cancel an individual freight shipment.

    parameters:
      - $ref: "#/components/parameters/freight_shipment_id_path_param"

    get:
      summary: Get freight shipment by ID
      description: |
        Retrieve a single freight shipment, including its current status, carrier reference numbers, and the documents generated for it.
      operationId: get_freight_shipment_by_id
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/freight_shipment_response_body"

        400:
          $ref: "#/components/responses/BadRequest"

        404:
          description: The freight shipment does not exist on this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
