    x-visibility: public
    summary: Purchase Orders
    description: |
      Manage purchase orders for inventory replenishment. Create, update, and track orders from suppliers.

    get:
      operationId: list_purchase_orders
      summary: List purchase orders
      description: |
        Retrieve a paginated list of purchase orders with optional filtering by status, warehouse, dates, and other criteria.
      tags:
        - purchase_orders
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      parameters:
        - name: order_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by order number
          example: "02162026-02"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - open
              - receiving
              - received
              - cancelled
              - closed
          description: Filter by status
        - name: warehouse_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by warehouse ID
        - name: reference_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by reference number
        - name: create_date_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by creation date start (inclusive)
          example: "2025-01-01T00:00:00Z"
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Number of results per page
      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_orders:
                    type: array
                    items:
                      type: object
                      properties:
                        purchase_order_id:
                          type: string
                          description: Unique identifier for the purchase order
                          example: "se-234"
                        order_number:
                          type: string
                          description: Auto-generated order number
                          example: "02162026-02"
                        supplier_id:
                          type: string
                          description: Supplier identifier
                          example: "se-567"
                        supplier_name:
                          type: string
                          description: Name of the supplier
                          example: "Acme Widgets Inc"
                        status:
                          type: string
                          enum:
                            - draft
                            - open
                            - receiving
                            - received
                            - cancelled
                            - closed
                          description: Current status of the purchase order
                          example: "open"
                        order_date:
                          type: string
                          format: date-time
                          description: Date when the order was placed
                          example: "2025-01-15T00:00:00Z"
                        expected_delivery_date:
                          type: string
                          format: date-time
                          description: Expected delivery date
                          example: "2025-02-01T00:00:00Z"
                        create_date:
                          type: string
                          format: date-time
                          description: Date when the purchase order was created
                          example: "2025-01-14T10:30:00Z"
                        modify_date:
                          type: string
                          format: date-time
                          description: Date when the purchase order was last modified
                          example: "2025-01-14T10:30:00Z"
                        reference_number:
                          type: string
                          description: Optional reference number
                          example: "REF-12345"
                        warehouse_id:
                          type: string
                          description: Warehouse identifier
                          example: "se-123456"
                  total:
                    type: integer
                    description: Total number of purchase orders
                    example: 150
                  page:
                    type: integer
                    description: Current page number
                    example: 2
                  pages:
                    type: integer
                    description: Total number of pages
                    example: 3
                  links:
                    type: object
                    properties:
                      first:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/purchase_orders?page_size=50"
                      next:
                        type: [object, "null"]
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/purchase_orders?cursor=eyJQYWdlIjoyLCJPcmRlck51bWJlciI6bnVsbCwiU3RhdHVzIjpudWxsLCJXYXJlaG91c2VJZCI6bnVsbCwiUmVmZXJlbmNlTnVtYmVyIjpudWxsLCJDcmVhdGVEYXRlU3RhcnQiOm51bGx9"
