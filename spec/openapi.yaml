    fulfillment:
      title: fulfillment
      type: object
      description: A fulfillment represents a completed shipment with tracking information
      properties:
        fulfillment_id:
          type: string
          description: Unique identifier for the fulfillment
          example: "se-12345678"
        shipment_id:
          type: string
          description: The associated shipment id
          example: "se-12345678"
        shipment_number:
          type: string
          description: The shipment number (order number)
          example: "ORDER-001"
        user_id:
          type: string
          description: The user id that created this fulfillment
          example: "00000000-0000-0000-0000-000000000000"
        tracking_number:
          type: string
          description: Tracking number for the shipment
          example: "1Z12345E1234567890"
        created_at:
          type: string
          format: date-time
          description: Date and time when the fulfillment was created
          example: "2024-01-15T10:30:00Z"
        ship_date:
          type: string
          format: date-time
          description: Date when the shipment was shipped
          example: "2024-01-15T00:00:00Z"
        voided_at:
          type: [string, "null"]
          format: date-time
          description: Date and time when the fulfillment was voided
          example: "2024-01-15T00:00:00Z"
        delivered_at:
          type: [string, "null"]
          format: date-time
          description: Date and time when the shipment was delivered
          example: "2024-01-18T14:22:00Z"
        fulfillment_carrier_friendly_name:
          type: string
          description: Friendly name of the carrier
          example: "UPS"
        fulfillment_provider_id:
          type: [string, "null"]
          description: Fulfillment provider ID
          example: "se-12345678"
        fulfillment_provider_friendly_name:
          type: [string, "null"]
          description: Friendly name of the fulfillment provider
          example: "ShipStation Fulfillment"
        fulfillment_provider_code:
          type: [string, "null"]
          description: Code of the fulfillment provider
          example: "shipstation_fulfillment"
        fulfillment_service_code:
          type: [string, "null"]
          description: Service code used for fulfillment
          example: "ups_ground"
        fulfillment_fee:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Fee charged for the fulfillment
        void_requested:
          type: boolean
          description: Whether a void has been requested for this fulfillment
          example: false
        voided:
          type: boolean
          description: Whether this fulfillment has been voided
          example: false
        order_source_notified:
          type: boolean
          description: Whether the order source has been notified
          example: true
        notification_error_message:
          type: [string, "null"]
          description: Error message if notification failed
          example: null
        ship_to:
          type: object
          description: Shipping address information
          properties:
            name:
              type: string
              description: Recipient name
              example: "Jane Doe"
            company_name:
              type: [string, "null"]
              description: Company name
              example: "Example Corp"
            email:
              type: [string, "null"]
              description: Email address
              example: "jane@example.com"
            phone:
              type: [string, "null"]
              description: Phone number
              example: "555-555-5555"
            address_line1:
              type: string
              description: Street address line 1
              example: "525 S Winchester Blvd"
            address_line2:
              type: [string, "null"]
              description: Street address line 2
              example: null
            address_line3:
              type: [string, "null"]
              description: Street address line 3
              example: null
            city_locality:
              type: string
              description: City or locality
              example: "San Jose"
            state_province:
              type: string
              description: State or province
              example: "CA"
            postal_code:
              type: string
              description: Postal or ZIP code
              example: "95128"
            country_code:
              type: string
              description: ISO country code
              example: "US"
    rate-estimate:
      title: rate_estimate
      type: object

      description: A rate estimate

      required:
        - rate_type
        - carrier_id
        - shipping_amount
        - insurance_amount
        - confirmation_amount
        - other_amount
        - zone
        - package_type
        - guaranteed_service
        - negotiated_rate
        - service_type
        - service_code
        - trackable
        - carrier_code
        - carrier_nickname
        - carrier_friendly_name
        - validation_status
        - warning_messages
        - error_messages

      additionalProperties: false

      properties:
        rate_type:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/rate_type"

        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the carrier
          example: "se-1234567"

        shipping_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The shipping amount

        insurance_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The insurance amount

        confirmation_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The confirmation amount

        other_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Any other charges associated with this rate

        tax_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Tariff and additional taxes associated with an international shipment.

        zone:
          type: integer
          format: int32
          x-nullable: true
          readOnly: true
          minimum: 0
          example: 6
          description: |
            Certain carriers base [their rates](https://blog.stamps.com/2017/09/08/usps-postal-zones/) off of
            custom zones that vary depending upon the ship_to and ship_from location

        package_type:
          type: string
          x-nullable: true
          readOnly: true
          minLength: 1
          example: package
          description: package type that this rate was estimated for

        delivery_days:
          type: integer
          format: int32
          x-nullable: true
          readOnly: true
          minimum: 1
          example: 5
          description: |
            The number of days estimated for delivery, this will show the _actual_ delivery
            time if for example, the package gets shipped on a Friday

        guaranteed_service:
          type: boolean
          readOnly: true
          description: Indicates if the rate is guaranteed.
          example: true

        estimated_delivery_date:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date"

        carrier_delivery_days:
          type: string
          readOnly: true
          minLength: 1
          example: "22"
          description: The carrier delivery days

        ship_date:
          type: string
          format: date-time
          readOnly: true
          minLength: 1
          example: "2024-12-23T00:00:00.000Z"
          description: ship date

        negotiated_rate:
          type: boolean
          readOnly: true
          description: Indicates if the rates been negotiated
          example: true

        service_type:
          type: string
          readOnly: true
          minLength: 1
          example: "next_day"
          description: service type

        service_code:
          type: string
          readOnly: true
          minLength: 1
          example: "usps_priority_mail_express"
          description: service code for the rate

        trackable:
          type: boolean
          readOnly: true
          description: Indicates if rate is trackable
          example: true

        carrier_code:
          type: string
          readOnly: true
          minLength: 1
          example: "stamps_com"
          description: A [shipping carrier] , such as `fedex`, `dhl_express`, `stamps_com`, etc.

        carrier_nickname:
          type: string
          readOnly: true
          minLength: 1
          example: "free"
          description: carrier nickname

        carrier_friendly_name:
          type: string
          readOnly: true
          minLength: 1
          example: "free"
          description: carrier friendly name

        validation_status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/validation_status"
          example: valid

        warning_messages:
          type: array
          readOnly: true
          minItems: 0
          items:
            type: string
            readOnly: true
            minLength: 0
            example: "warning"
            description: warning message
          description: The warning messages

        error_messages:
          type: array
          readOnly: true
          minItems: 0
          items:
            type: string
            readOnly: true
            minLength: 0
            example: "error"
            description: error message
          description: The error messages
    label:
      title: label
      type: object

      description: |
        A label represents the physical sticker that you affix to a package to ship it.  ShipStation makes it easy for you to [create labels] and then download them in PDF, PNG, or ZPL format so you can print them.

      additionalProperties: false

      properties:
        label_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            A string that uniquely identifies the label. This ID is generated by ShipStation when the label is created.
          example: "se-123456"

        status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/label_status"
          example: "completed"

        shipment_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The shipment that this label is for.  ShipStation  can create a shipment for you automatically when you [create a label], or you can [create your own shipment] and then [use it to print a label]
          example: "se-1234567"

        external_shipment_id:
          readOnly: true
          type: string
          maxLength: 50
          x-nullable: true
          example: "externalId-1234556"
          description: |
            A unique user-defined key to identify a shipment.  This can be used to retrieve the shipment.

            > **Warning:** The `external_shipment_id` is limited to 50 characters. Any additional characters will be truncated.

        external_order_id:
          readOnly: true
          type: string
          x-nullable: true
          example: "externalOrderId-1232434"
          description: ID that the Order Source assigned

        shipment:
          writeOnly: true
          allOf:
            - $ref: "#/components/schemas/shipment"
          description: The shipment information used to generate the label

        ship_date:
          allOf:
            - $ref: "#/components/schemas/date"
          readOnly: true
          description: |
            The date that the package was (or will be) shipped.  ShipStation will take the day of week into consideration. For example, if the carrier does not operate on Sundays, then a package that would have shipped on Sunday will ship on Monday instead.

        created_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the label was created in ShipStation .

        shipment_cost:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: |
            The cost of shipping, delivery confirmation, and other carrier charges.  This amount **does not** include insurance costs.

        insurance_cost:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: |
            The insurance cost for this package.  Add this to the `shipment_cost` field to get the total cost.

        requested_comparison_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: |
            The total shipping cost for the specified comparison_rate_type.

        tracking_number:
          type: string
          minLength: 1
          readOnly: true
          example: "782758401696"
          description: The tracking number for the package. Tracking number formats vary across carriers.

        is_return_label:
          type: boolean
          example: true
          description: |
            Indicates whether this is a return label.  You may also want to set the `rma_number` so you know what is being returned.

        rma_number:
          type: string
          x-nullable: true
          example: "asd12323"
          description: |
            An optional Return Merchandise Authorization number.  This field is useful for return labels.  You can set it to any string value.

        is_international:
          type: boolean
          readOnly: true
          example: true
          description: |
            Indicates whether this is an international shipment.  That is, the originating country and destination country are different.

        batch_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            If this label was created as part of a [batch], then this is the unique ID of that batch.

        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The unique ID of the [carrier account] that was used to create this label
          example: "se-1234567"

        charge_event:
          allOf:
            - $ref: "#/components/schemas/label_charge_event"
          description: |
            The label charge event.

        outbound_label_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          writeOnly: true
          description: |
            The `label_id` of the original (outgoing) label that the return label is for. This associates the two labels together, which is
            required by some carriers.

        service_code:
          allOf:
            - $ref: "#/components/schemas/service_code"
          readOnly: true
          description: |
            The [carrier service] used to ship the package, such as `fedex_ground`, `usps_first_class_mail`, `flat_rate_envelope`, etc.

        test_label:
          writeOnly: true
          type: boolean
          default: false
          deprecated: true
          example: true
          description: Indicate if this label is being used only for testing purposes. If true, then no charge will be added to your account.

        package_code:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/package_code"
          description: |
            The [package type], such as `thick_envelope`, `small_flat_rate_box`, `large_package`, etc.  The code `package` indicates a custom or unknown package type.

        validate_address:
          writeOnly: true
          default: no_validation
          allOf:
            - $ref: "#/components/schemas/validate_address"

        voided:
          type: boolean
          readOnly: true
          example: true
          description: |
            Indicates whether the label has been [voided]

        voided_at:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: |
            The date and time that the label was [voided] , or `null` if the label has not been voided

        void_type:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/void_type"
          description: |
            Indicates how the label was voided. This field is `null` if the label has not been voided.
          example: manual

        refund_details:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/refund_details"
          description: |
            Information about the Refund Assist request for this label. This field is `null` if the label is not eligible for Refund Assist.

        label_download_type:
          writeOnly: true
          default: url
          allOf:
            - $ref: "#/components/schemas/label_download_type"

        label_format:
          default: pdf
          allOf:
            - $ref: "#/components/schemas/label_format"
          description: |
            The file format that you want the label to be in.  We recommend `pdf` format because it is supported by all carriers, whereas some carriers do not support the `png` or `zpl` formats.

        display_scheme:
          default: label
          allOf:
            - $ref: "#/components/schemas/display_scheme"
          description: The display format that the label should be shown in.

        label_layout:
          default: 4x6
          allOf:
            - $ref: "#/components/schemas/label_layout"
          description: |
            The layout (size) that you want the label to be in.  The `label_format` determines which sizes are allowed.  `4x6` is supported for all label formats, whereas `letter` (8.5" x 11") is only supported for `pdf` format.

        trackable:
          type: boolean
          readOnly: true
          example: true
          description: |
            Indicates whether the shipment is trackable, in which case the `tracking_status` field will reflect the current status and each package will have a `tracking_number`.

        label_image_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/image_id"
          description: The label image resource that was used to create a custom label image.

        carrier_code:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/carrier_code"
          description: |
            The [shipping carrier] who will ship the package, such as `fedex`, `dhl_express`, `stamps_com`, etc.

        confirmation:
          readOnly: true
          default: none
          allOf:
            - $ref: "#/components/schemas/delivery_confirmation"
          description: The type of delivery confirmation for this shipment. Defaults to 'none' if not specified..

        tracking_status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/tracking_status"
          description: The current status of the package, such as `in_transit` or `delivered`

        label_download:
          allOf:
            - $ref: "#/components/schemas/label_download"
          readOnly: true

        form_download:
          readOnly: true
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/link"
          description: |
            The link to download the customs form (a.k.a. commercial invoice) for this shipment, if any.  Forms are in PDF format. This field is null if the shipment does not require a customs form, or if the carrier does not support it.

        qr_code_download:
          readOnly: true
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: The QR code download for the package

        paperless_download:
          readOnly: true
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/paperless_download"
          description: |
            The paperless details which may contain elements like `href`, `instructions` and `handoff_code`.

        insurance_claim:
          readOnly: true
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/link"
          description: |
            The link to submit an insurance claim for the shipment.  This field is null if the shipment is not insured or if the insurance provider does not support online claim submission.

        packages:
          type: array
          readOnly: true
          description: |
            The label's package(s).

            > **Note:** Some carriers only allow one package per label.  If you attempt to create a multi-package label for a carrier that doesn't allow it, an error will be returned.

          items:
            allOf:
              - $ref: "#/components/schemas/label_package"
              - title: alternative_identifiers
                type: object
                additionalProperties: false
                properties:
                  alternative_identifiers:
                    type: array
                    readOnly: true
                    x-nullable: true
                    description: |
                      Alternative identifiers associated with this package.

                    items:
                      $ref: "#/components/schemas/alternative_identifier"

        alternative_identifiers:
          type: array
          readOnly: true
          x-nullable: true
          description: |
            Additional information some carriers may provide by which to identify a given label in their system.

          items:
            $ref: "#/components/schemas/alternative_identifier"

        rate_details:
          type: array
          readOnly: true
          description: |
            A breakdown of individual charges that make up this label, such as base shipping cost and additional fees. For DDP shipments it also includes duties, taxes, and import fees (prepaid on Wallet carriers, estimated on BYOA carriers).
          items:
            type: object
            properties:
              rate_detail_type:
                type: string
                example: "shipping"
                description: |
                  The category of charge. Common values include `shipping` and `additional_fees`. DDP shipments (`customs.terms_of_trade_code: "ddp"`) also return `prepaid_duties`, `prepaid_taxes` and `prepaid_import_fees` on Wallet carriers, or `estimated_duties`, `estimated_taxes` and `estimated_import_fees` on BYOA (Bring Your Own Account) carriers.
              carrier_description:
                type: string
                example: "Shipping"
                description: The carrier-provided description of the charge.
              carrier_billing_code:
                type: string
                x-nullable: true
                example: "BaseServiceCharge"
                description: The carrier billing code, when provided by the carrier.
              carrier_memo:
                type: string
                x-nullable: true
                example: ""
                description: An optional carrier-supplied note for the charge.
              amount:
                allOf:
                  - $ref: "#/components/schemas/monetary_value"
                description: The amount of this individual charge.
              billing_source:
                type: string
                example: "carrier"
                description: |
                  The source that produced the charge. Common values are `carrier` for carrier-billed charges and `dutiestax` for duties and taxes on DDP shipments (prepaid on Wallet carriers, estimated on BYOA carriers).

                  > **Note:** The casing of this value differs by endpoint. Label responses return lowercase values (e.g. `carrier`, `dutiestax`). Rate responses return PascalCase values (e.g. `Carrier`, `DutiesTax`). This reflects the actual API behavior.

        tracking_url:
          readOnly: true
          x-nullable: true
          type: string
          example: https://www.fedex.com/fedextrack/?action=track&trackingnumber=1234
          description: |
            The URL to track the package. This URL is provided by the carrier and is unique to the tracking number.

        ship_to:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/shipping_address_to"
          description: The recipient's mailing address
    batch:
      title: batch
      type: object

      description: |
        Batches are an advanced feature of ShipStation designed for users who need to generate hundreds or
        thousands of labels at a time.

      required:
        - label_layout
        - label_format
        - batch_id
        - batch_number
        - external_batch_id
        - batch_notes
        - created_at
        - processed_at
        - errors
        - process_errors
        - warnings
        - completed
        - forms
        - count
        - batch_shipments_url
        - batch_labels_url
        - batch_errors_url
        - label_download
        - form_download
        - paperless_download
        - status

      additionalProperties: false

      properties:
        label_layout:
          readOnly: true
          default: 4x6
          description: label layout
          allOf:
            - $ref: "#/components/schemas/label_layout"

        label_format:
          readOnly: true
          default: pdf
          allOf:
            - $ref: "#/components/schemas/label_format"

        batch_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the batch

        batch_number:
          readOnly: true
          type: string
          minLength: 0
          description: The batch number.
          example: "123456"

        external_batch_id:
          type: string
          readOnly: true
          x-nullable: true
          minLength: 0
          example: "12323aaaar"
          description: A string that uniquely identifies the external batch

        batch_notes:
          type: string
          readOnly: true
          x-nullable: true
          default: ""
          example: Batch for morning shipment
          description: Custom notes you can add for each created batch

        assigned_user:
          type: ["string", "null"]
          format: uuid
          readOnly: true
          example: "a2df9fa5-b7ee-467f-be4e-9c660542c187"
          description: The ID of the user assigned to the batch, or `null` if no user is assigned.

        created_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time the batch was created in ShipStation

        processed_at:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time the batch was processed in ShipStation

        # deprecate?
        errors:
          type: integer
          format: int32
          readOnly: true
          minimum: 0
          example: 2
          description: The number of errors that occurred while generating the batch

        process_errors:
          type: array
          readOnly: true
          items:
            allOf:
              - $ref: "#/components/schemas/error"
          description: The errors associated with the failed API call

        # deprecate?
        warnings:
          type: integer
          format: int32
          readOnly: true
          minimum: 0
          example: 1
          description: The number of warnings that occurred while generating the batch

        # deprecate?
        completed:
          type: integer
          format: int32
          readOnly: true
          minimum: 0
          example: 1
          description: The number of labels generated in the batch

        forms:
          type: integer
          format: int32
          readOnly: true
          minimum: 0
          example: 3
          description: The number of forms for customs that are available for download

        count:
          type: integer
          format: int32
          readOnly: true
          minimum: 0
          example: 2
          description: The total of errors, warnings, and completed properties

        batch_shipments_url:
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: The batch shipments endpoint

        batch_labels_url:
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: Link to batch labels query

        batch_errors_url:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: Link to batch errors endpoint

        label_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/label_download"
          description: The label download for the batch

        form_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: The form download for any customs that are needed

        paperless_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/paperless_download"
          description: The paperless details which may contain elements like `href`, `instructions` and `handoff_code`.

        status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/batch_status"
    modify_batch:
      title: modify_batch
      type: object

      description: A modify batch object

      additionalProperties: false

      properties:
        shipment_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
            description: The Shipment ID to be modified on the batch
          description: The Shipment Ids to be modified on the batch
        rate_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
            description: The Rate ID to be modified on the batch
          description: Array of Rate IDs to be modifed on the batch
    webhook:
      title: webhook
      type: object

      description: A webhook

      additionalProperties: false

      properties:
        webhook_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the webhook

        url:
          allOf:
            - $ref: "#/components/schemas/url"
          example: https://example.com/station/events
          description: The webhook payload listener URL that you intend to target for webhook dispatches

        event:
          allOf:
            - $ref: "#/components/schemas/webhook_event"

        headers:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/webhook_header"
          description: Array of custom webhook headers
        name:
          type: string
          description: The name of the webhook
          example: "My Webhook"

        store_id:
          type: integer
          description: Store ID
          example: 123456
    webhook_header:
      title: webhook_header
      type: object

      description: Optional header to be specified in webhook

      properties:
        key:
          title: key
          type: string
          description: Key/name of a header
          example: custom-key
        value:
          title: value
          type: string
          description: Value of a header
          example: custom-value

      required:
        - key
        - value
    warehouse:
      title: warehouse
      type: object

      description: A warehouse

      additionalProperties: false

      properties:
        warehouse_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the warehouse

        is_default:
          x-nullable: true
          type: boolean
          default: false
          example: true
          description: Designates which single warehouse is the default on the account

        name:
          type: string
          minLength: 1
          example: Zero Cool HQ
          description: Name of the warehouse

        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2019-06-25T18:12:35.583Z"
          minLength: 1
          description: Timestamp that indicates when the warehouse was created

        origin_address:
          allOf:
            - $ref: "#/components/schemas/address"
          description: The origin address of the warehouse

        return_address:
          allOf:
            - $ref: "#/components/schemas/address"
          description: The return address associated with the warehouse
    package_type:
      title: package_type
      type: object

      description: A package type that a carrier supports for shipment.

      required:
        - name
        - package_code

      additionalProperties: false

      properties:
        package_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the package.
          example: "se-28529731"

        package_code:
          allOf:
            - $ref: "#/components/schemas/package_code"

        name:
          type: string
          minLength: 1
          maxLength: 50
          example: laptop_box

        dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The custom dimensions for the package.

        description:
          type: string
          maxLength: 500
          example: Packaging for laptops
          x-nullable: true
          description: Provides a helpful description for the custom package.
    carrier_provided_package_type:
      title: carrier_provided_package_type
      type: object

      description: A package type that a carrier provides for shipment. Unlike custom packages, carrier packages do not have a package_id.

      required:
        - name
        - package_code

      additionalProperties: false

      properties:
        package_id:
          anyOf:
            - $ref: "#/components/schemas/se_id"
            - type: "null"
          description: This field is `null` for package types that the carrier shares across accounts. Package IDs are assigned to packages that belong to your account, such as custom packages.

        package_code:
          allOf:
            - $ref: "#/components/schemas/package_code"

        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Small Flat Rate Box

        dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The dimensions for the package.

        description:
          type: string
          maxLength: 500
          example: USPS Small Flat Rate Box
          x-nullable: true
          description: Provides a helpful description for the package.
    pagination_link:
      title: pagination_link
      type: object

      description: Helpful links to other pages of results

      required:
        - first
        - last
        - prev
        - next

      additionalProperties: false

      properties:
        first:
          allOf:
            - $ref: "#/components/schemas/link"
          description: |
            The link to the first page of results.  This object will _always_ have an `href` field. If there are no results, then the first page will contain an empty array of items.

        last:
          allOf:
            - $ref: "#/components/schemas/link"
          description: |
            The link to the final page of results.  This object will _always_ have an `href` field. If there are no results, then the final page will contain an empty array of items.

        prev:
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: |
            The link to the previous page of results.  The `href` field will only be set when the `page` is 2 or greater.

        next:
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: |
            The link to the next page of results.  The `href` field will only be set when the `page` is less than `pages`.
    optional_link:
      title: optional_link
      type: object

      description: A link to a related resource, or an empty object if there is no resource to link to

      additionalProperties: false

      properties:
        href:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL of the linked resource, if any

        type:
          type: string
          example: "child"
          minLength: 1
          description: The type of resource, or the type of relationship to the parent resource
    tag:
      title: tag
      type: object

      description: |
        Tags are arbitrary strings that you can use to categorize shipments.  For example, you may want to use tags to distinguish between domestic and international shipments, or between insured and uninsured shipments.  Or maybe you want to create a tag for each of your customers so you can easily retrieve every shipment for a customer.

      required:
        - name

      additionalProperties: false

      properties:
        name:
          type: string
          minLength: 1
          example: Fragile
          description: The tag name.
    shipment:
      title: shipment
      type: object

      description: |
        The information necessary to ship a package, such as the origin, the destination, the carrier service, and the package dimensions and weight.

        > **Note:** Either `ship_from` or `warehouse_id` must be set.

      required:
        - shipment_id
        - created_at
        - modified_at
        - shipment_status
        - ship_to
        - ship_from
        - return_to
        - insurance_provider
        - tags
        - packages
        - total_weight
        - batch_ids

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/partial_shipment"
    address_validating_shipment:
      title: address_validating_shipment
      type: object

      description: An address validating shipment

      required:
        - shipment_id
        - carrier_id
        - service_code
        - ship_to
        - ship_from

      additionalProperties: false

      allOf:
        - title: validate_shipment_fields
          type: object
          properties:
            validate_address:
              default: no_validation
              allOf:
                - $ref: "#/components/schemas/validate_address"
        - $ref: "#/components/schemas/partial_shipment"
    partial_shipment:
      title: partial_shipment
      type: object

      description: |
        The information necessary to ship a package, such as the origin, the destination, the carrier service, and the package dimensions and weight.

      additionalProperties: false

      properties:
        shipment_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the shipment

        carrier_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The carrier account that is billed for the shipping charges
          example: "se-1234567"

        service_code:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/service_code"
          description: |
            The [carrier service] used to ship the package, such as `fedex_ground`, `usps_first_class_mail`, `flat_rate_envelope`, etc.
          example: "usps_first_class_mail"

        requested_shipment_service:
          type: string
          x-nullable: true
          description: The requested shipment service
          example: "usps_priority_mail"

        external_order_id:
          type: string
          x-nullable: true
          example: "1232434"
          description: ID that the Order Source assigned

        hold_until_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date to hold the shipment until
          example: "2025-01-15T00:00:00.000Z"

        ship_by_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date by which the shipment should be shipped
          example: "2025-01-15T00:00:00.000Z"

        deliver_by_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date by which the shipment should be delivered
          example: "2025-01-20T00:00:00.000Z"

        retail_rate:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The retail rate for the shipment

        store_id:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The store ID associated with the shipment
          example: "se-12345"

        items:
          type: array
          default: []
          items:
            allOf:
              - $ref: "#/components/schemas/shipment_item"
          description: |
            Describe the packages included in this shipment as related to potential metadata that was imported from
            external order sources

        notes_from_buyer:
          type: string
          x-nullable: true
          description: Notes from the buyer
          example: "Please handle with care"

        notes_to_buyer:
          type: string
          x-nullable: true
          description: Notes to the buyer
          example: "Thank you for your order!"

        notes_for_gift:
          type: string
          x-nullable: true
          description: Gift notes
          example: "Happy Birthday!"

        internal_notes:
          type: string
          x-nullable: true
          description: Internal notes from the seller
          example: "Check packaging before shipping"

        is_gift:
          type: boolean
          default: false
          description: Indicates if the shipment is a gift
          example: true

        assigned_user:
          type: string
          x-nullable: true
          description: User assigned to the shipment
          example: "user@example.com"

        amount_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Total amount paid for the order

        shipping_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for shipping

        tax_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for taxes

        zone:
          type: integer
          format: int32
          x-nullable: true
          minimum: 0
          description: Shipping zone
          example: 1

        display_scheme:
          type: string
          x-nullable: true
          description: Display scheme for the shipment
          example: "label"

        tax_identifiers:
          type: array
          x-nullable: true
          items:
            allOf:
              - $ref: "#/components/schemas/tax_identifier"

        external_shipment_id:
          type: string
          maxLength: 50
          x-nullable: true
          example: "1234556"
          description: |
            A user-defined key that identifies the source order. Multiple shipments can share the same `external_shipment_id` (common in split-shipping scenarios where one order results in multiple shipments). Functionally identical to `orderKey` in V1 API.

            > **Warning:** The `external_shipment_id` is limited to 50 characters. Any additional characters will be truncated.

        shipment_number:
          type: string
          maxLength: 50
          x-nullable: true
          readOnly: false
          example: "10001"
          description: |
            A non-unique user-defined number used to identify a shipment.  If undefined, this will match the external_shipment_id of the shipment.

            > **Warning:** The `shipment_number` is limited to 50 characters. Any additional characters will be truncated.

        ship_date:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/date"
          description: |
            The date that the shipment was (or will be) shipped.  ShipStation will take the day of week into consideration. For example, if the carrier does not operate on Sundays, then a package that would have shipped on Sunday will ship on Monday instead.

        created_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the shipment was created in ShipStation .

        modified_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the shipment was created or last modified.

        shipment_status:
          readOnly: true
          default: pending
          allOf:
            - $ref: "#/components/schemas/shipment_status"
          description: The current status of the shipment

        ship_to:
          allOf:
            - $ref: "#/components/schemas/shipping_address_to"
          description: The recipient's mailing address

        ship_from:
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The shipment's origin address. If you frequently ship from the same location, consider [creating a warehouse].  Then you can simply specify the `warehouse_id` rather than the complete address each time.

        warehouse_id:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The [warehouse] that the shipment is being shipped from.  Either `warehouse_id` or `ship_from` must be specified.

        return_to:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The return address for this shipment.  Defaults to the `ship_from` address.  Can be sent with a warehouse_id, in which case the return address can be overridden.  This allows you to have a different address printed on the label while maintaining the origin address.

        is_return:
          type: boolean
          x-nullable: true
          default: false
          description: |
            An optional indicator if the shipment is intended to be a return. Defaults to false if not provided.
          example: true

        confirmation:
          default: none
          allOf:
            - $ref: "#/components/schemas/delivery_confirmation"
          description: The type of delivery confirmation for this shipment. Defaults to 'none' if not specified.

        customs:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/international_shipment_options"
          description: |
            Customs information for international shipments.

            > **Note:** International shipments (where `ship_from.country_code` differs from `ship_to.country_code`) must include either `customs` or `advanced_options`.
            > To prepay duties and taxes (DDP / PDT), set `customs.terms_of_trade_code` to `ddp`.

            > Please note that the guaranteed prepaid duties and taxes option is available only for eligible ShipStation carriers.

        advanced_options:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/advanced_shipment_options"
          description: |
            Advanced shipment options.

            > **Note:** International shipments must include either `customs` or `advanced_options`.

        insurance_provider:
          default: none
          allOf:
            - $ref: "#/components/schemas/insurance_provider"
          description: |
            The insurance provider to use for any insured packages in the shipment.

        tags:
          type: array
          readOnly: false
          default: []
          minItems: 0
          items:
            allOf:
              - $ref: "#/components/schemas/tag"
          description: |
            Arbitrary tags associated with this shipment.  Tags can be used to categorize shipments, and shipments can be queried by their tags. Note: Tags require object structure with name property, not simple strings.

        order_source_code:
          allOf:
            - $ref: "#/components/schemas/order_source_name"

        packages:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/package"
          description: |
            The packages in the shipment.

            > **Note:** Some carriers only allow one package per shipment.  If you attempt to create a multi-package shipment for a carrier that doesn't allow it, an error will be returned.

        total_weight:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/weigth"
          description: The combined weight of all packages in the shipment

        batch_ids:
          readOnly: true
          type: array
          default: []
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
          example:
            - "se-9581628"
            - "se-1935182"
          description: |
            The unique IDs of any batches that this shipment is associated with. Returns an empty array if the shipment isn't associated with any batch.

            If the shipment is associated with more than one batch, the IDs are ordered by batch status priority: `open`, `queued`, `processing`, `completed`, `completed_with_errors`, `archived`, `notifying`, then `invalid`.

        comparison_rate_type:
          x-nullable: true
          type: string
          description: Calculate a rate for this shipment with the requested carrier using a ratecard that differs from the default.  Only supported for UPS and USPS.
          example: "retail"
    partial_shipment_for_rate_shopper:
      title: partial_shipment_for_rate_shopper
      type: object

      description: |
