  /v2/fulfillments:
    x-visibility: public
    summary: Fulfillments
    description: |
      Fulfillments represent completed shipments that have been marked as shipped with tracking information.
      Use fulfillments to notify customers and marketplaces when orders have been shipped and to provide tracking details.

    get:
      summary: List fulfillments
      description: |
        Retrieve a list of fulfillments based on various filter criteria. You can filter by shipment details,
        tracking information, dates, and more to find the specific fulfillments you need.
      tags:
        - fulfillments
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: list_fulfillments
      parameters:
        - name: ship_to_name
          in: query
          required: false
          schema:
            type: string
          description: Filter by recipient name
        - name: ship_to_country_code
          in: query
          required: false
          schema:
            type: string
          description: Filter by ship-to country code (2-letter ISO country code)
          example: "US"
        - name: shipment_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by shipment number (order number)
        - name: shipment_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific shipment id
          example: "se-12345678"
        - name: fulfillment_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific fulfillment id
          example: "se-12345678"
        - name: batch_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by batch ID
          example: "se-12345678"
        - name: order_source_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by order source id (store id)
          example: "se-12345678"
        - name: fulfillment_provider_code
          in: query
          required: false
          schema:
            type: string
          description: Filter by fulfillment provider code
        - name: tracking_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by tracking number
        - name: ship_date_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by ship date start (inclusive)
          example: "2024-01-01T00:00:00Z"
        - name: ship_date_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by ship date end (inclusive)
          example: "2024-01-31T23:59:59Z"
        - name: create_date_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by creation date start (inclusive)
          example: "2024-01-01T00:00:00Z"
        - name: create_date_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by creation date end (inclusive)
          example: "2024-01-31T23:59:59Z"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
          description: Number of results per page
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort direction
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - modified_at
              - shipped_at
            default: created_at
          description: Sort field

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fulfillments:
                    type: array
                    items:
                      $ref: "#/components/schemas/fulfillment"
                  page:
                    type: integer
                    description: Current page number
                    example: 1
                  pages:
                    type: integer
                    description: Total number of pages
                    example: 10
                  total:
                    type: integer
                    example: 100
                    description: Total number of fulfillments
                  links:
                    type: object
                    properties:
                      first:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/fulfillments?page=1&page_size=100"
                      last:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/fulfillments?page=3&page_size=100"
                      prev:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/fulfillments?page=1&page_size=100"
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                            example: "https://api.shipstation.com/v2/fulfillments?page=3&page_size=100"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create fulfillments
      description: |
        Create one or more fulfillments by marking shipments as shipped with tracking information.
        This will notify customers and marketplaces according to your configuration.
      tags:
        - fulfillments
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: create_fulfillments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fulfillments
              properties:
                fulfillments:
                  type: array
                  items:
                    type: object
                    required:
                      - shipment_id
                      - tracking_number
                      - carrier_code
                    properties:
                      shipment_id:
                        type: string
                        description: The shipment id to fulfill
                        example: "se-12345678"
                      tracking_number:
                        type: string
                        description: Tracking number for the shipment
                        example: "1Z12345E1234567890"
                      carrier_code:
                        type: string
                        description: Carrier code (e.g., "ups", "fedex", "usps")
                        example: "ups"
                      ship_date:
                        type: string
                        format: date-time
                        description: Ship date (defaults to current date if not provided)
                        example: "2024-01-15T10:00:00Z"
                      notify_customer:
                        type: boolean
                        description: Whether to notify the customer via email
                        example: true
                      notify_order_source:
                        type: boolean
                        description: Whether to notify the order source/marketplace
                        example: true

      responses:
        200:
          description: Fulfillments processed (check has_errors and individual results)
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_errors:
                    type: boolean
                    description: Indicates if any fulfillments failed to create
                    example: false
                  fulfillments:
                    type: array
                    items:
                      type: object
                      properties:
                        shipment_id:
                          type: string
                          description: The shipment ID that was processed
                          example: "se-12345678"
                        shipment_number:
                          type: string
                          description: The shipment number (order number)
                          example: "ORDER-001"
                        error_message:
                          type: [string, "null"]
                          description: Error message if creation failed (null on success)
                          example: null
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/provider_accounts:
    x-visibility: public
    summary: Freight provider accounts
    description: |
      List or connect freight provider accounts.

    get:
      summary: List freight provider accounts
      description: |
        Return the freight provider accounts connected to your account. Every freight request identifies the account it goes through with a `freight_provider_account_id`, so start here to find the ID to quote, book, and track with.

        Only active connections are returned. An account with no freight provider connected receives an empty array.
      operationId: list_freight_provider_accounts
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_freight_provider_accounts_response_body"

        400:
          $ref: "#/components/responses/BadRequest"

        500:
          $ref: "#/components/responses/ServerError"

    post:
      summary: Connect a freight provider account
      description: |
        Connect a freight account the seller already holds with the provider. Both connectable providers — `speedship` (WWEX) and `unishippers` — authenticate with an OAuth client ID / secret pair issued by the provider.

        The credentials are verified against the provider before they are stored, so a `201` means the connection can be quoted against immediately.

        A seller may hold one connection per provider. Connecting a provider that is already connected returns `409` with error code `freight_provider_already_connected` and the existing `freight_provider_account_id`. Use `PUT /v2/freight/provider_accounts/{freight_provider_account_id}/credentials` to rotate credentials on the existing connection. Use `DELETE /v2/freight/provider_accounts/{freight_provider_account_id}` to disconnect it.
      operationId: connect_freight_provider_account
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/connect_freight_provider_account_request_body"

      responses:
        201:
          description: The freight provider account was connected successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/freight_provider_account"
              example:
                freight_provider_account_id: se-4821
                freight_provider_code: SPEEDSHIP
                nickname: My WWEX account

        400:
          description: |
            A required field is missing or invalid, or the `freight_provider_code` is not a supported value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: validation
                    error_code: field_value_required
                    message: client_id is required.

        409:
          description: |
            The seller already has an active connection to this provider (`freight_provider_already_connected`). The error body includes the existing `freight_provider_account_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: business_rules
                    error_code: freight_provider_already_connected
                    message: "This account is already connected to freight provider 'speedship' as se-4821. Replace the credentials on that freight provider account instead of connecting again."

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/provider_accounts/{freight_provider_account_id}:
    x-visibility: public
    summary: Freight provider account
    description: Disconnect a freight provider account.

    parameters:
      - name: freight_provider_account_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/se_id"
        example: se-4821
        description: The identifier of the freight provider account to disconnect.

    delete:
      summary: Disconnect a freight provider account
      description: |
        Disconnect a freight provider account, removing its stored credentials.

        This is a soft delete: existing shipments and their tracking and documents are unaffected, but
        the account can no longer be quoted or booked against until it is reconnected via
        `POST /v2/freight/provider_accounts`.
      operationId: disconnect_freight_provider_account
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans

      responses:
        204:
          description: The freight provider account was disconnected successfully.

        404:
          description: |
            No active freight provider account with this `freight_provider_account_id` was found for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: validation
                    error_code: invalid_identifier
                    message: freight_provider_account_id se-999 is invalid.
                    field_name: freight_provider_account_id

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/provider_accounts/{freight_provider_account_id}/credentials:
    x-visibility: public
    summary: Freight provider account credentials
    description: Replace the credentials stored for a freight provider account.

    parameters:
      - name: freight_provider_account_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/se_id"
        example: se-4821
        description: The identifier of the freight provider account whose credentials to replace.

    put:
      summary: Update freight provider account credentials
      description: |
        Replace the credentials stored for a freight provider account — the mechanism for rotating a client secret without disconnecting.

        The new credentials are verified against the provider before they replace the stored pair, so a failed verification leaves the existing connection working. The connection's nickname and account number are untouched.
      operationId: update_freight_provider_account_credentials
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update_freight_provider_account_credentials_request_body"

      responses:
