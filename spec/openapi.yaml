          example: 1234567

        status_description:
          type: string
          readOnly: true
          example: Delivered
          minLength: 0
          description: Status description

        status_detail_description:
          type: string
          readOnly: true
          example: Your shipment has been delivered.
          minLength: 0
          description: Status detail description

        carrier_status_code:
          type: string
          readOnly: true
          minLength: 1
          example: "1"
          description: Carrier status code

        carrier_detail_code:
          type: string
          readOnly: true
          minLength: 1
          example: "OT"
          description: Carrier detail code

        carrier_status_description:
          type: string
          minLength: 0
          readOnly: true
          example: Your item was delivered in or at the mailbox at 9:10 am on March
          description: carrier status description

