  /v2/freight/shipments/{freight_shipment_id}/tracking:
    x-visibility: public
    summary: Freight shipment tracking
    description: Retrieve live tracking for a booked freight shipment.

    parameters:
      - $ref: "#/components/parameters/freight_shipment_id_path_param"

    get:
      summary: Get freight shipment tracking
      description: |
        Retrieve the current tracking status and event history for a booked freight shipment directly from the carrier.

        The shipment is tracked by its PRO number when one has been assigned, and by its BOL number otherwise. A shipment that has neither returns a `400 Bad Request` with error code `freight_tracking_not_available` — this is normal immediately after booking, before the carrier assigns a PRO number.
      operationId: get_freight_shipment_tracking
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/freight_shipment_tracking_response_body"

        400:
          description: |
            The freight shipment ID is malformed, the shipment has no PRO or BOL number to track yet (`freight_tracking_not_available`), or the freight provider connection is not active (`freight_connection_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: business_rules
                    error_code: freight_tracking_not_available
                    message: Tracking is not yet available for this shipment. A PRO or BOL number is required.

        404:
          description: |
            The freight shipment does not exist on this account (`freight_shipment_not_found`), or the carrier returned no tracking information (`freight_tracking_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: carrier
                    error_type: business_rules
                    error_code: freight_tracking_not_found
                    message: No tracking information was found for this shipment.

        500:
          $ref: "#/components/responses/ServerError"

  /v2/freight/tracking:
    x-visibility: public
    summary: Freight tracking by number
    description: Track any freight shipment by its PRO or BOL number.

    get:
      summary: Get freight tracking by number
      description: |
        Retrieve tracking for a freight shipment by its PRO or BOL number, whether or not the shipment was booked through ShipStation. Use this when you have the carrier's reference number but no `freight_shipment_id` — for example, for a shipment booked outside the API.

        `carrier_scac` is required as well as the number itself, because the freight provider needs the SCAC to resolve a tracking number.
      operationId: get_freight_tracking
      tags:
        - freight
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      parameters:
        - name: freight_provider_account_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/se_id"
          example: se-4821
          description: |
            The freight provider account to track through. Retrieve it with [List freight provider accounts](#operation/list_freight_provider_accounts).
        - name: tracking_number
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: "072-51293847"
          description: The PRO or BOL number to track.
        - name: tracking_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - pro_number
              - bol_number
          example: pro_number
          description: Which kind of number `tracking_number` is.
        - name: carrier_scac
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: FXFE
          description: |
            The Standard Carrier Alpha Code (SCAC) of the LTL carrier. Required: the freight provider needs the SCAC to resolve a tracking number.

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/freight_tracking_response_body"

        400:
          description: |
            `freight_provider_account_id` is missing or is not a valid account ID (`freight_provider_id_required`), `tracking_number`, `tracking_type`, or `carrier_scac` is missing or invalid, or the freight provider connection is not active (`freight_connection_inactive`).

            The `freight_provider_id_required` message still names the parameter `seller_freight_provider_id`, the name this parameter had previously. Match on `error_code`, not on `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"
              example:
                request_id: 4b8e2f4c-1f6f-4b1a-9c4a-8f5e6d7c8b9a
                errors:
                  - error_source: shipengine
                    error_type: business_rules
                    error_code: freight_provider_id_required
                    message: seller_freight_provider_id is required.

        404:
          description: The carrier returned no tracking information for the number (`freight_tracking_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response_body"

        500:
          $ref: "#/components/responses/ServerError"

  /v2/labels:
    x-visibility: public
    summary: Print shipping labels
    description: |
      Print shipping labels for any of the top global carriers in minutes. Simply connect your existing carrier accounts in the API dashboard, and start creating labels.

