        type: string
      description: The unique identifier of the document.
      example: 7f3c1b2a-9d4e-4f5a-8c6b-2e1d0a9b8c7d

    external_shipment_id_path_param:
      name: external_shipment_id
      in: path
      schema:
        type: string
      required: true
      example: 0bcb569d-1727-4ff9-ab49-b2fec0cee5ae

    external_shipment_id_query_param:
      name: external_shipment_id
      in: query
      schema:
        type: string
      required: false
      example: 0bcb569d-1727-4ff9-ab49-b2fec0cee5ae
      description: Filter labels by external shipment ID.

    filename_path_param:
