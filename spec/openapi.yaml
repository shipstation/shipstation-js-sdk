          minimum: 0
          description: Shipping zone
          example: 1

        display_scheme:
          type: string
          x-nullable: true
          description: Display scheme for the shipment
          example: "label"

        tax_identifiers:
          type: array
          x-nullable: true
          items:
            allOf:
              - $ref: "#/components/schemas/tax_identifier"

        external_shipment_id:
          type: string
          maxLength: 50
          x-nullable: true
          example: "1234556"
          description: |
            A user-defined key that identifies the source order. Multiple shipments can share the same `external_shipment_id` (common in split-shipping scenarios where one order results in multiple shipments). Functionally identical to `orderKey` in V1 API.

            > **Warning:** The `external_shipment_id` is limited to 50 characters. Any additional characters will be truncated.

        shipment_number:
          type: string
          maxLength: 50
          x-nullable: true
          readOnly: false
          example: "10001"
          description: |
            A non-unique user-defined number used to identify a shipment.  If undefined, this will match the external_shipment_id of the shipment.

            > **Warning:** The `shipment_number` is limited to 50 characters. Any additional characters will be truncated.

        ship_date:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/date"
          description: |
            The date that the shipment was (or will be) shipped.  ShipStation will take the day of week into consideration. For example, if the carrier does not operate on Sundays, then a package that would have shipped on Sunday will ship on Monday instead.

        created_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the shipment was created in ShipStation .

        modified_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the shipment was created or last modified.

        shipment_status:
          readOnly: true
          default: pending
          allOf:
            - $ref: "#/components/schemas/shipment_status"
          description: The current status of the shipment

        ship_to:
          allOf:
            - $ref: "#/components/schemas/shipping_address_to"
          description: The recipient's mailing address

        ship_from:
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The shipment's origin address. If you frequently ship from the same location, consider [creating a warehouse].  Then you can simply specify the `warehouse_id` rather than the complete address each time.

        warehouse_id:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The [warehouse] that the shipment is being shipped from.  Either `warehouse_id` or `ship_from` must be specified.

        return_to:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: |
            The return address for this shipment.  Defaults to the `ship_from` address.  Can be sent with a warehouse_id, in which case the return address can be overridden.  This allows you to have a different address printed on the label while maintaining the origin address.

        is_return:
          type: boolean
          x-nullable: true
          default: false
          description: |
            An optional indicator if the shipment is intended to be a return. Defaults to false if not provided.
          example: true

        confirmation:
          default: none
          allOf:
            - $ref: "#/components/schemas/delivery_confirmation"
          description: The type of delivery confirmation for this shipment. Defaults to 'none' if not specified.

        customs:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/international_shipment_options"
          description: |
            Customs information.  This is usually only needed for international shipments.

        advanced_options:
          readOnly: false
          allOf:
            - $ref: "#/components/schemas/advanced_shipment_options"
          description: Advanced shipment options.  These are entirely optional.

        insurance_provider:
          default: none
          allOf:
            - $ref: "#/components/schemas/insurance_provider"
          description: |
            The insurance provider to use for any insured packages in the shipment.

        tags:
          type: array
          readOnly: false
          default: []
          minItems: 0
          items:
            allOf:
              - $ref: "#/components/schemas/tag"
          description: |
            Arbitrary tags associated with this shipment.  Tags can be used to categorize shipments, and shipments can be queried by their tags. Note: Tags require object structure with name property, not simple strings.

        order_source_code:
          allOf:
            - $ref: "#/components/schemas/order_source_name"

        packages:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/package"
          description: |
            The packages in the shipment.

            > **Note:** Some carriers only allow one package per shipment.  If you attempt to create a multi-package shipment for a carrier that doesn't allow it, an error will be returned.

        total_weight:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/weigth"
          description: The combined weight of all packages in the shipment

        comparison_rate_type:
          x-nullable: true
          type: string
          description: Calculate a rate for this shipment with the requested carrier using a ratecard that differs from the default.  Only supported for UPS and USPS.
          example: "retail"
    create_and_validate_shipment:
      title: create_and_validate_shipment
      type: object

      description: A create and validate shipment resource

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/partial_shipment"

        - title: create_shipment_response_body_fields
          type: object
          properties:
            errors:
              type: array
              deprecated: true
              items:
                type: string
                minLength: 1
                example: Parameter value '100000000.00' is out of range.
                description: An error that occurred while creating a shipment.
              description: An array of errors that occurred while creating shipment.
              readOnly: true

            address_validation:
              allOf:
                - $ref: "#/components/schemas/address_validation_result"
              description: The address validation
    compare_bulk_rates_request_body:
      title: compare_bulk_rates_request_body
      type: object
      description: >-
        A rate shipments request body. Provide `shipment_ids`, `shipments`, or both.
        The API rejects a request that includes neither, and rates at most 100
        shipments per request, counting both arrays together.
      additionalProperties: false
      required:
        - rate_options
      properties:
        rate_options:
          allOf:
            - $ref: "#/components/schemas/rate_request_body"
          description: The rate options
        shipment_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
            description: shipment ids
          description: The array of shipment IDs
        shipments:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/address_validating_shipment"
            description: The shipment to get a bulk rate estimate for
          description: The array of shipments to get bulk rate estimates for
        ship_to_service_point_id:
          type: string
          description: >-
            A unique identifier for a carrier service point where the shipment
            will be delivered by the carrier. This will take precedence over a
            shipment's ship to address.
          example: "614940"
        ship_from_service_point_id:
          type: string
          description: >-
            A unique identifier for a carrier drop off point where a merchant
            plans to deliver packages. This will take precedence over a
            shipment's ship from address.
          example: "614940"
    compare_bulk_rates_response_body:
      title: compare_bulk_rates_response_body
      type: array
      description: A bulk rate response body
      items:
        $ref: "#/components/schemas/bulk_rate"
    create_combined_label_document_request_body:
      title: create_combined_label_document_request_body
      type: object
      description: A create combined label document request body
      additionalProperties: false
      properties:
        label_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
          description: >
            The list of up to 30 label IDs to include in the combined label
            document.

            Note that to avoid response size limits, you should only expect to
            be able to combine 30 single page labels similar in size to that of
            USPS labels.
        label_format:
          enum:
            - pdf
          type: string
          example: pdf
          description: >-
            The file format for the combined label document; note that currently
            only `"pdf"` is supported.
        label_download_type:
          default: inline
          allOf:
            - $ref: "#/components/schemas/label_download_type"
    create_combined_label_document_response_body:
      title: create_combined_label_document_response_body
      type: object
      description: A create combined label document response body
      additionalProperties: false
      properties:
        label_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/label_download"
          description: The download for the combined label document
    document_type:
      title: document_type
      type: string
      description: >
        The type of carrier document being registered. Supported values vary by
        carrier. See the [Carrier Document Upload guide](/upload-carrier-documents)
        for the document types each carrier accepts.
      enum:
        - commercial_invoice
        - certificate_of_origin
        - usmca_commercial_invoice_certification_of_origin
        - usmca_certification_of_origin
        - pro_forma_invoice
        - other
        - authorization_form
        - export_accompanying_document
        - export_license
        - import_permit
        - one_time_nafta
        - power_of_attorney
        - packing_list
        - sed_document
        - shippers_letter_of_instruction
        - declaration
        - section_232_customs_affidavit
      example: usmca_commercial_invoice_certification_of_origin
    document_format:
      title: document_format
      type: string
      description: The file format of the document being uploaded.
      enum:
        - PDF
        - PNG
      example: PDF
    document_status_value:
      title: document_status_value
      type: string
      description: |
        The processing status of a carrier document.

        - `awaiting_upload` - The document has been registered and is waiting for the file to be uploaded to the provided upload target.
        - `processing` - The uploaded file is being processed.
        - `processing_claimed` - The document has been claimed for processing.
        - `invalid` - The document failed validation and cannot be used.
        - `uploaded` - The file has been uploaded successfully and is ready to be sent to the carrier.
        - `queued` - The document is queued to be sent to the carrier.
        - `sent` - The document has been transmitted to the carrier.
        - `failed` - Sending the document to the carrier failed.
      enum:
        - awaiting_upload
        - processing
        - processing_claimed
        - invalid
        - uploaded
        - queued
        - sent
        - failed
      example: awaiting_upload
    register_document_request_body:
      title: register_document_request_body
      type: object
      description: A request to register a carrier document against a shipment or label.
      additionalProperties: false
      required:
        - type
        - file_name
      properties:
        type:
          allOf:
            - $ref: "#/components/schemas/document_type"
          description: The type of document being registered.
        format:
          allOf:
            - $ref: "#/components/schemas/document_format"
          description: The file format of the document. Defaults to `PDF` when omitted.
        file_name:
          type: string
          description: The file name of the document, including its extension.
          example: usmca-certification-of-origin.pdf
    register_document_response_body:
      title: register_document_response_body
      type: object
      description: >
        The result of registering a document. Use the returned `upload` target to
        upload the document file to Amazon S3 before sending it to the carrier.
      additionalProperties: false
      properties:
        document_id:
          type: string
          description: The unique identifier assigned to the registered document.
          example: 019eb24e-cd4e-7609-b740-c2324fe93272
        upload:
          allOf:
            - $ref: "#/components/schemas/document_upload_target"
          description: >
            The pre-signed Amazon S3 target the document file must be uploaded to.
      example:
        document_id: 019eb24e-cd4e-7609-b740-c2324fe93272
        upload:
          url: https://carrier-doc-upload.s3.amazonaws.com
          fields:
            Content-Type: application/pdf
            key: 019eb24e-cd4e-7609-b740-c2324fe93272.pdf
            x-amz-meta-document-id: 019eb24e-cd4e-7609-b740-c2324fe93272
            x-amz-meta-seller-id: "8801990"
            X-Amz-Algorithm: AWS4-HMAC-SHA256
            X-Amz-Credential: ASIA.../20260610/us-east-1/s3/aws4_request
            X-Amz-Date: 20260610T161249Z
            Policy: eyJleHBpcmF0aW9uIjoi...
            X-Amz-Signature: b81189b9df29...
            X-Amz-Security-Token: IQoJb3JpZ2lu...
    document_upload_target:
      title: document_upload_target
      type: object
      description: >
        A pre-signed Amazon S3 POST target describing where and how to upload a
        document file.
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: >
            The Amazon S3 endpoint to upload the document file to via an HTTP
            `POST` with `multipart/form-data`.
          example: https://carrier-doc-upload.s3.amazonaws.com
        fields:
          type: object
          description: >
            The S3 presigned-POST form fields. Include **every** field exactly as
            returned in the upload request, followed by a `file` part containing
            the document content.
          properties:
            Content-Type:
              type: string
              description: The MIME type of the document; matches the registered document format.
              example: application/pdf
            key:
              type: string
              description: The S3 object key the file will be stored under.
              example: 019eb24e-cd4e-7609-b740-c2324fe93272.pdf
            x-amz-meta-document-id:
              type: string
              description: "S3 object metadata: the registered document's unique identifier."
              example: 019eb24e-cd4e-7609-b740-c2324fe93272
            x-amz-meta-seller-id:
              type: string
              description: "S3 object metadata: the seller's identifier."
              example: "8801990"
            X-Amz-Algorithm:
              type: string
              description: The AWS signing algorithm used for the pre-signed POST.
              example: AWS4-HMAC-SHA256
            X-Amz-Credential:
              type: string
              description: The AWS credential scope used to sign the upload.
              example: ASIA.../20260610/us-east-1/s3/aws4_request
            X-Amz-Date:
              type: string
              description: The timestamp the signature was generated, in ISO 8601 basic format.
              example: 20260610T161249Z
            Policy:
              type: string
              description: >
                The base64-encoded S3 POST policy defining the conditions the
                upload must satisfy, such as the allowed key, content type, size,
                and expiration.
              example: eyJleHBpcmF0aW9uIjoi...
            X-Amz-Signature:
              type: string
              description: The signature authorizing the upload, derived from the policy and credentials.
              example: b81189b9df29...
            X-Amz-Security-Token:
              type: string
              description: The temporary AWS session token for the credentials.
              example: IQoJb3JpZ2lu...
          additionalProperties:
            type: string
    document_status:
      title: document_status
      type: object
      description: The current state of a carrier document.
      additionalProperties: false
      properties:
        document_id:
          type: string
          description: The unique identifier of the document.
          example: 7f3c1b2a-9d4e-4f5a-8c6b-2e1d0a9b8c7d
        type:
          allOf:
            - $ref: "#/components/schemas/document_type"
          description: The type of the document.
        file_name:
          type: string
          description: The file name of the document.
          example: usmca-certification-of-origin.pdf
        status:
          allOf:
            - $ref: "#/components/schemas/document_status_value"
          description: The processing status of the document.
        error:
          type: string
          x-nullable: true
          example: The uploaded file could not be read.
          description: A description of the error when the document is `invalid` or `failed`; otherwise `null`.
        external_id:
          type: string
          x-nullable: true
          example: 1Z999AA10123456784
          description: The carrier-assigned identifier for the document once it has been sent; otherwise `null`.
    list_documents_response_body:
      title: list_documents_response_body
      type: array
      description: The list of documents registered against the shipment or label.
      items:
        $ref: "#/components/schemas/document_status"
    order_shipment:
      title: order_shipment
      type: object
      description: A shipment associated with the requested id, along with its registered documents.
      additionalProperties: false
      properties:
        shipment_id:
          type: string
          description: The unique identifier of the shipment.
          example: se-28529731
        tracking_number:
          type: string
          description: The tracking number of the shipment.
          example: 1Z999AA10123456784
        documents:
          type: array
          description: The carrier documents registered against the shipment.
          items:
            $ref: "#/components/schemas/document_status"
    list_shipment_labels_response_body:
      title: list_shipment_labels_response_body
      type: array
      description: The list of shipments associated with the requested id and their registered documents.
      items:
        $ref: "#/components/schemas/order_shipment"
    send_documents_response_body:
      title: send_documents_response_body
