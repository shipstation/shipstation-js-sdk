  /v2/manifests:
    x-visibility: public
    summary: Manifests
    description: |
      Many manifests are sent electronically to the carrier when you create a label, and
      often physical manifests are not necessary. Carriers receive the package details, shipping date,
      and other information that help them plan your package's delivery when you create a label.

      However, some providers, like USPS require manifests when shipping large numbers of packages. Think about how long it would take for a delivery driver to arrive, pick up 100 packages, and individually scan each of them.

      A manifest exists so the carrier can scan the manifest and check in all the packages being shipped.

    get:
      summary: List manifests

      description: Similar to querying shipments, we allow you to query manifests since there will likely be a large number over a long period of time.

      tags:
        - manifests
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
      operationId: list_manifests

      parameters:
        - $ref: "#/components/parameters/warehouse_id_query_param"

        - name: ship_date_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: 2018-09-23T15:00:00.000Z
          description: ship date start range

        - name: ship_date_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: 2018-09-23T15:00:00.000Z
          description: ship date end range

        - $ref: "#/components/parameters/created_at_start_query_param"

        - $ref: "#/components/parameters/created_at_end_query_param"

        - $ref: "#/components/parameters/carrier_id_query_param"

        - $ref: "#/components/parameters/page_query_param"

        - $ref: "#/components/parameters/page_size_query_param"

        - $ref: "#/components/parameters/label_ids_query_param"

      responses:
        200:
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_manifests_response_body"

        400:
          $ref: "#/components/responses/BadRequest"

        404:
          $ref: "#/components/responses/NotFound"

        500:
          $ref: "#/components/responses/ServerError"

    post:
      summary: Create manifest

      description: |
        Each ShipStation manifest is created for a specific warehouse, so you'll need to provide the warehouse_id
        rather than the ship_from address. You can create a warehouse for each location that you want to create manifests for.

      tags:
