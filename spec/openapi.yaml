    create_shipment_request:
      title: create_shipment_request
      type: object

      description: A single shipment creation request

      additionalProperties: false

      properties:
        validate_address:
          allOf:
            - $ref: "#/components/schemas/validate_address"
          description: Address validation option

        external_shipment_id:
          type: string
          maxLength: 50
          x-nullable: true
          example: "1751939189"
          description: |
            A unique user-defined key to identify a shipment. This can be used to retrieve the shipment.

        carrier_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The carrier account that is billed for the shipping charges
          example: "se-2774150"

        create_sales_order:
          type: boolean
          default: false
          description: Whether to create a sales order for this shipment
          example: true

        store_id:
          x-nullable: true
          type: string
          description: The store ID associated with the shipment
          example: "1582173"

        notes_from_buyer:
          type: string
          x-nullable: true
          description: Notes from the buyer
          example: "I am a note from the buyer"

        notes_to_buyer:
          type: string
          x-nullable: true
          description: Notes to the buyer
          example: "Thank you for your order!"

        notes_for_gift:
          type: string
          x-nullable: true
          description: Gift notes
          example: "I am a gift note"

        internal_notes:
          type: string
          x-nullable: true
          description: Internal notes from the seller
          example: "Check packaging before shipping"

        is_gift:
          type: boolean
          default: false
          description: Indicates if the shipment is a gift
          example: true

        zone:
          type: integer
          format: int32
          x-nullable: true
          minimum: 0
          description: Shipping zone
          example: 0

        display_scheme:
          type: string
          x-nullable: true
          description: Display scheme for the shipment
          example: "paperless"

        requested_shipment_service:
          type: string
          x-nullable: true
          description: The requested shipment service
          example: "usps_priority_mail"

        deliver_by_date:
          type: string
          format: date-time
          x-nullable: true
          description: Date by which the shipment should be delivered
          example: "2025-01-20T00:00:00.000Z"

        assigned_user:
          type: string
          x-nullable: true
          description: User assigned to the shipment
          example: "a2df9fa5-b7ee-467f-be4e-9c660542c187"

        shipment_status:
          allOf:
            - $ref: "#/components/schemas/shipment_status"
          description: The status of the shipment
          example: "pending"

        amount_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Total amount paid for the order

        shipping_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for shipping

        tax_paid:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Amount paid for taxes

        ship_to:
          allOf:
            - $ref: "#/components/schemas/shipping_address_to"
          description: The recipient's mailing address

        ship_from:
          allOf:
            - $ref: "#/components/schemas/shipping_address"
          description: The shipment's origin address

        warehouse_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: |
            The warehouse ID to use as the ship from location. This is an alternative to providing a ship_from address object.
            You cannot specify both warehouse_id and ship_from in the same request.
          example: "se-2774150"

        items:
          type: array
          default: []
          items:
            allOf:
              - $ref: "#/components/schemas/shipment_item"
          description: Items included in this shipment

        packages:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/package"
          description: The packages in the shipment
    assign_user_request_body:
