      description: The identifier of the freight shipment.

    batch_id_path_param:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/se_id"
      description: Batch ID

    batch_id_query_param:
      name: batch_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/se_id"
      description: Batch ID

    tag_query_param:
      name: tag
      in: query
      required: false
      description: Filter shipments by tag name. Returns only shipments that have been assigned the specified tag. You can filter by one tag at a time. Tags are arbitrary strings used to categorize shipments (e.g., "Priority", "Fragile", "International").
      schema:
        $ref: "#/components/schemas/tag_name"

    batch_number_query_param:
      name: batch_number
      in: query
      required: false
      schema:
        type: string
      description: Batch Number

    batch_status_query_param:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/batch_status"

    carrier_code_query_param:
      name: carrier_code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      example: stamps_com
      description: |
        A [shipping carrier] , such as `fedex`, `dhl_express`, `stamps_com`, etc.

    carrier_id_path_param:
      name: carrier_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/se_id"
      example: se-28529731
      description: Carrier ID

    carrier_id_query_param:
      name: carrier_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/se_id"
      description: Carrier ID

    created_at_end_query_param:
      name: created_at_end
      in: query
      required: false
      schema:
        type: string
        format: date-time
      example: 2019-03-12T19:24:13.657Z
      description: Used to create a filter for when a resource was created, (ex. A shipment that was created before a certain time)

    created_at_start_query_param:
      name: created_at_start
      in: query
      required: false
      schema:
        type: string
        format: date-time
      example: 2019-03-12T19:24:13.657Z
      description: Used to create a filter for when a resource was created (ex. A shipment that was created after a certain time)

    dir_path_param:
      name: dir
      in: path
      required: true
      schema:
        type: string

    external_batch_id_path_param:
