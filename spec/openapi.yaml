                enum: [what3words]
              value:
                type: string
                example: cats.with.thumbs
                description: value of the geolocation item
    address:
      title: address
      type: object

      description: |
        Any residential or business mailing address, anywhere in the world.

        > **Note:** Either `name` or `company_name` must be set. Both may be specified, if relevant.

      required:
        - name
        - phone
        - address_line1
        - city_locality
        - state_province
        - postal_code
        - country_code
        - address_residential_indicator

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/partial_address"
    partial_address:
      title: partial_address
      type: object

      description: A complete or partial mailing address.

      additionalProperties: false

      properties:
        name:
          type: string
          minLength: 1
          example: John Doe
          description: |
            The name of a contact person at this address.  This field may be set instead of - or in addition to - the `company_name` field.

        phone:
          type: string
          minLength: 1
          example: +1 204-253-9411 ext. 123
          description: |
            The phone number of a contact person at this address.  The format of this phone number varies depending on the country.

        email:
          type: string
          x-nullable: true
          example: example@example.com
          description: |
            Email for the address owner.

        company_name:
          type: string
          minLength: 1
          x-nullable: true
          example: The Home Depot
          description: |
            If this is a business address, then the company name should be specified here.

        address_line1:
          type: string
          minLength: 1
          example: 1999 Bishop Grandin Blvd.
          description: |
            The first line of the street address.  For some addresses, this may be the only line.  Other addresses may require 2 or 3 lines.

        address_line2:
          type: string
          minLength: 1
          x-nullable: true
          example: Unit 408
          description: |
            The second line of the street address.  For some addresses, this line may not be needed.

        address_line3:
          type: string
          minLength: 1
          x-nullable: true
          example: "Building #7"
          description: |
            The third line of the street address.  For some addresses, this line may not be needed.

        city_locality:
          type: string
          minLength: 1
          example: Winnipeg
          description: The name of the city or locality

        state_province:
          type: string
          minLength: 1
          example: Manitoba
          description: |
            The state or province.  For some countries (including the U.S.) only abbreviations are allowed.  Other countries allow the full name or abbreviation.

        postal_code:
          allOf:
            - $ref: "#/components/schemas/postal_code"

        country_code:
          allOf:
            - $ref: "#/components/schemas/country_code"
          description: |
            The two-letter [ISO 3166-1 country code](https://en.wikipedia.org/wiki/ISO_3166-1)

        address_residential_indicator:
          default: unknown
          example: yes
          description: Indicates whether this is a residential address.
          allOf:
            - $ref: "#/components/schemas/address_residential_indicator"
    pickup:
      title: pickup
      type: object

      description: |
        The information necessary to schedule a package pickup

      additionalProperties: false

      properties:
        pickup_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/pickup_resource_id"

        label_ids:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/se_id"
            description: Label ID that will be included in the pickup request
          description: Label IDs that will be included in the pickup request

        created_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the pickup was created in ShipStation .

        cancelled_at:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date_time"
          description: The date and time that the pickup was cancelled in ShipStation .

        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The carrier_id associated with the pickup
          example: "se-1234567"

        confirmation_number:
          readOnly: true
          type: string
          x-nullable: true
          description: The carrier confirmation number for the scheduled pickup.
          example: 292513CL4A3

        warehouse_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: The warehouse_id associated with the pickup

        pickup_address:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/address"

        contact_details:
          title: contact_details
          type: object
          required:
            - name
            - email
            - phone
          properties:
            name:
              type: string
              minLength: 1
              example: "Jonh"
            email:
              allOf:
                - $ref: "#/components/schemas/email"
              example: "email@email.com"
            phone:
              type: string
              minLength: 7
              description: Phone number associated
              example: "89876752562"

        pickup_notes:
          type: string
          minLength: 0
          description: Used by some carriers to give special instructions for a package pickup
          example: "call before 15:00"

        pickup_window:
          title: pickup_window
          writeOnly: true
          type: object
          description: The desired time range for the package pickup.
          required:
            - start_at
            - end_at
          properties:
            start_at:
              allOf:
                - $ref: "#/components/schemas/date_time"
            end_at:
              allOf:
                - $ref: "#/components/schemas/date_time"

        pickup_windows:
          readOnly: true
          type: array
          description: |
            An array of available pickup windows. Carriers can return multiple times that they will pickup packages.
          items:
            allOf:
              - title: pickup_windows
                type: object
                properties:
                  start_at:
                    allOf:
                      - $ref: "#/components/schemas/date_time"
                  end_at:
                    allOf:
                      - $ref: "#/components/schemas/date_time"
    dimensions:
      title: dimensions
      type: object

      description: The dimensions of a package

      required:
        - unit
        - length
        - width
        - height

      additionalProperties: false

      properties:
        unit:
          default: inch
          allOf:
            - $ref: "#/components/schemas/dimension_unit"
          description: Dimension unit

        length:
          type: number
          minimum: 0
          default: 0
          example: 2
          description: The length of the package, in the specified unit

        width:
          type: number
          minimum: 0
          default: 0
          example: 2
          description: The width of the package, in the specified unit

        height:
          type: number
          minimum: 0
          default: 0
          example: 1
          description: The height of the package, in the specified unit
    weigth:
      title: weight
      type: object

      description: The weight of a package

      required:
        - value
        - unit

      additionalProperties: false

      properties:
        value:
          type: number
          exclusiveMinimum: 0
          description: The weight, in the specified unit
          example: 3

        unit:
          allOf:
            - $ref: "#/components/schemas/weight_unit"
          example: "pound"
          description: Weight unit
    rates_information:
      title: rates_information
      type: object

      description: A rates information resource

      additionalProperties: false

      properties:
        rates:
          type: array
          readOnly: true
          items:
            readOnly: true
            allOf:
              - $ref: "#/components/schemas/rate"
            description: Shipment Rates
          description: An array of shipment rates

        invalid_rates:
          type: array
          readOnly: true
          default: []
          items:
            readOnly: true
            allOf:
              - $ref: "#/components/schemas/rate"
            description: Invalid Shipment Rate
          description: An array of invalid shipment rates

        rate_request_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the rate request

        shipment_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the shipment

        created_at:
          type: string
          format: date-time
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: When the rate was created

        status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/rate_response_status"

        errors:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/error"
    rate:
      title: rate
      type: object

      description: A rate

      required:
        - rate_id
        - rate_type
        - carrier_id
        - shipping_amount
        - insurance_amount
        - confirmation_amount
        - other_amount
        - zone
        - package_type
        - guaranteed_service
        - negotiated_rate
        - service_type
        - service_code
        - trackable
        - carrier_code
        - carrier_nickname
        - carrier_friendly_name
        - validation_status
        - warning_messages
        - error_messages

      additionalProperties: false

      properties:
        rate_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the rate

        rate_type:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/rate_type"

        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the carrier
          example: "se-1234567"

        shipping_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The shipping amount. Should be added with confirmation_amount, insurance_amount and other_amount to calculate the total purchase price.

        insurance_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The insurance amount.  Should be added with shipping_amount, confirmation_amount and other_amount to calculate the total purchase price.

        confirmation_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The confirmation amount.  Should be added with shipping_amount, insurance_amount and other_amount to calculate the total purchase price.

        other_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Any other charges associated with this rate.  Should be added with shipping_amount, insurance_amount and confirmation_amount to calculate the total purchase price.

        requested_comparison_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: The total shipping cost for the specified comparison_rate_type.

        tax_amount:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Tariff and additional taxes associated with an international shipment.

        zone:
          type: integer
          format: int32
          x-nullable: true
          readOnly: true
          minimum: 0
          example: 6
          description: |
            Certain carriers base [their rates](https://blog.stamps.com/2017/09/08/usps-postal-zones/) off of
            custom zones that vary depending upon the ship_to and ship_from location

        package_type:
          type: string
          x-nullable: true
          readOnly: true
          minLength: 1
          example: package
          description: package type that this rate was estimated for

        delivery_days:
          type: integer
          format: int32
          x-nullable: true
          readOnly: true
          minimum: 1
          example: 5
          description: |
            The number of days estimated for delivery, this will show the _actual_ delivery
            time if for example, the package gets shipped on a Friday

        guaranteed_service:
          type: boolean
          readOnly: true
          description: Indicates if the rate is guaranteed.
          example: true

        estimated_delivery_date:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/date"
          example: "2024-12-23T00:00:00.000Z"

        carrier_delivery_days:
          type: string
          readOnly: true
          minLength: 1
          example: "22"
          description: The carrier delivery days

        ship_date:
          type: string
          format: date-time
          readOnly: true
          minLength: 1
          example: "2024-10-22T00:00:00Z"
          description: ship date

        negotiated_rate:
          type: boolean
          readOnly: true
          description: Indicates if the rates been negotiated
          example: true

        service_type:
          type: string
          readOnly: true
          minLength: 1
          example: "next_day"
          description: service type

        service_code:
          type: string
          readOnly: true
          minLength: 1
          description: service code for the rate
          example: "usps_priority_mail_express"

        trackable:
          type: boolean
          readOnly: true
          description: Indicates if rate is trackable
          example: true

        carrier_code:
          type: string
          readOnly: true
          minLength: 1
          description: carrier code
          example: "stamps_com"

        carrier_nickname:
          type: string
          readOnly: true
          minLength: 1
          example: "Free"
          description: carrier nickname

        carrier_friendly_name:
          type: string
          readOnly: true
          minLength: 1
          example: "free"
          description: carrier friendly name

        validation_status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/validation_status"

        warning_messages:
          type: array
          readOnly: true
          minItems: 0
          items:
            type: string
            readOnly: true
            minLength: 0
            description: warning message
          description: The warning messages

        error_messages:
          type: array
          readOnly: true
          minItems: 0
          items:
            type: string
            readOnly: true
            minLength: 0
            description: error message
          description: The error messages

        rate_details:
          type: array
          readOnly: true
          description: |
            A breakdown of individual charges that make up this rate, such as base shipping cost and additional fees. For DDP shipments it also includes duties, taxes, and import fees (prepaid on Wallet carriers, estimated on BYOA carriers).
          items:
            type: object
            properties:
              rate_detail_type:
                type: string
                example: "shipping"
                description: |
                  The category of charge. Common values include `shipping` and `additional_fees`. DDP shipments (`customs.terms_of_trade_code: ddp`) also return `prepaid_duties`, `prepaid_taxes` and `prepaid_import_fees` on Wallet carriers or `estimated_duties`, `estimated_taxes` and `estimated_import_fees` on BYOA (Bring Your Own Account) carriers.
              carrier_description:
                type: string
                example: "Shipping"
                description: The carrier-provided description of the charge.
              carrier_billing_code:
                type: string
                x-nullable: true
                example: "BaseServiceCharge"
                description: The carrier billing code, when provided by the carrier.
              carrier_memo:
                type: string
                x-nullable: true
                example: ""
                description: An optional carrier-supplied note for the charge.
              amount:
                allOf:
                  - $ref: "#/components/schemas/monetary_value"
                description: The amount of this individual charge.
              billing_source:
                type: string
                example: "carrier"
                description: |
                  The source that produced the charge. Common values are `carrier` for carrier-billed charges and `dutiestax` for duties and taxes on DDP shipments (prepaid on Wallet carriers, estimated on BYOA carriers).

                  > **Note:** The casing of this value differs by endpoint. Label responses return lowercase values (e.g. `carrier`, `dutiestax`). Rate responses return PascalCase values (e.g. `Carrier`, `DutiesTax`). This reflects the actual API behavior.
    service:
      title: service
      type: object

      description: A service offered by the carrier

      additionalProperties: false

      properties:
        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the carrier
          example: "se-1234567"

        carrier_code:
          allOf:
            - $ref: "#/components/schemas/se_id"

        service_code:
          type: string
          minLength: 1
          readOnly: true
          example: usps_media_mail
          description: service code

        name:
          type: string
          minLength: 1
          readOnly: true
          example: USPS First Class Mail
          description: User friendly service name

        domestic:
          type: boolean
          readOnly: true
          example: true
          description: Supports domestic shipping

        international:
          type: boolean
          readOnly: true
          example: true
          description: Supports international shipping.

        is_multi_package_supported:
          type: boolean
          example: true
          readOnly: true
          description: Carrier supports multiple packages per shipment

        send_rates:
          type: boolean
          readOnly: true
          description: The service provides rates for the shipment.
          example: true
    alternative_identifier:
      title: alternative_identifier
      type: object

      description: |
        Additional information some carriers may provide by which to identify a given label in their system.

      additionalProperties: false

      properties:
        type:
          type: string
          minLength: 1
          example: last_mile_tracking_number
          description: |
            The type of alternative_identifier that corresponds to the value.

        value:
          type: string
          minLength: 1
          example: "12345678912345678912"
          description: |
            The value of the alternative_identifier.
    address_validation_result:
      title: address_validation_result
      type: object

      description: An address validation result

      required:
        - status
        - original_address
        - matched_address
        - messages

      additionalProperties: false

      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/address_validation_status"

        original_address:
          allOf:
            - $ref: "#/components/schemas/address"
          description: The original address that was sent for validation

        matched_address:
          x-nullable: true
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/address"
          description: The matched address found by the ShipStation API

        messages:
          type: array
          readOnly: true
          default: []
          items:
            title: response_message
            type: object

            description: A response message that displays when additional info is needed for an address validation request.

            additionalProperties: false

            required:
              - code
              - message
              - type
              - detail_code

            properties:
              code:
                readOnly: true
                allOf:
                  - $ref: "#/components/schemas/address_validation_code"

              message:
                type: string
                readOnly: true
                example: Invalid Postal Code
                minLength: 1
                description: Message explaining the address validation error

              type:
                readOnly: true
                allOf:
                  - $ref: "#/components/schemas/address_validation_message_type"

              detail_code:
                x-nullable: true
                allOf:
                  - $ref: "#/components/schemas/address_validation_detail_code"

          description: The list of messages that were generated during the address validation request.
    label_package:
      title: label_package
      type: object

      description: |
        A package returned in the response from creating a [shipping label]

      required:
        - weight

      additionalProperties: false

      properties:
        package_id:
          readOnly: true
          type: integer
          format: int32
          description: The shipment package id
          example: 1234545

        package_code:
          allOf:
            - $ref: "#/components/schemas/package_code"
          description: |
            The [package type], such as `thick_envelope`, `small_flat_rate_box`, `large_package`, etc.  The code `package` indicates a custom or unknown package type.

        weight:
          allOf:
            - $ref: "#/components/schemas/weight"
          description: The package weight

        dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The package dimensions

        insured_value:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          default:
            currency: usd
            amount: 0
          description: |
            The insured value of the package.  Requires the `insurance_provider` field of the shipment to be set.

        tracking_number:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/tracking_number"
          description: |
            The tracking number for the package.  The format depends on the carrier.

        label_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/label_download"
          description: The label download for the package

        form_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: The form download for any customs that are needed

        qr_code_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/optional_link"
          description: The QR code download for the package

        paperless_download:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/paperless_download"
          description: The paperless details which may contain elements like `href`, `instructions` and `handoff_code`.

        label_messages:
          allOf:
            - $ref: "#/components/schemas/label_messages"

        external_package_id:
          type: string
          minLength: 1
          description: An external package id.
          example: "se-1234567"

        content_description:
          type: string
          minLength: 1
          maxLength: 35
          description: |
            A short description of the package content. Required for shipments moving to, from, and through Mexico.
          example: "Hand knitted wool socks"
          x-nullable: true

        sequence:
          readOnly: true
          format: int32
          type: integer
          description: Package sequence
          example: 34

        has_label_documents:
          type: boolean
          description: Whether the package has label documents available for download
          example: true

        has_form_documents:
          type: boolean
          description: Whether the package has form documents available for download
          example: true

        has_qr_code_documents:
          type: boolean
          description: Whether the package has QR code documents available for download
          example: true

        has_paperless_label_documents:
          type: boolean
          description: Whether the package has paperless documents available for download
          example: true
    package:
      title: package
      type: object

      description: |
        A package associated with a shipment

      required:
        - weight

      additionalProperties: false

      properties:
        shipment_package_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          readOnly: true
          description: A string that uniquely identifies this shipment package
          example: "se-123456"

        package_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies this [package type]
          example: "se-123456"

        package_code:
          allOf:
            - $ref: "#/components/schemas/package_code"
          description: |
            The [package type] such as `thick_envelope`, `small_flat_rate_box`, `large_package`, etc.  The code `package` indicates a custom or unknown package type.
          example: "thick_envelope"

        package_name:
          type: string
          description: The name of the of the [package type]
          example: "Flat Rate Envelope"

        weight:
          allOf:
            - $ref: "#/components/schemas/weight"
          description: The package weight

        dimensions:
          allOf:
            - $ref: "#/components/schemas/dimensions"
          description: The package dimensions

        insured_value:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          default:
            - currency: usd
              amount: 0
          description: |
            The insured value of the package.  Requires the `insurance_provider` field of the shipment to be set.

        label_messages:
          allOf:
            - $ref: "#/components/schemas/label_messages"

        external_package_id:
          type: string
          minLength: 1
          description: An external package id.
          example: "se-1234545"

        content_description:
          type: string
          minLength: 1
          maxLength: 35
          description: |
            A short description of the package content. Required for shipments moving to, from, and through Mexico.
          example: "Hand knitted wool socks"
          x-nullable: true

        products:
          type: array
          default: []
          minItems: 0
          description: Details about products inside packages (Information provided would be used on custom documentation)
          items:
            title: products
            type: object

            description: The customs declaration for a single item in the shipment.
            additionalProperties: false

            properties:
              description:
                type: string
                x-nullable: true
                maxLength: 100
                default: null
                description: A description of the item
                example: "a minimum description"

              quantity:
                type: integer
                format: int32
                minimum: 0
                default: 0
                description: The quantity of this item in the shipment.
                example: 1

              value:
                allOf:
                  - $ref: "#/components/schemas/monetary_value"
                description: The declared value of each item

              weight:
                allOf:
                  - $ref: "#/components/schemas/weight"
                description: The item weight

              harmonized_tariff_code:
                type: string
                x-nullable: true
                default: null
                example: "3926.10"
                description: The [Harmonized Tariff Code](https://en.wikipedia.org/wiki/Harmonized_System) of this item.

              country_of_origin:
                x-nullable: true
                default: null
                allOf:
                  - $ref: "#/components/schemas/country_code"
                description: |
                  The two-letter [ISO 3166-1 country code](https://en.wikipedia.org/wiki/ISO_3166-1) where this item originated

              unit_of_measure:
                type: string
                x-nullable: true
                example: "pound"

              sku:
                type: string
                description: The SKU (Stock Keeping Unit) of the item
                x-nullable: true
                example: "sku-1223344"

              sku_description:
                type: string
                description: Description of the Custom Item's SKU
                x-nullable: true
                example: "this is a description"

              mid_code:
                type: string
                description: Manufacturers Identification code
                x-nullable: true
                example: "GBCOM15BRI"

              product_url:
                type: string
                description: link to the item on the seller website
                x-nullable: true
                example: "https://myproduct.com"

              vat_rate:
                type: number
                description: VAT rate applicable to the item
                x-nullable: true
                example: 0.2

              dangerous_goods:
                type: array
                default: []
                minItems: 0
                description: >-
                  Details about dangerous goods inside products
                items:
                  $ref: "#/components/schemas/dangerous_goods"
              manufacturer_product_id_type:
                type: string
                x-nullable: true
                default: null
                allOf:
                  - $ref: "#/components/schemas/manufacturer_product_identifier_type"
                description: The type of identifier used for the manufacturer product ID.
                example: gtin
              manufacturer_product_id:
                type: string
                x-nullable: true
                default: null
                description: The manufacturer's product identifier corresponding to the `manufacturer_product_id_type`.
                example: "012345678905"
              manufacturer_ns_product_id:
                type: string
                x-nullable: true
                default: null
                description: A non-standardized product identifier unique to the manufacturer's own system that does not follow an internationally recognized standard (e.g. a SKU).
                example: "MY-SKU-12345"
              cpsc_certificates:
                type: array
                x-nullable: true
                default: null
                description: List of CPSC eFiling certificates associated with this product.
                items:
                  $ref: "#/components/schemas/cpsc_certificate"
              cpsc_disclaim:
                type: object
                x-nullable: true
                default: null
                description: CPSC disclaimer information for products that do not require a Certificate of Compliance, even though their HTS code is flagged as potentially subject to CPSC regulation. Use either `cpsc_certificates` or `cpsc_disclaim` per product, not both.
                required:
                  - disclaim_code
                  - intended_use_code
                properties:
                  disclaim_code:
                    type: string
                    enum:
                      - "A"
                      - "B"
                    description: >
                      The CPSC disclaimer code indicating why no certificate is required.
                      `A` - Product Not Regulated by CPSC: product falls outside CPSC jurisdiction (e.g., regulated by FDA), has no applicable CPSC safety standard, or is a B2B part for further assembly.
                      `B` - Enforcement Discretion: product falls under CPSC jurisdiction and a rule technically applies, but CPSC is exercising enforcement discretion and does not require a certificate.
                    example: "B"
                  intended_use_code:
                    type: string
                    maxLength: 16
                    description: >
                      A code from CBP's Intended Use Code list indicating why the product is exempt.
                      Required for every Disclaim filing. For Disclaim B, must be `130.006`.
                      For Disclaim A, valid base codes are: `081.XXX` (Medical Device), `090.XXX` (Military Use),
                      `100.XXX` (Personal Use), `130.XXX` (Consumer Use), `155.XXX` (Commercial Assembly),
                      `970.XXX` (Export), `980.000` (Other Use - `intended_use_description` recommended).
                    example: "130.006"
                  intended_use_description:
                    type: string
                    x-nullable: true
                    default: null
                    maxLength: 100
                    description: >
                      A plain-language description of the product's intended use. Max 100 characters.
                      Recommended by CPSC when `intended_use_code` is `980.000` (Other Use).
                    example: ""
    label_messages:
      title: label_messages
      type: object
      description: |
        Custom messages to print on the shipping label for the package.  These are typically used to print invoice numbers, product numbers, or other internal reference numbers.  Not all carriers support label messages. The number of lines and the maximum length of each line also varies by carrier.

        |Carrier            |Max lines |Max line length
        |-------------------|----------|--------------------
        |USPS (Stamps.com)  |3         |60
        |FedEx              |3         |35 for the first line. 30 for additional lines.
        |UPS                |2         |35
        |OnTrac             |2         |25

      required:
        - reference1
        - reference2
        - reference3

      additionalProperties: false

      properties:
        reference1:
          type: string
          x-nullable: true
          default: null
          description: |
            The first line of the custom label message.  Some carriers may prefix this line with something like "REF", "Reference", "Trx Ref No.", etc.
          example: "Reference"

        reference2:
          type: string
          x-nullable: true
          default: null
          description: |
            The second line of the custom label message.  Some carriers may prefix this line with something like "INV", "Reference 2", "Trx Ref No.", etc.
          example: "Reference 2"

        reference3:
          type: string
          x-nullable: true
          default: null
          description: |
            The third line of the custom label message.  Some carriers may prefix this line with something like "PO", "Reference 3", etc.
          example: "Reference 3"
    weight:
      title: weight
      type: object

      description: The weight of a package

      required:
        - value
        - unit

      additionalProperties: false

      properties:
        value:
          type: number
          exclusiveMinimum: 0
          example: 23
          description: The weight, in the specified unit

        unit:
          allOf:
            - $ref: "#/components/schemas/weight_unit"
          description: Weight unit
    dangerous_goods:
      title: dangerous_goods
      type: object

      description: |
        Dangerous goods attribute associated with the product

      additionalProperties: false

      properties:
        id_number:
          type: string
          x-nullable: true
          default: null
          description: UN number to identify the dangerous goods.
          example: "1234r1"

        shipping_name:
          type: string
          x-nullable: true
          default: null
          description: Trade description of the dangerous goods.
          example: "things with dangerous goods"

        technical_name:
          type: string
          x-nullable: true
          default: null
          description: Recognized Technical or chemical name of dangerous goods.
          example: "chloric acid"

        product_class:
          type: string
          x-nullable: true
          default: null
          description: Dangerous goods product class based on regulation.
          example: "1987"

        product_class_subsidiary:
          type: string
          x-nullable: true
          default: null
          description: A secondary of product class for substances presenting more than one particular hazard
          example: "1987"

        packaging_group:
          title: packaging_group
          type: string
          enum:
            - i
            - ii
            - iii
          example: "ii"

        dangerous_amount:
          allOf:
            - $ref: "#/components/schemas/dangerous_amount"
          description: This model represents the amount of the dangerous goods.

        quantity:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Quantity of dangerous goods.
          example: 1

        packaging_instruction:
          type: string
          x-nullable: true
          default: null
          description: The specific standardized packaging instructions from the relevant regulatory agency that have been applied to the parcel/container.
          example: "Packaging materials and containers that are in contact with food products must comply with the provisions established by Regulation "

        packaging_instruction_section:
          title: packaging_instruction_section
          type: string
          enum:
            - section_1
            - section_2
            - section_1a
            - section_1b
          example: "section_1"

        packaging_type:
          type: string
          x-nullable: true
          default: null
          description: The type of exterior packaging used to contain the dangerous good.
          example: "X"

        transport_mean:
          title: transport_mean
          type: string
          enum:
            - ground
            - water
            - cargo_aircraft_only
            - passenger_aircraft
          example: "ground"

        transport_category:
          type: string
          x-nullable: true
          default: null
          description: Transport category assign to dangerous goods for the transport purpose.
          example: "6.1"

        regulation_authority:
          type: string
          x-nullable: true
          default: null
          description: Name of the regulatory authority.
          example: "AEAT"

        regulation_level:
          title: regulation_level
          type: string
          enum:
            - lightly_regulated
            - fully_regulated
            - limited_quantities
            - excepted_quantity
          example: "excepted_quantity"

        radioactive:
          type: boolean
          x-nullable: true
          example: false
          description: Indication if the substance is radioactive.

        reportable_quantity:
          type: boolean
          x-nullable: true
          example: false
          description: Indication if the substance needs to be reported to regulatory authority based on the quantity.

        tunnel_code:
          type: string
          x-nullable: true
          default: null
          description: Defines which types of tunnels the shipment is allowed to go through
          example: "all"

        additional_description:
          type: string
          x-nullable: true
          default: null
          description: Provider additonal description regarding the dangerous goods. This is used as a placed holder to provider additional context and varies by carrier
          example: "any description"
    dangerous_amount:
      title: dangerous_amount
      type: object
      description: This model represents the amount of the dangerous goods..
      additionalProperties: false
      properties:
        amount:
          type: number
          minimum: 0
          default: 0
          description: The amount of dangerous goods.
          example: 12
        unit:
          type: string
          x-nullable: true
          default: null
          description: The unit of dangerous goods.
          example: "GBP"
    paperless_download:
      title: paperless_download
      type: object

      description: |
        The paperless details which may contain elements like `href`, `instructions` and `handoff_code`.

      additionalProperties: false

      properties:
        href:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL of the linked resource, if any

        instructions:
          type: string
          x-nullable: true
          default: null
          description: |
            The instructions for the paperless download.
          example: "any instructions"

        handoff_code:
          type: string
          x-nullable: true
          default: null
          example: "122334"
          description: |
            The handoff code for the paperless download.
    label_download:
      title: label_download
      type: object
      description: |
        Reference to the various downloadable file formats for the generated label

      additionalProperties: false
      properties:
        href:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL of the linked resource, if any
        pdf:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL for the pdf generated label
        png:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL for the png generated label
        zpl:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL for the zpl generated label
    advanced_shipment_options:
      title: advanced_shipment_options
      type: object

      description: Advanced shipment options

      additionalProperties: false

      properties:
        bill_to_account:
          type: string
          x-nullable: true
          default: null
          description: |
            This field is used to [bill shipping costs to a third party].  This field must be used in conjunction with the `bill_to_country_code`, `bill_to_party`, and `bill_to_postal_code` fields.
          example: "123456789"

        bill_to_country_code:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/country_code"
          description: |
            The two-letter [ISO 3166-1 country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the third-party that is responsible for shipping costs.
          example: "US"

        bill_to_party:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/bill_to_party"
          description: |
            Indicates whether to bill shipping costs to the recipient or to a third-party.  When billing to a third-party, the `bill_to_account`, `bill_to_country_code`, and `bill_to_postal_code` fields must also be set.
          example: "third_party"

        bill_to_postal_code:
          type: string
          x-nullable: true
          default: null
          description: |
            The postal code of the third-party that is responsible for shipping costs.
          example: "28005"

        contains_alcohol:
          type: boolean
          default: false
          description: Indicates that the shipment contains alcohol.
          example: true

        delivered_duty_paid:
          type: boolean
          default: false
          description: |
            Indicates that the shipper is paying the international delivery duties for this shipment.  This option is supported by UPS, FedEx, and DHL Express.
          example: true

        dry_ice:
          type: boolean
          default: false
          description: Indicates if the shipment contain dry ice
          example: true

        dry_ice_weight:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/weight"
          description: The weight of the dry ice in the shipment

        non_machinable:
          type: boolean
          default: false
          description: |
            Indicates that the package cannot be processed automatically because it is too large or irregularly shaped. This is primarily for USPS shipments.  See [Section 1.2 of the USPS parcel standards](https://pe.usps.com/text/dmm300/101.htm#ep1047495) for details.
          example: true

        saturday_delivery:
          type: boolean
          default: false
          description: Enables Saturday delivery, if supported by the carrier.
          example: true

        fedex_freight:
          type: object
          description: Provide details for the Fedex freight service
          properties:
            shipper_load_and_count:
              type: string
              example: "shipper_load_and_count"
            booking_confirmation:
              type: string
              example: "today"

        use_ups_ground_freight_pricing:
          type: boolean
          x-nullable: true
          default: null
          description: |
            Whether to use [UPS Ground Freight pricing] If enabled, then a `freight_class` must also be specified.
          example: true

        freight_class:
          type: string
          x-nullable: true
          default: null
          example: "77.5"
          description: |
            The National Motor Freight Traffic Association [freight class](http://www.nmfta.org/pages/nmfc?AspxAutoDetectCookieSupport=1), such as "77.5", "110", or "250".

        custom_field1:
          type: string
          x-nullable: true
          default: null
          maxLength: 100
          description: |
            An arbitrary field that can be used to store information about the shipment.
          example: "custom field 1"

        custom_field2:
          type: string
          x-nullable: true
          default: null
          maxLength: 100
          description: |
            An arbitrary field that can be used to store information about the shipment.
          example: "custom field 2"

        custom_field3:
          type: string
          x-nullable: true
          default: null
          maxLength: 100
          description: |
            An arbitrary field that can be used to store information about the shipment.
          example: "custom field 3"

        origin_type:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/origin_type"

        additional_handling:
          type: boolean
          x-nullable: true
          default: null
          description: |
            Indicate to the carrier that this shipment requires additional handling.
          example: true

        shipper_release:
          type: boolean
          x-nullable: true
          default: null
          example: true

        collect_on_delivery:
          title: collect_on_delivery
          type: object
          description: Defer payment until package is delivered, instead of when it is ordered.
          properties:
            payment_type:
              allOf:
                - $ref: "#/components/schemas/collect_on_delivery_payment_type"
            payment_amount:
              title: payment_amount
              type: object
              properties:
                currency:
                  allOf:
                    - $ref: "#/components/schemas/currency"
                  example: "USD"
                amount:
                  minimum: 0
                  type: number
                  example: 12

        third_party_consignee:
          type: boolean
          default: false
          description: Third Party Consignee option is a value-added service that allows the shipper to supply goods without commercial invoices being attached
          example: true
        dangerous_goods:
          type: boolean
          default: false
          description: Indicates if the Dangerous goods are present in the shipment
          example: true
        dangerous_goods_contact:
          type: object
          description: Contact information for Dangerous goods
          properties:
            name:
              type: string
              description: Name of the contact
              example: "Michael Robinson"
            phone:
              type: string
              description: Phone number of the contact
              example: "123456578789"
        movement_indicator:
          type: string
          x-nullable: true
          default: null
          description: >-
            An indicator that will tell the carrier the type of
            movement for the shipment.
          example: b2b
          enum:
            - c2c
            - b2c
            - c2b
            - b2b
        windsor_framework_details:
          type: object
          description: The Windsor framework is a new regulation in the UK that simplifies customs procedures for goods moved from the UK mainland to Northern Ireland.
          properties:
            movement_indicator:
              type: string
              deprecated: true
              description: An indicator that will tell the carrier and HMRC the type of movement for the shipment.
              enum:
                - c2c
                - b2c
                - c2b
                - b2b
              example: "b2b"
            not_at_risk:
              type: boolean
              description: An indicator that allows a shipper to declare the shipment as not-at-risk.
              example: true
        ancillary_endorsements_option:
          type: string
          x-nullable: true
          description: Ancillary endorsements option for the shipment
          example: "forward"
        return_pickup_attempts:
          type: integer
          x-nullable: true
          description: Number of return pickup attempts
          example: 3
        own_document_upload:
          type: boolean
          default: false
          description: Indicates if own document upload is enabled
          example: false
        limited_quantity:
          type: boolean
          default: false
          description: Indicates if the shipment contains limited quantities
          example: false
        event_notification:
          type: boolean
          default: false
          description: Indicates if event notifications are enabled
          example: false
        fragile:
          type: boolean
          default: false
          description: Indicates if the shipment contains fragile items
          example: false
        delivery_as_addressed:
          type: boolean
          default: false
          description: Instructs the carrier to deliver the package only to the exact address provided
          example: false
        return_after_first_attempt:
          type: boolean
          default: false
          description: Ensures the shipment is immediately flagged for return to the sender if the initial delivery attempt fails
          example: false
        regulated_content_type:
          x-nullable: true
          default: null
          allOf:
            - $ref: "#/components/schemas/regulated_content_type"
          description: Indicates the category of goods in the shipment that is subject to special regulatory or compliance requirements
        netstamps_options:
          type: object
          description: Layout options for printing NetStamps labels on a sheet. Controls the starting position on the label sheet.
          properties:
            row:
              type: integer
              format: int32
              description: The row on the sheet where label is placed.
              example: 1
            column:
              type: integer
              format: int32
              description: The column on the sheet where label is placed.
              example: 1
        suppress_carrier_generated_documents:
          type: array
          description: |
            A list of carrier-generated documents to suppress for the shipment.

            > **Note:** Currently, only `commercial_invoice` is supported (UPS only).
          items:
            type: string
            enum:
              - commercial_invoice
          example:
            - commercial_invoice
        transparency_codes:
          type: array
          description: |
            Amazon Transparency Codes for verifying product authenticity. Each entry maps transparency codes to the corresponding order item ID, which must match the value in `shipment.items[].external_order_item_id`.
          items:
            type: object
            properties:
              order_item_id:
                type: string
                description: The order item ID from Amazon, matching the `external_order_item_id` in the shipment items.
                example: "12345678901234"
              codes:
                type: array
                description: Array of Amazon Transparency codes for this order item.
                items:
                  type: string
                  example: "AZ:XXXXXXXXXXXX"
            required:
              - order_item_id
              - codes
    international_shipment_options:
      title: international_shipment_options
      type: object

      description: Options for international shipments, such as customs declarations.

      required:
        - contents
        - non_delivery

      additionalProperties: false

      example:
        terms_of_trade_code: ddp
        contents: gift
        non_delivery: return_to_sender

      properties:
        contents:
          default: merchandise
          allOf:
            - $ref: "#/components/schemas/package_contents"
          description: The type of contents in this shipment.  This may impact import duties or customs treatment.

        contents_explanation:
          type: string
          description: Explanation for contents (required if the `contents` is provided as `other`)
          example: "rubber duckies"

        non_delivery:
          default: return_to_sender
          allOf:
            - $ref: "#/components/schemas/non_delivery"
          description: Indicates what to do if a package is unable to be delivered.

        terms_of_trade_code:
          type: string
          description: Specifies the supported terms of trade code (incoterms)
          allOf:
            - $ref: "#/components/schemas/terms_of_trade_code"

        declaration:
          type: string
          description: Declaration statement to be placed on the commercial invoice
          example: "I hereby certify that the information on this invoice is true and correct and that the contents and value of this shipment are as stated above"

        pending_documents:
          type: boolean
          default: false
          description: >
            Set to `true` to indicate the shipment requires customs documents to
            be uploaded via Carrier Document Upload. See the [Carrier Document
            Upload guide](/upload-carrier-documents).
          example: true

        invoice_additional_details:
          type: object
          allOf:
            - $ref: "#/components/schemas/invoice_additional_details"

        importer_of_record:
          type: object
          allOf:
            - $ref: "#/components/schemas/importer_of_records"

        customs_items:
          deprecated: true
          type: array
          default: []
          minItems: 0
          description: Customs declarations for each item in the shipment. (Please provide this information under `products` inside `packages`)
          items:
            title: customs_item
            type: object

            description: The customs declaration for a single item in the shipment.

            required:
              - customs_item_id

            additionalProperties: false

            properties:
              customs_item_id:
                readOnly: true
                allOf:
                  - $ref: "#/components/schemas/se_id"
                description: A string that uniquely identifies the customs item

              description:
                type: string
                x-nullable: true
                maxLength: 100
                default: null
                description: A description of the item
                example: "This is a description"

              quantity:
                type: integer
                format: int32
                minimum: 0
                default: 0
                description: The quantity of this item in the shipment.
                example: 1

              value:
                type: number
                minimum: 0
                description: The monetary amount, in the specified currency.
                example: 12

              value_currency:
                type: string
                description: |
                  The currencies that are supported by ShipStation are the ones that specified by ISO 4217: https://www.iso.org/iso-4217-currency-codes.html
                example: "USD"

              weight:
                allOf:
                  - $ref: "#/components/schemas/weight"
                description: The item weight

              harmonized_tariff_code:
                type: string
                x-nullable: true
                default: null
                example: "3926.10"
                description: The [Harmonized Tariff Code](https://en.wikipedia.org/wiki/Harmonized_System) of this item.

              country_of_origin:
                x-nullable: true
                default: null
                allOf:
                  - $ref: "#/components/schemas/country_code"
                description: |
                  The two-letter [ISO 3166-1 country code](https://en.wikipedia.org/wiki/ISO_3166-1) where this item originated
                example: "GB"

              unit_of_measure:
                type: string
                x-nullable: true
                example: "pound"

              sku:
                type: string
                description: The SKU (Stock Keeping Unit) of the customs item
                x-nullable: true
                example: "sku-1234"

              sku_description:
                type: string
                description: Description of the Custom Item's SKU
                x-nullable: true
                example: "this is a description"
    importer_of_records:
      title: importer_of_records
      type: object

      description: |
        importer of records address, anywhere in the world.

      required:
        - name
        - address_line1
        - city_locality
        - postal_code
        - country_code

      properties:
        name:
          type: string
          minLength: 1
          example: John Doe
          description: |
            The name of a contact person at this address. Either `name` or the `company_name` field should always be set.

        phone:
          type: string
          minLength: 1
          example: +1 204-253-9411 ext. 123
          description: |
            The phone number of a contact person at this address.  The format of this phone number varies depending on the country.

        email:
          type: string
          x-nullable: true
          example: example@example.com
          description: |
            Email for the address owner.

        company_name:
          type: string
          minLength: 1
          x-nullable: true
          example: The Home Depot
          description: |
            If this is a business address, then the company name should be specified here. Either `name` or the `company_name` field should always be set.

        address_line1:
          type: string
          minLength: 1
          example: 1999 Bishop Grandin Blvd.
          description: |
            The first line of the street address.  For some addresses, this may be the only line.  Other addresses may require 2 or 3 lines.

        address_line2:
          type: string
          minLength: 1
          x-nullable: true
          example: Unit 408
          description: |
            The second line of the street address.  For some addresses, this line may not be needed.

        address_line3:
          type: string
          minLength: 1
          x-nullable: true
          example: "Building #7"
          description: |
            The third line of the street address.  For some addresses, this line may not be needed.

        city_locality:
          type: string
          minLength: 1
          example: Winnipeg
          description: The name of the city or locality

        state_province:
          type: string
          minLength: 1
          example: Manitoba
          description: |
            The state or province.  For some countries (including the U.S.) only abbreviations are allowed.  Other countries allow the full name or abbreviation.

        postal_code:
          allOf:
            - $ref: "#/components/schemas/postal_code"

        country_code:
          allOf:
            - $ref: "#/components/schemas/country_code"
          description: |
            The two-letter [ISO 3166-1 country code](https://en.wikipedia.org/wiki/ISO_3166-1)
    invoice_additional_details:
      title: invoice_additional_details
      type: object

      description: |
        The additional information to put on commercial invoice

      properties:
        freight_charge:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Freight Charge for shipment.

        insurance_charge:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Insurance Charge for shipment.

        discount:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Discount for shipment.

        estimated_import_charges:
          allOf:
            - $ref: "#/components/schemas/estimated_import_charges"
          description: Estimated import charges for commercial invoices for international shipments.

        other_charge:
          allOf:
            - $ref: "#/components/schemas/monetary_value"
          description: Other charge for shipment.

        other_charge_description:
          type: string
          description: Description for the other charge (if provided).
          example: "Other charges description"
    shipping_address_to:
      title: shipping_address_to
      type: object

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/address"
        - $ref: "#/components/schemas/partial_shipping_address_to"
    partial_shipping_address_to:
      title: partial_shipping_address_to
      type: object
      description: A complete or partial mailing address.
      additionalProperties: false
      properties:
        instructions:
          type: string
          minLength: 1
          x-nullable: true
          description: |
            Additional text about how to handle the shipment at this address.
          example: "any instruction"
        geolocation:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: what3words
                description: |
                  Enum of available type of geolocation items:
                    - 'what3words' functionality allows to specify a location by providing 3 words that have been assigned to the specific location. See [link](https://what3words.com/business) for more details.
                enum: [what3words]
              value:
                type: string
                example: cats.with.thumbs
                description: value of the geolocation item
    tax_identifier:
      title: tax_identifier
      type: object

      description: A tax identifier object

      additionalProperties: false

      required:
        - taxable_entity_type
        - identifier_type
        - issuing_authority
        - value

      properties:
        taxable_entity_type:
          allOf:
            - $ref: "#/components/schemas/taxable_entity_type"
        identifier_type:
          allOf:
            - $ref: "#/components/schemas/identifier_type"
        issuing_authority:
          type: string
          description: The authority that issued this tax. This must be a valid 2 character ISO 3166 Alpha 2 country code.
          example: "US"
        value:
          type: string
          description: The value of the identifier
          example: "value"
    shipment_item:
      title: shipment_item
      type: object

      description: A shipment item

      additionalProperties: false

      properties:
        name:
          type: string
          minLength: 0
          description: item name
          example: "box"
        sales_order_id:
          type: string
          x-nullable: true
          description: sales order id
          example: "12345"
        sales_order_item_id:
          type: string
          x-nullable: true
          description: sales order item id
          example: "1234556"
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: The quantity of this item included in the shipment
          example: 1
        sku:
          type: string
          x-nullable: true
          description: Item Stock Keeping Unit
          example: "sku-1234"
        bundle_sku:
          type: string
          x-nullable: true
          description: Bundle SKU for the item
          example: "bundle-123"
        external_order_id:
          type: string
          x-nullable: true
          description: external order id
          example: "123445"
        external_order_item_id:
          type: string
          x-nullable: true
          description: external order item id
          example: "12"
        asin:
          type: string
          x-nullable: true
          minLength: 10
          maxLength: 10
          example: B00005N5PF
          description: Amazon Standard Identification Number
        order_source_code:
          allOf:
            - $ref: "#/components/schemas/order_source_name"
        item_id:
          type: string
          x-nullable: true
          description: Unique identifier for the item
          example: "1402291169813"
        allocation_status:
          type: string
          x-nullable: true
          description: Allocation status of the item
          example: "allocated"
        image_url:
          type: string
          x-nullable: true
          format: uri
          description: URL to the item image
          example: "https://example.com/image.jpg"
        weight:
          allOf:
            - $ref: "#/components/schemas/weight"
          description: Weight of the individual item
        unit_price:
          type: number
          x-nullable: true
          minimum: 0
          description: Unit price of the item
          example: 88.00
        tax_amount:
          type: number
          x-nullable: true
          minimum: 0
          description: Tax amount for the item
          example: 5.50
        shipping_amount:
          type: number
          x-nullable: true
          minimum: 0
          description: Shipping amount for the item
          example: 10.00
        inventory_location:
          type: string
          x-nullable: true
          description: Inventory location of the item
          example: "warehouse-a"
        options:
          type: array
          default: []
          items:
            type: object
            properties:
              name:
                type: string
                description: Option name
                example: "Color"
              value:
                type: string
                description: Option value
                example: "Red"
          description: Item options/variants
        product_id:
          type: string
          x-nullable: true
          description: Product ID
          example: "10408926"
        fullfilment_sku:
          type: string
          x-nullable: true
          description: Fulfillment SKU
          example: "fulfill-123"
        upc:
          type: string
          x-nullable: true
          description: Universal Product Code
          example: "123456789012"
    manifest_download:
      title: manifest_download
      type: object
      description: Object containing the href link to download the manifest file

      additionalProperties: false

      properties:
        href:
          allOf:
            - $ref: "#/components/schemas/url"
          description: The URL of the linked resource, if any
    carrier:
      title: carrier
      type: object

      description: |
        A carrier object that represents a provider such as UPS, USPS, DHL, etc
        that has been tied to the current account.

      additionalProperties: false

      properties:
        carrier_id:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the carrier.
          example: "se-8412"

        carrier_code:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/carrier_code"
          description: |
            The [shipping carrier] who will ship the package, such as `fedex`, `dhl_express`, `stamps_com`, etc.

        account_number:
          type: string
          readOnly: true
          minLength: 1
          example: account_570827
          description: The account number that the carrier is connected to.

        connection_status:
          type: string
          readOnly: true
          x-nullable: true
          enum:
            - pending_approval
            - approved
          description: The connection status of the carrier account. Indicates whether the carrier connection is pending approval or has been approved. This only applies to certain carriers; it can be undefined.
          example: approved

        requires_funded_amount:
          type: boolean
          readOnly: true
          description: Indicates whether the carrier requires funding to use its services
          example: true

        balance:
          type: number
          readOnly: true
          example: 3799.52
          minimum: 0
          description: Current available balance

        nickname:
          type: string
          readOnly: true
          minLength: 1
          example: ShipStation Account - Stamps.com
          description: Nickname given to the account when initially setting up the carrier.

        friendly_name:
          type: string
          readOnly: true
          minLength: 1
          example: Stamps.com
          description: Screen readable name

        funding_source_id:
          readOnly: true
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: Funding source ID for the carrier

        primary:
          type: boolean
          readOnly: true
          example: true
          description: Is this the primary carrier that is used by default when no carrier is specified in label/shipment creation

        has_multi_package_supporting_services:
          type: boolean
          readOnly: true
          example: true
          description: Carrier supports multiple packages per shipment

        supports_label_messages:
          type: boolean
          readOnly: true
          example: true
          description: The carrier supports adding custom label messages to an order.

        disabled_by_billing_plan:
          type: boolean
          readOnly: true
          example: true
          description: The carrier is disabled by the current ShipStation account's billing plan.

        services:
          type: array
          readOnly: true
          items:
            readOnly: true
            allOf:
              - $ref: "#/components/schemas/service"
          description: A list of services that are offered by the carrier

        packages:
          type: array
          readOnly: true
          items:
            readOnly: true
            allOf:
              - $ref: "#/components/schemas/package_type"
          description: A list of package types that are supported by the carrier

        options:
          type: array
          readOnly: true
          items:
            readOnly: true
            allOf:
              - $ref: "#/components/schemas/carrier_advanced_option"
          description: A list of options that are available to that carrier

        send_rates:
          type: boolean
          readOnly: true
          description: The carrier provides rates for the shipment.
          example: true

        supports_user_managed_rates:
          type: boolean
          readOnly: true
          description: The carrier supports user-managed rates for shipments.
          example: true
    carrier_advanced_option:
      title: carrier_advanced_option
      type: object

      description: Advanced options that are specific to the carrier

      additionalProperties: false

      properties:
        name:
          type: string
          minLength: 1
          readOnly: true
          example: contains_alcohol
          description: Name of advanced option

        default_value:
          type: string
          minLength: 1
          readOnly: true
          example: "false"
          description: Default value of option

        description:
          type: string
          minLength: 0
          readOnly: true
          example: "The description"
          description: Description of option
    paged_list_response_body:
      title: paged_list_response_body
      type: object

      required:
        - total
        - page
        - pages
        - links

      additionalProperties: true

      properties:
        total:
          type: integer
          minimum: 0
          example: 2750
          description: The total number of items across all pages of results

        page:
          type: integer
          minimum: 1
          example: 1
          description: The current page number of results.  For example, if there are 80 results, and the page size is 25, then `page` could be 1, 2, 3, or 4.  The first three pages would contain 25 items each, and the fourth page would contain the five remaining items.

        pages:
          type: integer
          minimum: 0
          example: 4
          description: The total number of pages of results.  For example, if there are 80 results, and the page size is 25, then `pages` would be 4.  The first three pages would contain 25 items each, and the fourth page would contain the five remaining items.  If there are no results, then `pages` will be zero.

        links:
          allOf:
            - $ref: "#/components/schemas/pagination_link"

      description: |
        Many ShipStation endpoints return a paged list of items.  In addition to the returned items, these responses also include information about the total number of items, the number of pages of results, and URLs of other pages of results.
    tracking_information:
      title: tracking_information
