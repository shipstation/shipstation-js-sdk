      type: object
      description: >-
        A get service points request body. Caller must provide exactly one of
        address_query, address, or lat / long pair.
      required:
        - providers
      properties:
        address_query:
          type: string
          description: Unstructured text to search for service points by.
          example: 177A Bleecker Street New York
        address:
          type: object
          description: Structured address to search by.
          required:
            - country_code
          properties:
            address_line1:
              type: string
              example: 1999 Bishop Grandin Blvd.
              description: >-
                The first line of the street address. For some addresses, this
                may be the only line. Other addresses may require 2 or 3 lines.
            address_line2:
              type: string
              example: Unit 408
            address_line3:
              type: string
              example: "Building #7"
            city_locality:
              type: string
              example: Winnipeg
              description: The name of the city or locality
            state_province:
              type: string
              example: Manitoba
              description: >-
                The state or province. For some countries (including the U.S.)
                only abbreviations are allowed. Other countries allow the full
                name or abbreviation.
            postal_code:
              allOf:
                - $ref: "#/components/schemas/postal_code"
            country_code:
              allOf:
                - $ref: "#/components/schemas/country_code"
        providers:
          type: array
          description: An array of shipping service providers and service codes
          items:
            type: object
            properties:
              carrier_id:
                type: string
                example: se-123456
                description: Uniquely identifies a carrier connection
              service_code:
                type: array
                items:
                  type: string
                  example: chronoclassic
                  description: Uniquely identifies a shipping service
        lat:
          format: double
          type: number
          example: 48.874518928233094
          description: >-
            The latitude of the point. Represented as signed degrees. Required
            if long is provided. http://www.geomidpoint.com/latlon.html
        long:
          format: double
          type: number
          example: 2.3591775711639404
          description: >-
            The longitude of the point. Represented as signed degrees. Required
            if lat is provided. http://www.geomidpoint.com/latlon.html
        radius:
          format: int32
          type: integer
          example: 500
          description: Search radius in kilometers
        max_results:
          format: int32
          type: integer
          example: 25
          description: The maximum number of service points to return
        shipment:
          type: object
          description: Shipment information to be used for service point selection
          properties:
            total_weight:
              allOf:
