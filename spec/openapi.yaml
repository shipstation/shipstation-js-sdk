      description: |
        A rate estimate request for a single carrier. Cannot be combined with `carrier_ids`.

      allOf:
        - $ref: "#/components/schemas/rate_estimate_options"
        - $ref: "#/components/schemas/rate_estimate_by_carrier_id"
    estimate_rates_by_carrier_ids:
      title: estimate_rates_by_carrier_ids

      description: |
        A rate estimate request for one or more carriers. Cannot be combined with `carrier_id`.

      allOf:
        - $ref: "#/components/schemas/rate_estimate_options"
        - $ref: "#/components/schemas/rate_estimate_by_carrier_ids"
    estimate_rates_request_body:
      title: estimate_rates_request_body

      description: |
        A rate estimate request body. Provide either `carrier_ids` or the deprecated
        `carrier_id`, but not both.

      oneOf:
        - $ref: "#/components/schemas/estimate_rates_by_carrier_ids"
        - $ref: "#/components/schemas/estimate_rates_by_carrier_id"
    rate_request_by_shipment_id:
      title: rate_request_by_shipment_id
      type: object

      description: Identifies an existing shipment to rate

      additionalProperties: false

      required:
        - shipment_id

      properties:
        shipment_id:
          allOf:
            - $ref: "#/components/schemas/se_id"
          description: A string that uniquely identifies the shipment
    rate_request_by_shipment:
      title: rate_request_by_shipment
      type: object

      description: The shipment to rate

      additionalProperties: false

      required:
        - shipment

      properties:
        shipment:
          allOf:
            - $ref: "#/components/schemas/address_validating_shipment"
          description: The shipment object
    calculate_rates_by_shipment_id:
      title: calculate_rates_by_shipment_id

      description: |
        A rate request for an existing shipment. Cannot be combined with `shipment`.

      required:
        - rate_options

      allOf:
        - $ref: "#/components/schemas/rate_request_rate_options"
        - $ref: "#/components/schemas/rate_request_by_shipment_id"
    calculate_rates_by_shipment:
      title: calculate_rates_by_shipment

      description: |
        A rate request for an inline shipment. Cannot be combined with `shipment_id`.

      required:
        - rate_options

      allOf:
        - $ref: "#/components/schemas/rate_request_rate_options"
        - $ref: "#/components/schemas/rate_request_by_shipment"
    calculate_rates_request_body:
      title: calculate_rates_request_body

      description: |
        A rate shipment request body. Provide either `shipment_id` or `shipment`, but not both.

      oneOf:
        - $ref: "#/components/schemas/calculate_rates_by_shipment_id"
        - $ref: "#/components/schemas/calculate_rates_by_shipment"
    schedule_pickup_request_body:
      title: schedule_pickup_request_body
      type: object

      description: A schedule pickup request body

      required:
        - contact_details
        - label_ids
        - pickup_window

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/pickup"
    update_package_type_request_body:
      title: update_package_type_request_body
      type: object

      description: An update package type request body

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/package_type"
    create_package_type_request_body:
      title: create_package_type_request_body
      type: object

      description: A create package type request body

      additionalProperties: false

      allOf:
        - $ref: "#/components/schemas/package_type"
    create_return_label_request_body:
      title: create_return_label_request_body
      type: object

      description: A create return label request body

      additionalProperties: false

      properties:
        charge_event:
          allOf:
            - $ref: "#/components/schemas/label_charge_event"
          description: |
            The label charge event.

        label_layout:
          default: 4x6
          allOf:
            - $ref: "#/components/schemas/label_layout"
          description: |
            The layout (size) that you want the label to be in.  The `label_format` determines which sizes are allowed.  `4x6` is supported for all label formats, whereas `letter` (8.5" x 11") is only supported for `pdf` format.

        label_format:
          default: pdf
          allOf:
            - $ref: "#/components/schemas/label_format"
          description: |
            The file format that you want the label to be in.  We recommend `pdf` format because it is supported by all carriers, whereas some carriers do not support the `png` or `zpl` formats.

        label_download_type:
          writeOnly: true
          default: url
          allOf:
            - $ref: "#/components/schemas/label_download_type"

        display_scheme:
          default: label
          allOf:
            - $ref: "#/components/schemas/display_scheme"
          description: The display format that the label should be shown in.

        label_image_id:
          x-nullable: true
          allOf:
            - $ref: "#/components/schemas/image_id"
          description: The label image resource that was used to create a custom label image.
    create_label_from_shipment_request_body:
