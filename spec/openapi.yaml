  /v2/products/create:
    x-visibility: public
    summary: Create products
    description: |
      Create one or more products in your ShipStation account.
    post:
      operationId: createProducts
      summary: Create products
      tags:
        - products
      x-plan:
        - ss-standard_and_premium_plans
        - ss-api-advanced_and_enterprise_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products
              properties:
                products:
                  type: array
                  description: Array of products to create
                  items:
                    type: object
                    required:
                      - sku
                      - name
                    properties:
                      sku:
                        type: string
                        description: Stock Keeping Unit identifier. Must be unique within your account.
                        example: "K1"
                      name:
                        type: string
                        description: Product name
                        example: "Test Product"
                      upc:
                        type: [string, "null"]
                        description: Universal Product Code
                        example: "123-4"
                      thumbnail_url:
                        type: [string, "null"]
                        description: URL to product thumbnail image
                        example: "www.image.com"
                      price:
                        type: object
                        properties:
                          currency:
                            type: string
                            description: Currency code
                            example: "usd"
                          amount:
                            type: number
                            description: Price amount
                            example: 88.00
                      dimensions:
                        type: object
                        properties:
                          unit:
                            type: string
                            description: Unit of measurement
                            example: "inch"
                          length:
                            type: number
                            description: Length dimension
                            example: 9.00
                          width:
                            type: number
                            description: Width dimension
                            example: 5.00
                          height:
                            type: number
                            description: Height dimension
                            example: 7.00
                      weight:
                        type: object
                        properties:
                          value:
                            type: number
                            description: Weight value
                            example: 99.20
                          unit:
                            type: string
                            description: Weight unit
                            example: "ounce"
                      internal_notes:
                        type: [string, "null"]
                        description: Internal notes about the product
                        example: "Describe your item"
                      fulfillment_sku:
                        type: [string, "null"]
                        description: Fulfillment SKU
                        example: "widget-2"
                      active:
                        type: boolean
                        description: Whether the product is active
                        example: true
                      product_category:
                        type: [object, "null"]
                        properties:
                          product_category_id:
                            type: integer
                            example: 26663
                          name:
                            type: string
                            example: "Example-category"
                      preset_group:
                        type: [string, "null"]
                        description: Preset group
                        example: "Default"
                      warehouse_location:
                        type: [string, "null"]
                        description: Warehouse location
                        example: "BIN 43-6"
                      default_carrier_code:
                        type: [string, "null"]
                        description: Default carrier code
                        example: "stamps_com"
                      default_service_code:
                        type: [string, "null"]
                        description: Default service code
                        example: "usps_first_class_mail"
                      default_package_code:
                        type: [string, "null"]
                        description: Default package code
                        example: "large_flat_rate_box"
                      default_intl_carrier_code:
                        type: [string, "null"]
                        description: Default international carrier code
                        example: "stamps_com"
                      default_intl_service_code:
                        type: [string, "null"]
                        description: Default international service code
                        example: "usps_priority_mail_international"
                      default_intl_package_code:
                        type: [string, "null"]
                        description: Default international package code
                        example: "package"
                      default_confirmation:
                        type: [string, "null"]
                        description: Default confirmation type
                        example: "none"
                      default_intl_confirmation:
                        type: [string, "null"]
                        description: Default international confirmation type
                        example: "delivery"
                      customs_description:
                        type: [string, "null"]
                        description: Customs description
                        example: "An object going internationally"
                      customs_value:
                        type: [number, "null"]
                        description: Customs value
                        example: 20.00
                      customs_tariff_no:
                        type: [string, "null"]
                        description: Customs tariff number
                        example: "0245.56.13"
                      customs_country_code:
                        type: [string, "null"]
                        description: Customs country code
                        example: "US"
                      no_customs:
                        type: [boolean, "null"]
                        description: Whether customs is required
                        example: null
                      tags:
                        type: [array, "null"]
                        description: Tags to assign. Only `tag_id` is used on write; `name` and `color` are response-only fields returned when reading a product.
                        items:
                          type: object
                          properties:
                            tag_id:
                              type: integer
                              example: 21121
                      aliases:
                        type: [array, "null"]
                        items:
                          type: object
                          properties:
                            store_id:
                              type: integer
                              example: 2095811
                            sku_alias:
                              type: string
                              example: "alt-sku"
                      is_returnable:
                        type: [boolean, "null"]
                        description: Whether the product is returnable
                        example: false
                      should_override_name:
                        type: [boolean, "null"]
                        description: Whether to override the product name
                        example: true
                      is_bundle:
                        type: [boolean, "null"]
                        description: Whether the product is a bundle
                        example: false
                      auto_split_option:
                        type: [string, "null"]
                        description: Auto split option
                        example: "do_not_split"
                      auto_split_custom_quantity:
                        type: [integer, "null"]
                        description: Auto split custom quantity when auto_split_option is set to custom_quantity
                        example: 3
      responses:
        "200":
          description: The products were created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  created_product_ids:
                    type: array
                    description: IDs of the newly created products
                    items:
                      type: integer
                    example: [10736794]
                  request_id:
                    type: string
                    description: Unique identifier for this request
                    example: "35e75c12-cb26-4d58-9fa1-b0047480acc1"
                  errors:
                    type: array
                    description: Any errors that occurred during creation
                    items:
                      type: object
                      properties:
                        error_source:
                          type: string
                          example: "shipstation"
                        error_type:
                          type: string
                          example: "validation"
                        error_code:
                          type: string
                          example: "field_value_required"
                        message:
                          type: string
                          example: "sku is required."
                        field_name:
                          type: string
                          example: "sku"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

