  /v2/addresses/validate:
    summary: Address validation
    description: >
      Address validation ensures accurate addresses and can lead to reduced
      shipping costs by preventing address correction surcharges.

      ShipStation API cross references multiple databases to validate addresses and
      identify potential deliverability issues.
    post:
      summary: Validate an address
      description: >
        Address validation ensures accurate addresses and can lead to reduced
        shipping costs by preventing address correction surcharges.

        ShipStation API cross references multiple databases to validate addresses and
        identify potential deliverability issues.
      tags:
        - addresses
      x-plan:
        - ss-api-advanced_and_enterprise_plans
      operationId: validate_address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/validate_address_request_body"
            examples:
              all_known_fields_request:
                summary: All known fields
                description: A call that returns a status of `verified`.
                value:
                  - name: Mickey and Minnie Mouse
                    phone: 714-781-4565
                    company_name: The Walt Disney Company
                    address_line1: 500 South Buena Vista Street
                    city_locality: Burbank
                    state_province: CA
                    postal_code: "91521"
                    country_code: US
      responses:
        "200":
          description: The request was a success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate_address_response_body"
              examples:
                all_known_fields:
                  summary: All known fields
                  description: A response for a `verified` status call.
                  value:
                    - status: verified
                      original_address:
                        name: Mickey and Minnie Mouse
                        phone: 714-781-4565
                        company_name: The Walt Disney Company
                        address_line1: 500 South Buena Vista Street
                        address_line2: null
                        address_line3: null
                        city_locality: Burbank
                        state_province: CA
                        postal_code: "91521"
                        country_code: US
                        address_residential_indicator: unknown
                      matched_address:
                        name: MICKEY AND MINNIE MOUSE
                        phone: 714-781-4565
                        company_name: THE WALT DISNEY COMPANY
                        address_line1: 500 S BUENA VISTA ST
                        address_line2: null
                        address_line3: null
                        city_locality: BURBANK
                        state_province: CA
                        postal_code: "91521-0007"
                        country_code: US
                        address_residential_indicator: "no"
                      messages: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /v2/checkout_rates:
    x-visibility: public
    summary: Checkout rates configurations
    description: |
      Create a checkout rates configuration or list the configurations on your account. A configuration groups the delivery options a buyer can choose from at checkout for a single storefront.

    post:
      operationId: create_checkout_rates_config
      summary: Create a checkout rates configuration
      description: |
        Create a checkout rates configuration together with its initial delivery options and shared settings. The configuration is returned with a generated `config_id` and, for each option, a generated `option_id`.

        For `live_rate` and `local_delivery` options, each service's `carrier_id` and `service_code` are validated and resolved against the carriers connected to your account.
      tags:
        - checkout_rates
      x-plan:
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
        - ss-standard_and_premium_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_checkout_rates_config_request_body"
            example:
              options:
                - name: Standard Shipping
                  type: live_rate
                  services:
                    - carrier_id: se-1234567
                      service_code: usps_priority_mail
                  fee_mode: add
                  fee_percentage: 10
                  fallback_mode: flat_rate
                  fallback_rate_amount: 5.00
                  fallback_rate_currency: USD
                - name: Free Shipping
                  type: free
                - name: Flat Rate Shipping
                  type: flat_rate
                  amount: 4.99
                  currency: USD
              shared_settings:
                calculation_method: by_volume
                dimensions_by_weight:
                  - max_weight:
                      value: 10
                      unit: pound
                    default_dimensions:
                      length: 12
                      width: 9
                      height: 6
                      unit: inch
      responses:
        "201":
          description: The checkout rates configuration was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkout_rates_config_response_body"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      operationId: list_checkout_rates_configs
      summary: List checkout rates configurations
      description: |
        Return a summary of every checkout rates configuration on your account. Each entry contains identifying fields only; use [Get a checkout rates configuration](#operation/get_checkout_rates_config) to retrieve an individual configuration's options and shared settings.
      tags:
        - checkout_rates
      x-plan:
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
        - ss-standard_and_premium_plans
      responses:
        "200":
          description: The list of checkout rates configurations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/list_checkout_rates_configs_response_body"
        "500":
          $ref: "#/components/responses/ServerError"

