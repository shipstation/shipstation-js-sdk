      required: true
      schema:
        $ref: "#/components/schemas/se_id"
      description: Shipment ID

    shipment_id_query_param:
      name: shipment_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/se_id"
      description: Shipment ID

    shipment_number_query_param:
