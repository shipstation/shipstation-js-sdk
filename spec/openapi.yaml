  /v2/checkout_rates/{config_id}/quotes:
    x-visibility: public
    summary: Checkout rate quotes
    parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        description: The unique identifier of the checkout rates configuration to quote against.
    post:
      operationId: calculate_checkout_rates
      summary: Calculate checkout rates
      description: |
        Calculate the shipping rates a buyer should see at checkout for the given destination and cart, using the delivery options defined on the configuration. The response contains one rate per delivery option that produced a price, and each rate carries its own `quote_id` that can be retrieved later with [Get a checkout rate quote](#operation/get_checkout_rates_quote).
      tags:
        - checkout_rates
      x-plan:
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
        - ss-standard_and_premium_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/calculate_checkout_rates_request_body"
            example:
              ship_to:
                address_type: residential
                address_line1: 525 S Winchester Blvd
                city_locality: San Jose
                state_province: CA
                postal_code: "95128"
                country_code: US
              items:
                - name: T-Shirt
                  quantity: 2
                  price: 19.99
                  weight:
                    value: 8
                    unit: ounce
                  dimensions:
                    length: 10
                    width: 8
                    height: 1
                    unit: inch
              currency: USD
      responses:
        "200":
          description: The calculated rates for the cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/calculate_checkout_rates_response_body"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v2/checkout_rates/quotes/{quote_id}:
    x-visibility: public
    summary: A checkout rate quote
    parameters:
      - name: quote_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: f1a2b3c4-d5e6-7890-abcd-ef1234567890
        description: The unique identifier of a previously calculated rate quote.
    get:
      operationId: get_checkout_rates_quote
      summary: Get a checkout rate quote
      description: |
        Retrieve a previously calculated rate quote, including the destination it was calculated for and the rates that were returned.

        > **Note:** Quotes are retained for a limited time. A request for an expired or unknown `quote_id` returns `404 Not Found`.
      tags:
        - checkout_rates
      x-plan:
        - ss-api-free_plan
        - ss-api-advanced_and_enterprise_plans
        - ss-standard_and_premium_plans
      responses:
        "200":
          description: The requested rate quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkout_rates_quote_response_body"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

tags:
  - name: account
    description: |
      Manage account settings, including label image preferences and configurations.
    x-displayName: Account

  - name: addresses
    description: |
      Validate shipping addresses to ensure accuracy and improve delivery success rates.
    x-displayName: Addresses

  - name: batches
    description: |
      Process labels in bulk and receive a large number of labels and customs forms in bulk responses. Batching is ideal for workflows that need to process hundreds or thousands of labels quickly.
    x-displayName: Batches

  - name: carriers
    description: |
      Retreive useful details about the carriers connected to your accounts, including carrier IDs, service IDs, advanced options, and available carrier package types.
    x-displayName: Carriers

  - name: checkout_rates
    description: |
      Configure the shipping options your buyers see at checkout and calculate live shipping rates for a cart.

      A **checkout rates configuration** groups one or more **delivery options** (for example, `live_rate`, `flat_rate`, `free`, or `local_delivery`) under a single storefront. Once a configuration exists, call the quotes endpoint to return the rates a buyer should see for a given destination and cart.

      This feature proxies to the Delivery Options service and translates external identifiers (`carrier_id`, `service_code`) to the account's connected carriers and services automatically.
    x-displayName: Checkout Rates

  - name: connections
    description: |
      Manage carrier connections, including adding new carriers, updating settings, and managing payment information.
    x-displayName: Connections

  - name: documents
    description: |
      Document Upload lets you submit self-prepared customs paperwork — such as Pro Forma Invoices, USMCA forms (for example, the USMCA Certification of Origin), and other supporting documents — directly to the carrier. Use it whenever a shipment requires supplemental international documentation, helping to prevent customs delays and delivery issues.

      Documents can be provided at either the **shipment level** or the **label level** — that is, before or after a label is generated:

      - **Shipment level (before a label exists).** Register the document with [Register a document for a shipment](#operation/register_shipment_document). Documents registered at the shipment level are forwarded to the carrier automatically.
      - **Label level (after a label is generated).** Register the document with [Register a document for a label](#operation/register_label_document), then call [Send label documents](#operation/send_label_documents) to transmit it to the carrier.

      To enable document upload for a shipment or label, set the `pending_documents` flag on the shipment's `customs` object.

      SS API: You can also suppress a carrier-generated document by setting the `suppress_carrier_generated_documents` [advanced option](/advanced-options) on the shipment. Currently, only the commercial invoice is supported, and only for UPS.

      Carrier Document Upload is currently supported for **UPS** and **FedEx** only. Accepted document types and file size vary by carrier — see the [Carrier Document Upload guide](/upload-carrier-documents) for the full list.

      For **step-by-step instructions on uploading documents through the ShipStation API dashboard**, see the [Customs Declarations: Document Upload help article](https://help.shipstation.com/hc/en-us/articles/50888603341211). This is useful for operations teams who need to upload documents manually or as a fallback if API integration issues occur.
    x-displayName: Documents

  - name: downloads
    description: |
      Download your label files in PDF, PNG, and ZPL.
    x-displayName: Downloads

  - name: freight
    description: |
      Quote, book, track, and manage less-than-truckload (LTL) freight shipments through a freight provider connected to your account.
    x-displayName: Freight

  - name: fulfillments
    description: |
      Manage fulfillments which represent completed shipments. Create fulfillments to mark orders as shipped with tracking information and notify customers and marketplaces.
    x-displayName: Fulfillments

  - name: inventory
    description: |
      Manage inventory levels, warehouses, and locations.
    x-displayName: Inventory

  - name: labels
    description: |
      Purchase and print shipping labels for any carrier active on your account. The labels endpoint also supports creating return labels, voiding labels, and getting label details like tracking.
    x-displayName: Labels

  - name: mailing
    description: |
      Create mailing labels for USPS including NetStamps, mail labels and envelopes.
    x-displayName: Mailing

  - name: manifests
    description: |
      A manifest is a document that provides a list of the day's shipments. It typically contains a barcode that allows the pickup driver to scan a single document to register all shipments, rather than scanning each shipment individually.
    x-displayName: Manifests

  - name: package_pickups
    description: Scheduled pickups and manage pickup requests for supported carriers.
    x-displayName: Package Pickups

  - name: package_types
    description: |
      Create custom package types to use for your shipments, rather than the carriers' default package types.
    x-displayName: Package Types

  - name: products
    description: |
      Manage products in your ShipStation account. Products represent the items you sell and ship to customers.
    x-displayName: Products

  - name: purchase_orders
    description: |
      Create and manage purchase orders from suppliers to replenish inventory. Track order status, receive products, and update inventory levels automatically.
    x-displayName: Purchase Orders

  - name: rates
    description: |
      Quickly compare rates using the Rates endpoint. You can see and compare rates for the carriers connected to your account (as long as they support sending rates).
    x-displayName: Rates

  - name: rate_shoppers
    description: |
      Manage rate shoppers. Rate shoppers define carrier service collections and rules for automatic rate selection when purchasing labels. Includes both default strategies (cheapest, fastest, best_value) and custom seller-configured rate shoppers.
    x-displayName: Rate Shoppers

  - name: service_points
    description: |
      Search for carrier service points (pickup and drop-off locations) where shipments can be delivered or picked up by customers.
    x-displayName: Service Points

  - name: shipments
    description: |
      Shipments are at the core of most ShipStation capabilities. Shipment objects are required for cretaing labels and manifests, as well as getting rates.
    x-displayName: Shipments

  - name: suppliers
    description: |
      Manage supplier information including contact details, email addresses, and physical addresses. Suppliers are used when creating purchase orders.
    x-displayName: Suppliers

  - name: tags
    description: |
      Tags are text-based identifiers you can add to shipments to help in your shipment management workflows.
    x-displayName: Tags

  - name: totes
    description: |
      Manage totes (bins or containers) used in warehouse picking and packing operations. Create, update, delete totes and track tote quantities by warehouse.
    x-displayName: Totes

  - name: tokens
    description: |
      Manage authentication tokens for accessing ShipStation services and dashboards.
    x-displayName: Tokens

  - name: tracking
    description: |
      Use the tracking endpoint to stop receiving tracking updates (more dedicated tracking endpoint methods coming soon).
    x-displayName: Tracking

  - name: warehouses
    description: |
      Get warehouse details like warehouse ID and related addresses using the warehouses endpoint.
    x-displayName: Warehouses

  - name: users
    description: |
      Manage and retrieve user information for the ShipStation account. This endpoint allows you to list users with various filtering options.
    x-displayName: Users

  - name: webhooks
    description: |
      Webhooks are a powerful feature that can save you from sending repeated polling requests to check on the state of something. With webhooks, ShipStation will automatically contact your servers when the stage changes. This can include parcel tracking events, notification when a batch operation completes, and more.
    x-displayName: Webhooks

components:
  securitySchemes:
    api_keys:
      description: |
        Generate your secret API key in the app settings.
      name: api-key
      type: apiKey
      in: header
  schemas:
    product:
      type: object
      properties:
        product_id:
          type: integer
          description: Unique identifier for the product
          example: 10736794
        sku:
          type: string
          description: Stock Keeping Unit identifier
          example: "K1"
        name:
          type: string
          description: Product name
          example: "Test Product"
